<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪洨餐館 - MVP 核心架構 (第一人稱視角)</title>
    <style>
        /* 基礎重置與背景 */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 遊戲主容器 */
        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            margin-top: 20px;
            background-color: #2c3e50;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Canvas 與 Video */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        video {
            display: none;
        }

        /* 遊戲內疊加 UI 層 (HUD) */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            /* 讓滑鼠點擊可以穿透到下方的 HTML/Canvas */
        }

        .hud {
            position: absolute;
            padding: 15px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #status-hud {
            top: 15px;
            left: 15px;
            display: none;
        }

        /* 預設隱藏，遊戲中才顯示 */
        #satisfaction-bar-container {
            width: 220px;
            height: 22px;
            background: #333;
            border-radius: 11px;
            overflow: hidden;
            margin-top: 8px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        #satisfaction-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            transition: width 0.1s, background 0.3s;
        }

        /* --- 宏觀狀態 UI 面板 (HTML 實作) --- */
        .panel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent; /* 改為透明，讓下方的 Canvas 雙手能透出來 */
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* 標題畫面 */
        #title-screen h1 {
            font-size: 64px;
            color: #f1c40f;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
        }

        #title-screen p {
            font-size: 24px;
            color: #ccc;
            margin-bottom: 40px;
        }

        /* 關卡選擇畫面 */
        #level-select-screen h2 {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 30px;
        }

        .level-grid {
            display: flex;
            gap: 20px;
        }

        .level-card {
            background: rgba(44, 62, 80, 0.75); /* 改為半透明，讓後方的手勢特效能透出來 */
            border: 2px solid #34495e;
            border-radius: 12px;
            padding: 20px;
            width: 180px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            position: relative;
        }

        .level-card:hover {
            transform: translateY(-5px);
            background: rgba(52, 73, 94, 0.85);
        }

        .level-card.locked {
            opacity: 0.5;
            filter: grayscale(100%);
            cursor: not-allowed;
        }

        .level-card.locked:hover {
            transform: none;
            background: rgba(44, 62, 80, 0.75);
        }

        .level-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .level-stars {
            font-size: 24px;
            color: #f1c40f;
            letter-spacing: 2px;
        }

        /* 結算畫面 */
        #result-screen h2 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        #result-money {
            font-size: 48px;
            color: #2ecc71;
            margin-bottom: 5px;
        }

        #result-penalty {
            font-size: 24px;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        #result-stars {
            font-size: 48px;
            color: #f1c40f;
            margin-bottom: 30px;
            letter-spacing: 5px;
        }

        /* 共用按鈕樣式 (HTML 按鈕，僅供滑鼠測試或未來替換為手勢觸發) */
        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: rgba(231, 76, 60, 0.85); /* 改為半透明 */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(192, 57, 43, 0.85);
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 10px;
            position: relative;
        }

        .btn:hover {
            background: rgba(231, 76, 60, 0.95);
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(192, 57, 43, 0.85);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .hand-hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.9), 0 0 18px rgba(241, 196, 15, 0.6);
        }

        /* Overcooked 風格訂單 UI */
        #order-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 50;
            pointer-events: none;
        }

        .order-card {
            width: 120px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid #fff;
            transition: transform 0.3s;
        }

        .order-patience-bg {
            width: 100%;
            height: 10px;
            background: #eee;
        }

        .order-patience-fill {
            height: 100%;
            background: #27ae60;
            width: 100%;
            transition: width 0.1s;
        }

        .order-icon {
            font-size: 40px;
            margin: 10px 0;
        }

        .order-type-text {
            font-size: 14px;
            color: #333;
            font-weight: bold;
            padding-bottom: 5px;
        }

        .order-status {
            font-size: 12px;
            color: #666;
            padding: 2px 0;
            background: #f1f1f1;
            width: 100%;
            text-align: center;
        }

        /* 盤子顯示 */
        #plate-display {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 20px;
            color: white;
            border: 2px solid white;
            z-index: 40;
            display: none;
        }
    </style>
    <!-- Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>

<body>

    <div id="game-container">
        <div id="loading">載入 MediaPipe 模型與相機中...</div>
        <video id="webcam" width="960" height="540" autoplay playsinline></video>
        <canvas id="game-canvas" width="960" height="540"></canvas>

        <!-- 訂單 UI 容器 -->
        <div id="order-container"></div>
        
        <div id="plate-display">🍽️ 乾淨盤子: <span id="plate-count">2</span></div>

        <!-- 遊戲進行中的 HUD (目前隱藏，進入 GAMEPLAY 才顯示) -->
        <div id="ui-layer">
            <div id="status-hud" class="hud" style="display: none;">
                <div style="font-size: 1.1em;">目標金額: $<span id="target-display">0</span> | 時間: <span id="time-display"
                        style="color:#e74c3c; font-weight:bold;">0</span>s</div>
                <div style="font-size: 1.1em; margin-top: 5px;">目前位置: <span id="location-display"
                        style="font-weight:bold; color:#3498db;">COUNTER (櫃檯)</span></div>
                <div style="margin-top: 5px;">營業額: $<span id="score-display"
                        style="font-weight:bold; font-size: 1.2em; color:#2ecc71;">0</span>
                    <span id="review-display" style="color:#e74c3c; font-size:0.9em; margin-left:10px; display:none;">負評: 0</span>
                </div>
            </div>
        </div>

        <!-- 標題畫面 (TITLE) -->
        <div id="title-screen" class="panel-overlay hidden">
            <h1>42號義麵店</h1>
            <p>雙手與微笑，是最好的調味料</p>
            <button class="btn" onclick="changeMacroState('LEVEL_SELECT')">開始營業</button>
        </div>

        <!-- 關卡選擇畫面 (LEVEL_SELECT) -->
        <div id="level-select-screen" class="panel-overlay hidden">
            <h2>選擇關卡</h2>
            <div class="level-grid" id="level-grid-container">
                <!-- 由 JS 動態生成 -->
            </div>
            <button class="btn" onclick="changeMacroState('TITLE')"
                style="margin-top: 40px; background:#7f8c8d; box-shadow: 0 4px 0 #546e7a;">返回標題</button>
        </div>

        <!-- 結算畫面 (LEVEL_RESULT) -->
        <div id="result-screen" class="panel-overlay hidden">
            <h2 id="result-title">關卡結算</h2>
            <div>總營業額</div>
            <div id="result-money">$0</div>
            <div id="result-penalty">負評扣分: -$0</div>
            <div id="result-stars">☆☆☆</div>
            <div style="display: flex; gap: 20px;">
                <button class="btn" onclick="changeMacroState('LEVEL_SELECT')"
                    style="background:#3498db; box-shadow: 0 4px 0 #2980b9;">回關卡選單</button>
                <button class="btn" id="btn-next-level" onclick="startNextLevel()" style="display:none;">下一關</button>
            </div>
        </div>
    </div>

    <!-- 除錯用的狀態強制切換按鈕 -->
    <div id="controls">
        <button onclick="setMicroLocation('COUNTER')">切換: 櫃檯 (COUNTER)</button>
        <button onclick="setMicroLocation('DINING_ROOM')">切換: 用餐區 (DINING_ROOM) [測試打掃]</button>
        <button onclick="setMicroLocation('KITCHEN')">切換: 廚房 (KITCHEN) [測試洗碗]</button>
    </div>

    <script type="module">
        window.addEventListener('error', function (e) {
            alert('Error: ' + e.message + ' at ' + e.lineno);
        });

        import {
            FaceLandmarker,
            HandLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- 遊戲架構狀態變數 ---
        let macroState = 'LOADING'; // LOADING, TITLE, LEVEL_SELECT, GAMEPLAY, LEVEL_RESULT
        let microLocation = 'COUNTER'; // COUNTER, KITCHEN, DINING_ROOM

        // 關卡設定
        const LEVELS = [
            { id: 1, targetMoney: 50, time: 60, tables: 2 },
            { id: 2, targetMoney: 150, time: 90, tables: 3 },
            { id: 3, targetMoney: 300, time: 120, tables: 4 }
        ];
        let currentLevelIndex = 0;
        let gameTimer = 0;
        let gameTimerInterval = null;

        // 存檔系統 (記錄每一關的最高星星數，0代表未解鎖/未過關)
        let saveMemory = {
            stars: [0, 0, 0] // 對應 LEVEL 1, 2, 3
        };

        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 540;
        let score = 0; // 改為金錢
        let isSmiling = false;
        let customers = [];
        let droppedMoney = [];
        let customerSpawnTimer = 0;
        let negativeReviews = 0; // 負評數量

        // 廚房料理系統
        let activeOrder = null; // 目前正在處理的訂單
        let cookState = 'IDLE'; // IDLE, PUT_PASTA, BOILING, PLATE_PASTA, ADD_CEMENT, ADD_CILANTRO, STIRRING, SERVE
        let dragItem = null; // 當前手上抓取的物品: 'RAW_PASTA', 'COOKED_PASTA', 'CEMENT', 'CILANTRO', 'FINISHED_PLATE'
        let cookProgress = 0;
        let stirProgress = 0;
        const STIR_THRESHOLD = 1200; // 攪拌閾值
        
        let washingPlate = { x: 380, y: 170, w: 200, h: 200, dirtAmount: 100 };
        let lastHandPos = null;
        let scrubAccumulator = 0;
        const SCRUB_THRESHOLD = 5000;
        let cleanPlates = 2; // 初始盤子數量
        const MAX_PLATES = 2; // 最大盤子數量 (第一關)
        let stains = [];
        let trashBodies = [];
        const TABLE_POSITIONS = [
            { x: 250, y: 400 },
            { x: 480, y: 400 },
            { x: 710, y: 400 },
            { x: 480, y: 200 }
        ];

        // 導航停留偵測 (Dwell Navigation)
        let hoverTarget = null;
        let hoverStartTime = 0;
        const HOVER_DWELL_TIME = 1500; // 停留 1.5 秒觸發
        const NAV_ZONES = {
            KITCHEN: { x: 0, y: 190, w: 100, h: 160 }, // 移至左側
            COUNTER: { x: 420, y: 0, w: 120, h: 130 }, // 視情況調整，暫定
            DINING_ROOM: { x: 860, y: 190, w: 100, h: 160 },
            SINK: { x: 420, y: 440, w: 120, h: 100 } // 洗手台移至正下方
        };
        let dwellProgress = 0;
        let dwellCooldown = 0;
        const DWELL_COOLDOWN_TIME = 1000;
        let activeHandPositions = [];
        let uiHoverTarget = null;
        let uiHoverStartTime = 0;
        let uiDwellProgress = 0;
        let uiDwellCooldown = 0;
        const UI_DWELL_TIME = 1200;
        const UI_COOLDOWN_TIME = 800;
        let registeredUiElements = [];

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');
        const stateDisplay = document.getElementById('location-display');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const targetDisplay = document.getElementById('target-display');
        const statusHud = document.getElementById('status-hud');
        const reviewDisplay = document.getElementById('review-display');
        const plateDisplay = document.getElementById('plate-display');
        const plateCountEl = document.getElementById('plate-count');
        const orderContainer = document.getElementById('order-container');

        // UI 畫面元素
        const titleScreen = document.getElementById('title-screen');
        const levelSelectScreen = document.getElementById('level-select-screen');
        const resultScreen = document.getElementById('result-screen');
        const levelGrid = document.getElementById('level-grid-container');

        let faceLandmarker, handLandmarker;
        let lastVideoTime = -1;
        let faceResult = null, handResult = null;

        // 手部骨架連接對應表
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [5, 9], [9, 10], [10, 11], [11, 12],
            [9, 13], [13, 14], [14, 15], [15, 16],
            [13, 17], [17, 18], [18, 19], [19, 20],
            [0, 17]
        ];

        async function initMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );

            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                    delegate: "GPU"
                },
                outputFaceBlendshapes: true,
                runningMode: "VIDEO",
                numFaces: 1
            });

            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });

            startCamera();
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: GAME_WIDTH, height: GAME_HEIGHT } });
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    loadingEl.classList.add('hidden');
                    initMatterJs();
                    loadSaveData();
                    changeMacroState('TITLE'); // 載入完成，進入標題畫面
                    requestAnimationFrame(gameLoop);
                });
            } catch (err) {
                alert("無法存取攝影機，請確認權限或在 Localhost/HTTPS 環境下執行。");
            }
        }

        // --- 存檔系統 ---
        function loadSaveData() {
            const saved = localStorage.getItem('42PastaSave');
            if (saved) {
                saveMemory = JSON.parse(saved);
            } else {
                // 初次遊玩，解鎖第一關
                saveMemory = { stars: [0, 0, 0] };
                saveMemory.stars[0] = 0; // 0星但可玩
            }
        }
        function saveGame() {
            localStorage.setItem('42PastaSave', JSON.stringify(saveMemory));
        }

        // --- 宏觀狀態切換 ---
        window.changeMacroState = function (newState) {
            macroState = newState;
            // 隱藏所有面板
            titleScreen.classList.add('hidden');
            levelSelectScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            statusHud.style.display = 'none';

            if (newState === 'TITLE') {
                titleScreen.classList.remove('hidden');
                plateDisplay.style.display = 'none';
                orderContainer.innerHTML = '';
            } else if (newState === 'LEVEL_SELECT') {
                buildLevelSelectUI();
                levelSelectScreen.classList.remove('hidden');
                plateDisplay.style.display = 'none';
            } else if (newState === 'GAMEPLAY') {
                statusHud.style.display = 'block';
                plateDisplay.style.display = 'block';
                startLevel(currentLevelIndex);
            } else if (newState === 'LEVEL_RESULT') {
                showResultScreen();
                plateDisplay.style.display = 'none';
            }

            updateUiTargets();
        };

        // --- 關卡選擇與初始化 ---
        function buildLevelSelectUI() {
            levelGrid.innerHTML = '';
            LEVELS.forEach((level, index) => {
                const isLocked = index > 0 && saveMemory.stars[index - 1] < 2; // 需要前一關2星解鎖

                const card = document.createElement('div');
                card.className = `level-card ${isLocked ? 'locked' : ''}`;

                let starText = isLocked ? '🔒' : '☆'.repeat(3);
                if (!isLocked && saveMemory.stars[index] > 0) {
                    starText = '★'.repeat(saveMemory.stars[index]) + '☆'.repeat(3 - saveMemory.stars[index]);
                }

                card.innerHTML = `
                    <div class="level-title">關卡 ${level.id}</div>
                    <div style="font-size: 14px; color: #bdc3c7; margin-bottom: 10px;">目標: $${level.targetMoney} / ${level.time}s</div>
                    <div class="level-stars">${starText}</div>
                `;

                if (!isLocked) {
                    card.onclick = () => {
                        currentLevelIndex = index;
                        changeMacroState('GAMEPLAY');
                    };
                }
                levelGrid.appendChild(card);
            });

            updateUiTargets();
        }

        function updateUiTargets() {
            registeredUiElements = [];
            if (macroState === 'TITLE') {
                const startBtn = titleScreen.querySelector('.btn');
                if (startBtn) {
                    registeredUiElements.push({
                        el: startBtn,
                        action: () => startBtn.click()
                    });
                }
            } else if (macroState === 'LEVEL_SELECT') {
                const cards = levelGrid.querySelectorAll('.level-card:not(.locked)');
                cards.forEach((card) => {
                    registeredUiElements.push({
                        el: card,
                        action: () => {
                            if (typeof card.onclick === 'function') card.onclick();
                            else card.click();
                        }
                    });
                });
                const backBtn = levelSelectScreen.querySelector('.btn');
                if (backBtn) {
                    registeredUiElements.push({
                        el: backBtn,
                        action: () => backBtn.click()
                    });
                }
            } else if (macroState === 'LEVEL_RESULT') {
                const backBtn = resultScreen.querySelector('.btn');
                if (backBtn) {
                    registeredUiElements.push({
                        el: backBtn,
                        action: () => backBtn.click()
                    });
                }
                const nextBtn = document.getElementById('btn-next-level');
                if (nextBtn && nextBtn.style.display !== 'none') {
                    registeredUiElements.push({
                        el: nextBtn,
                        action: () => nextBtn.click()
                    });
                }
            }

            registeredUiElements.forEach(item => {
                item.el.classList.remove('hand-hover');
            });
        }

        function startLevel(index) {
            const levelData = LEVELS[index];
            score = 0;
            scoreDisplay.innerText = score;
            targetDisplay.innerText = levelData.targetMoney;
            gameTimer = levelData.time;
            timeDisplay.innerText = gameTimer;

            customers = [];
            droppedMoney.forEach(m => World.remove(world, m.body));
            droppedMoney = [];
            customerSpawnTimer = 60; // 1秒後生第一位
            negativeReviews = 0;
            reviewDisplay.style.display = 'none';
            reviewDisplay.innerText = '負評: 0';
            cleanPlates = 2; // 每一關重置盤子
            plateCountEl.innerText = cleanPlates;

            setMicroLocation('COUNTER'); // 遊戲開始預設在櫃檯

            // 啟動倒數計時器
            if (gameTimerInterval) clearInterval(gameTimerInterval);
            gameTimerInterval = setInterval(() => {
                if (macroState === 'GAMEPLAY') {
                    gameTimer--;
                    timeDisplay.innerText = gameTimer;
                    if (gameTimer <= 0) {
                        clearInterval(gameTimerInterval);
                        changeMacroState('LEVEL_RESULT');
                    }
                }
            }, 1000);
        }

        function showResultScreen() {
            const levelData = LEVELS[currentLevelIndex];
            const penalty = negativeReviews * 15; // 每個負評扣 15 元
            const finalScore = Math.max(0, score - penalty);

            document.getElementById('result-money').innerText = `$${score}`;
            document.getElementById('result-penalty').innerText = `負評扣分: -$${penalty} (${negativeReviews} 個負評)`;

            // 計算星星 (依據扣分後的最終分數)
            let earnedStars = 0;
            if (finalScore >= levelData.targetMoney * 1.5) earnedStars = 3;
            else if (finalScore >= levelData.targetMoney) earnedStars = 2;
            else if (finalScore >= levelData.targetMoney * 0.5) earnedStars = 1;

            let starDisplay = '';
            for (let i = 0; i < 3; i++) starDisplay += (i < earnedStars) ? '★' : '☆';
            document.getElementById('result-stars').innerText = starDisplay;

            // 存檔更新
            if (earnedStars > saveMemory.stars[currentLevelIndex]) {
                saveMemory.stars[currentLevelIndex] = earnedStars;
                saveGame();
            }

            // 判斷是否顯示下一關按鈕 (有下一關且拿到2星以上)
            const nextBtn = document.getElementById('btn-next-level');
            if (currentLevelIndex < LEVELS.length - 1 && earnedStars >= 2) {
                nextBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'none';
            }

            resultScreen.classList.remove('hidden');
            updateUiTargets();
        }

        window.startNextLevel = function () {
            currentLevelIndex++;
            changeMacroState('GAMEPLAY');
        };

        // --- 微觀空間切換 (Micro Location) ---
        window.setMicroLocation = function (loc) {
            if (macroState !== 'GAMEPLAY') return;
            
            // 離開舊空間的清理
            if (microLocation === 'COUNTER') {
                droppedMoney.forEach(m => World.remove(world, m.body));
            } else if (microLocation === 'DINING_ROOM') {
                trashBodies.forEach(b => World.remove(world, b));
                trashBodies = [];
                stains = [];
            }

            microLocation = loc;
            stateDisplay.innerText = loc;
            scrubAccumulator = 0;
            
            // 進入新空間的初始化
            if (loc === 'SINK') {
                washingPlate.dirtAmount = 100;
            } else if (loc === 'COUNTER') {
                droppedMoney.forEach(m => World.add(world, m.body));
            } else if (loc === 'DINING_ROOM') {
                // 為了測試，進入用餐區時直接生成打掃事件
                cleaningSubState = 'INIT';
                setTimeout(() => { cleaningSubState = 'CLEAR_TRASH'; }, 1500); // 提示 1.5 秒後開始
                lastOrderType = Math.random() > 0.5 ? 'PASTA' : 'DRINK';

                // 生成特定餐具垃圾
                if (lastOrderType === 'PASTA') {
                    let plate = Bodies.circle(480, 300, 60, { frictionAir: 0.1, label: 'trash_plate', restitution: 0.2 });
                    let fork = Bodies.rectangle(600, 300, 20, 100, { frictionAir: 0.1, label: 'trash_utensil', restitution: 0.2 });
                    trashBodies.push(plate, fork);
                    World.add(world, [plate, fork]);
                } else {
                    let cup = Bodies.rectangle(480, 300, 40, 70, { frictionAir: 0.1, label: 'trash_cup', restitution: 0.2 });
                    trashBodies.push(cup);
                    World.add(world, cup);
                }

                // 生成紙團
                const paperCount = 2 + Math.floor(Math.random() * 3);
                for (let i = 0; i < paperCount; i++) {
                    let trash = Bodies.circle(200 + Math.random() * 560, 150 + Math.random() * 250, 25, {
                        frictionAir: 0.15,
                        label: 'trash_paper',
                        restitution: 0.3
                    });
                    trashBodies.push(trash);
                    World.add(world, trash);
                }

                for (let i = 0; i < 5; i++) {
                    stains.push({
                        x: 200 + Math.random() * 560,
                        y: 150 + Math.random() * 250,
                        r: 45,
                        alpha: 1.0
                    });
                }
            }
        };

        // --- Phase 2: 手部滯留導航 (Dwell Navigation) ---
        function checkDwellNavigation() {
            if (macroState !== 'GAMEPLAY') return;
            if (Date.now() < dwellCooldown) {
                hoverTarget = null;
                dwellProgress = 0;
                return;
            }

            let currentZone = null;
            for (const [key, zone] of Object.entries(NAV_ZONES)) {
                if (key === microLocation) continue;
                for (const pos of activeHandPositions) {
                    if (pos.x >= zone.x && pos.x <= zone.x + zone.w &&
                        pos.y >= zone.y && pos.y <= zone.y + zone.h) {
                        currentZone = key;
                        break;
                    }
                }
                if (currentZone) break;
            }

            if (currentZone) {
                if (hoverTarget === currentZone) {
                    const elapsed = Date.now() - hoverStartTime;
                    dwellProgress = Math.min(1, elapsed / HOVER_DWELL_TIME);
                    if (dwellProgress >= 1) {
                        setMicroLocation(currentZone);
                        hoverTarget = null;
                        dwellProgress = 0;
                        dwellCooldown = Date.now() + DWELL_COOLDOWN_TIME;
                    }
                } else {
                    hoverTarget = currentZone;
                    hoverStartTime = Date.now();
                    dwellProgress = 0;
                }
            } else {
                hoverTarget = null;
                dwellProgress = 0;
            }
        }

        // --- 主選單/關卡選單/結算畫面：手勢滯留操作 ---
        function checkUiDwellActions() {
            if (macroState === 'GAMEPLAY' || macroState === 'LOADING') return;
            if (Date.now() < uiDwellCooldown) {
                if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                uiHoverTarget = null;
                uiDwellProgress = 0;
                return;
            }

            let currentTarget = null;
            let currentAction = null;

            for (const item of registeredUiElements) {
                const rect = item.el.getBoundingClientRect();
                const canvasRect = canvas.getBoundingClientRect();
                const zone = {
                    x: rect.left - canvasRect.left,
                    y: rect.top - canvasRect.top,
                    w: rect.width,
                    h: rect.height
                };
                for (const pos of activeHandPositions) {
                    if (pos.x >= zone.x && pos.x <= zone.x + zone.w &&
                        pos.y >= zone.y && pos.y <= zone.y + zone.h) {
                        currentTarget = item.el;
                        currentAction = item.action;
                        break;
                    }
                }
                if (currentTarget) break;
            }

            if (currentTarget) {
                if (uiHoverTarget === currentTarget) {
                    const elapsed = Date.now() - uiHoverStartTime;
                    uiDwellProgress = Math.min(1, elapsed / UI_DWELL_TIME);
                    if (uiDwellProgress >= 1) {
                        try {
                            currentAction();
                        } catch (e) {
                            console.error("Action Error: ", e);
                        }
                        if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                        uiHoverTarget = null;
                        uiDwellProgress = 0;
                        uiDwellCooldown = Date.now() + UI_COOLDOWN_TIME;
                        return; // 執行完動作後直接跳出，避免對 null 操作
                    }
                } else {
                    if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                    uiHoverTarget = currentTarget;
                    uiHoverStartTime = Date.now();
                    uiDwellProgress = 0;
                }

                if (uiHoverTarget) {
                    uiHoverTarget.classList.add('hand-hover');
                }
            } else {
                if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                uiHoverTarget = null;
                uiDwellProgress = 0;
            }
        }

        const Engine = Matter.Engine,
            World = Matter.World,
            Bodies = Matter.Bodies,
            Body = Matter.Body,
            Events = Matter.Events;

        let engine, world;
        let rightHandBody;
        let leftHandBody;

        let cleaningSubState = 'INIT'; // INIT, CLEAR_TRASH, TRANSITION, WIPE_TABLE, DONE
        let lastOrderType = 'PASTA';

        function initMatterJs() {
            engine = Engine.create();
            world = engine.world;
            engine.world.gravity.y = 0;

            rightHandBody = Bodies.circle(-100, -100, 60, {
                isStatic: true,
                label: 'rightHand'
            });
            leftHandBody = Bodies.circle(-100, -100, 60, {
                isStatic: true,
                label: 'leftHand'
            });
            World.add(world, [rightHandBody, leftHandBody]);
        }

        function gameLoop() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                faceResult = faceLandmarker.detectForVideo(video, performance.now());
                handResult = handLandmarker.detectForVideo(video, performance.now());
            }

            Engine.update(engine, 1000 / 60);

            // 客人排隊邏輯
            if (macroState === 'GAMEPLAY') {
                customerSpawnTimer--;
                // 這裡的 customers.length < LEVELS[currentLevelIndex].tables 代表「有空位才會來新客人」
                // 等之後 Phase 4，會把這個條件改成 (櫃檯排隊人數 + 用餐區佔位人數) < 總座位數
                if (customerSpawnTimer <= 0 && customers.length < LEVELS[currentLevelIndex].tables) {
                    const rand = Math.random();
                    let type = 'PASTA_NORMAL';
                    if (rand < 0.33) type = 'PASTA_CILANTRO';
                    else if (rand < 0.66) type = 'PASTA_CEMENT';
                    else type = 'PASTA_CEMENT_CILANTRO';

                    customers.push({
                        id: Date.now(),
                        orderType: type,
                        state: 'ORDERING', // ORDERING, WAITING_FOOD
                        patience: 100,
                        serveDwell: 0
                    });
                    // 基礎 4 秒生一個 + 每個負評增加 1.5 秒的生成時間
                    customerSpawnTimer = 240 + (negativeReviews * 90);
                }
                for (let i = customers.length - 1; i >= 0; i--) {
                    let c = customers[i];
                    // 坐在位子上等餐 (WAITING_FOOD) 通常比站在櫃檯點餐有耐心
                    const patienceLoss = (c.state === 'WAITING_FOOD') ? 0.02 : 0.08;
                    c.patience -= patienceLoss;

                    if (c.patience <= 0) {
                        // 如果是正在處理的訂單對象氣走了
                        if (activeOrder && activeOrder.id === c.id) {
                            activeOrder = null;
                            cookState = 'IDLE';
                            dragItem = null;
                        }
                        customers.splice(i, 1);
                        negativeReviews++;
                        customerSpawnTimer += 180;
                        updateReviews();
                    }
                }
            }

            // 檢查垃圾是否被撥出畫面
            if (microLocation === 'DINING_ROOM') {
                if (cleaningSubState === 'CLEAR_TRASH') {
                    trashBodies = trashBodies.filter(body => {
                        const px = body.position.x;
                        const py = body.position.y;
                        if (px < 50 || px > 910 || py < 50 || py > 550) {
                            World.remove(world, body);
                            updateScore(5); // 賺取清理費
                            return false;
                        }
                        return true;
                    });

                    if (trashBodies.length === 0) {
                        cleaningSubState = 'TRANSITION';
                        setTimeout(() => {
                            cleaningSubState = 'WIPE_TABLE';
                        }, 1500);
                    }
                }
            }

            ctx.save();
            ctx.scale(-1, 1);
            ctx.translate(-GAME_WIDTH, 0);

            // 永遠繪製攝影機，讓選單狀態也能看到手
            ctx.drawImage(video, 0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 根據狀態加深背景
            ctx.fillStyle = macroState === 'GAMEPLAY' ? 'rgba(10, 15, 20, 0.75)' : 'rgba(10, 15, 20, 0.85)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.restore();

            handleHandLogic(); // 執行手勢邏輯 (UI判定、物理座標等)

            if (macroState === 'GAMEPLAY') {
                updateOrderUI(); // 更新頂部訂單列
                handleFaceLogic();
                renderGame();
            }

            // 永遠繪製第一人稱手部 (不管哪個狀態都畫)
            if (handResult && handResult.landmarks) {
                const isWipeMode = (macroState === 'GAMEPLAY' && microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE');
                handResult.handednesses.forEach((h, idx) => {
                    const isRight = h[0].categoryName === 'Left'; // 鏡像反轉
                    drawFirstPersonHand(handResult.landmarks[idx], isRight, isWipeMode);
                });
            }

            requestAnimationFrame(gameLoop);
        }

        function handleFaceLogic() {
            if (microLocation !== 'COUNTER') return; // 不在櫃檯不判定微笑

            isSmiling = false;
            if (faceResult && faceResult.faceBlendshapes.length > 0) {
                const blendshapes = faceResult.faceBlendshapes[0].categories;
                const smileLeft = blendshapes.find(c => c.categoryName === 'mouthSmileLeft')?.score || 0;
                const smileRight = blendshapes.find(c => c.categoryName === 'mouthSmileRight')?.score || 0;
                if (smileLeft > 0.4 || smileRight > 0.4) isSmiling = true;
            }

            if (customers.length > 0) {
                let c = customers[0];
                if (isSmiling) {
                    c.patience = Math.min(100, c.patience + 0.3); // 微笑安撫恢復耐心
                }
            }
        }

        function updateOrderUI() {
            if (macroState !== 'GAMEPLAY') {
                orderContainer.innerHTML = '';
                return;
            }

            // 比對當前 UI 元素數量與客人數量，避免頻繁 innerHTML 重建
            const currentCards = orderContainer.querySelectorAll('.order-card');
            
            // 簡單處理：全量更新 (或可優化為對應更新)
            let html = '';
            customers.forEach((c, index) => {
                const icon = '🍝';
                let typeText = '義大利麵';
                if (c.orderType === 'PASTA_CILANTRO') typeText = '香菜麵';
                else if (c.orderType === 'PASTA_CEMENT') typeText = '混泥土麵';
                else if (c.orderType === 'PASTA_CEMENT_CILANTRO') typeText = '混泥土香菜麵';
                else typeText = '原味麵';

                const statusText = c.state === 'ORDERING' ? '點餐中' : '等餐中';
                const color = c.patience > 60 ? '#27ae60' : (c.patience > 30 ? '#f39c12' : '#e74c3c');
                
                html += `
                    <div class="order-card" style="border-color: ${index === 0 ? '#f1c40f' : '#fff'}">
                        <div class="order-patience-bg">
                            <div class="order-patience-fill" style="width: ${c.patience}%; background: ${color}"></div>
                        </div>
                        <div class="order-icon">${icon}</div>
                        <div class="order-type-text">${typeText}</div>
                        <div class="order-status">${statusText}</div>
                    </div>
                `;
            });
            orderContainer.innerHTML = html;
        }

        function handleHandLogic() {
            activeHandPositions = [];
            if (!handResult || handResult.landmarks.length === 0) {
                Body.setPosition(rightHandBody, { x: -100, y: -100 });
                lastHandPos = null;
                checkDwellNavigation();
                checkUiDwellActions();
                return;
            }

            let rightHandIdx = -1;
            let leftHandIdx = -1;

            handResult.handednesses.forEach((h, idx) => {
                if (h[0].categoryName === 'Left') rightHandIdx = idx;
                else leftHandIdx = idx;
            });

            if (rightHandIdx !== -1) {
                const landmarks = handResult.landmarks[rightHandIdx];
                const palm = landmarks[9];
                const px = (1 - palm.x) * GAME_WIDTH;
                const py = palm.y * GAME_HEIGHT;
                activeHandPositions.push({ x: px, y: py });

                if (macroState === 'GAMEPLAY') {
                    if (microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE') {
                        Body.setPosition(rightHandBody, { x: -100, y: -100 });
                    } else {
                        Body.setPosition(rightHandBody, { x: px, y: py });
                    }
                } else {
                    Body.setPosition(rightHandBody, { x: -100, y: -100 });
                }
            } else {
                Body.setPosition(rightHandBody, { x: -100, y: -100 });
            }

            if (leftHandIdx !== -1) {
                const landmarks = handResult.landmarks[leftHandIdx];
                const palm = landmarks[9];
                const px = (1 - palm.x) * GAME_WIDTH;
                const py = palm.y * GAME_HEIGHT;
                activeHandPositions.push({ x: px, y: py });

                if (macroState === 'GAMEPLAY') {
                    if (microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE') {
                        Body.setPosition(leftHandBody, { x: -100, y: -100 });
                    } else {
                        Body.setPosition(leftHandBody, { x: px, y: py });
                    }
                } else {
                    Body.setPosition(leftHandBody, { x: -100, y: -100 });
                }
            } else {
                Body.setPosition(leftHandBody, { x: -100, y: -100 });
            }

            // --- 統一處理空間邏輯 (依據收集到的 activeHandPositions) ---
            if (macroState === 'GAMEPLAY') {
                if (microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE') {
                    activeHandPositions.forEach(pos => checkWiping(pos.x, pos.y));
                }

                if (microLocation === 'SINK') {
                    if (washingPlate.dirtAmount > 0) {
                        activeHandPositions.forEach(pos => checkScrubbing(pos.x, pos.y));
                    }
                }
                if (microLocation === 'COUNTER') {
                    // 1. 檢查是否抓到錢
                    droppedMoney = droppedMoney.filter(m => {
                        let grabbed = false;
                        activeHandPositions.forEach(pos => {
                            let dx = pos.x - m.body.position.x;
                            let dy = pos.y - m.body.position.y;
                            if (Math.hypot(dx, dy) < 60) grabbed = true; // 抓取半徑
                        });
                        if (grabbed) {
                            updateScore(m.value);
                            World.remove(world, m.body);
                            return false;
                        }
                        return true;
                    });

                    // 2. 檢查是否在接單 (懸停在任何一位客人的點餐氣泡上)
                    customers.forEach((c, index) => {
                        if (c.state === 'ORDERING') {
                            let isHoveringOrder = false;
                            activeHandPositions.forEach(pos => {
                                let dx = pos.x - (480 + index * 150); // 根據客人索引計算氣泡 X
                                let dy = pos.y - (300 - 80); // Y
                                if (Math.hypot(dx, dy) < 60) isHoveringOrder = true;
                            });

                            if (isHoveringOrder) {
                                c.serveDwell += 0.02; // 接單進度
                                if (c.serveDwell >= 1) {
                                    // 完成接單！
                                    c.state = 'WAITING_FOOD';
                                    c.serveDwell = 0;
                                    c.patience = Math.min(100, c.patience + 20); // 接單後給予耐心獎勵
                                    
                                    // 如果目前廚房沒事幹，就把這張單傳過去
                                    if (!activeOrder) {
                                        activeOrder = c;
                                        cookState = 'PUT_PASTA';
                                        dragItem = null;
                                    }
                                }
                            } else {
                                c.serveDwell = Math.max(0, c.serveDwell - 0.01);
                            }
                        }
                    });
                }
                checkDwellNavigation();
                if (microLocation === 'KITCHEN' && activeOrder) {
                    handleCookingLogic();
                }
            }
            checkUiDwellActions();
        }

        function handleCookingLogic() {
            if (!activeOrder || activeHandPositions.length === 0) return;
            let px = activeHandPositions[0].x;
            let py = activeHandPositions[0].y;

            // 定義感應區
            const rawPastaArea = { x: 70, y: 350, w: 120, h: 120 };
            const potArea = { x: 300, y: 300, w: 150, h: 120 };
            const plateArea = { x: 750, y: 350, w: 150, h: 100 };
            const cilantroArea = { x: 70, y: 100, w: 120, h: 120 };
            const cementArea = { x: 250, y: 100, w: 120, h: 120 }; // 新增混泥土區
            const serveArea = { x: 600, y: 50, w: 200, h: 100 };

            // 狀態機
            if (cookState === 'PUT_PASTA') {
                if (!dragItem && px > rawPastaArea.x && px < rawPastaArea.x + rawPastaArea.w && py > rawPastaArea.y && py < rawPastaArea.y + rawPastaArea.h) {
                    dragItem = 'RAW_PASTA';
                }
                if (dragItem === 'RAW_PASTA' && px > potArea.x && px < potArea.x + potArea.w && py > potArea.y && py < potArea.y + potArea.h) {
                    dragItem = null;
                    cookState = 'BOILING';
                    cookProgress = 0;
                }
            } else if (cookState === 'BOILING') {
                cookProgress += 0.5;
                if (cookProgress >= 100) {
                    cookState = 'PLATE_PASTA';
                }
            } else if (cookState === 'PLATE_PASTA') {
                if (!dragItem && px > potArea.x && px < potArea.x + potArea.w && py > potArea.y && py < potArea.y + potArea.h) {
                    dragItem = 'COOKED_PASTA';
                }
                if (dragItem === 'COOKED_PASTA' && px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                    dragItem = null;
                    cookState = 'ADD_CEMENT';
                }
            } else if (cookState === 'ADD_CEMENT') {
                if (activeOrder.orderType.includes('CEMENT')) {
                    if (!dragItem && px > cementArea.x && px < cementArea.x + cementArea.w && py > cementArea.y && py < cementArea.y + cementArea.h) {
                        dragItem = 'CEMENT';
                    }
                    if (dragItem === 'CEMENT' && px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        dragItem = null;
                        cookState = 'ADD_CILANTRO';
                    }
                } else {
                    cookState = 'ADD_CILANTRO';
                }
            } else if (cookState === 'ADD_CILANTRO') {
                if (activeOrder.orderType.includes('CILANTRO')) {
                    if (!dragItem && px > cilantroArea.x && px < cilantroArea.x + cilantroArea.w && py > cilantroArea.y && py < cilantroArea.y + cilantroArea.h) {
                        dragItem = 'CILANTRO';
                    }
                    if (dragItem === 'CILANTRO' && px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        dragItem = null;
                        cookState = 'STIRRING';
                        stirProgress = 0;
                        lastHandPos = null;
                    }
                } else {
                    cookState = 'STIRRING';
                    stirProgress = 0;
                    lastHandPos = null;
                }
            } else if (cookState === 'STIRRING') {
                if (px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                    if (lastHandPos) {
                        const dist = Math.hypot(px - lastHandPos.x, py - lastHandPos.y);
                        stirProgress += dist;
                        if (stirProgress > STIR_THRESHOLD) { 
                            cookState = 'SERVE';
                            dragItem = null;
                        }
                    }
                    lastHandPos = { x: px, y: py };
                } else {
                    lastHandPos = null;
                }
            } else if (cookState === 'SERVE') {
                if (!dragItem && px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                    dragItem = 'FINISHED_PLATE';
                }
                if (dragItem === 'FINISHED_PLATE' && px > serveArea.x && px < serveArea.x + serveArea.w && py > serveArea.y && py < serveArea.y + serveArea.h) {
                    // 完成出餐！
                    if (cleanPlates > 0) {
                        cleanPlates--; // 消耗一個盤子
                        plateCountEl.innerText = cleanPlates;

                        // 移除對應需求的客人 (優先移除隊伍最前面的匹配者)
                        let servedIndex = -1;
                        if (activeOrder) {
                            for (let i = 0; i < customers.length; i++) {
                                if (customers[i].state === 'WAITING_FOOD' && customers[i].orderType === activeOrder.orderType) {
                                    servedIndex = i;
                                    break;
                                }
                            }
                        }

                        if (servedIndex !== -1) {
                            const c = customers[servedIndex];
                            // 成功匹配到客人，給錢！
                            if (c.patience > 50) {
                                updateScore(25);
                            } else {
                                let mBody = Bodies.circle(300 + Math.random() * 360, 400, 30, { restitution: 0.5, label: 'money' });
                                droppedMoney.push({ body: mBody, value: 25 });
                            }
                            customers.splice(servedIndex, 1);
                        } else {
                            // 沒匹配到客人（可能等太久跑了），不給錢
                            tipText = '❌ 找不到對應的客人需求！';
                        }
                        
                        activeOrder = null;
                        dragItem = null;
                        cookState = 'IDLE';

                        // 出餐後，自動尋找下一個「已接單但尚未開始料理」的客人
                        const nextCustomer = customers.find(c => c.state === 'WAITING_FOOD');
                        if (nextCustomer) {
                            activeOrder = nextCustomer;
                            cookState = 'PUT_PASTA';
                        }
                    } else {
                        // 沒盤子，提示玩家
                        tipText = '❌ 沒有乾淨盤子了！快去洗碗！';
                    }
                }
            }
        }

            // 畫鍋子

            // 只有在煮麵或準備盛盤且手沒抓走麵時，鍋子裡才畫水和麵

            // 畫盤子

            // 盤子內容物
            if (cookState === 'ADD_CEMENT' || cookState === 'ADD_CILANTRO' || cookState === 'STIRRING' || cookState === 'SERVE') {

                ctx.fillStyle = '#2ecc71'; // 香菜

            if (cookState === 'STIRRING') {
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 6;
                ctx.beginPath();
                const stirRatio = Math.min(1, stirProgress / STIR_THRESHOLD);
                ctx.arc(plateArea.x + plateArea.w/2, plateArea.y + plateArea.h/2, 70, -Math.PI/2, -Math.PI/2 + stirRatio * Math.PI*2);

            ctx.strokeRect(serveArea.x, serveArea.y, serveArea.w, serveArea.h);
            ctx.fillStyle = 'white';
            ctx.fillText('出餐口', serveArea.x + 70, serveArea.y + 60);

            // 繪製手上的物品
            if (dragItem && activeHandPositions.length > 0) {
                let px = activeHandPositions[0].x;
                let py = activeHandPositions[0].y;
                if (dragItem === 'RAW_PASTA') {
                    ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(px, py, 30, 0, Math.PI*2); ctx.fill();
                } else if (dragItem === 'COOKED_PASTA') {
                    ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(px, py, 30, 0, Math.PI*2); ctx.fill();
                } else if (dragItem === 'CILANTRO') {
                    ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2); ctx.fill();
                } else if (dragItem === 'CEMENT') {
                    ctx.fillStyle = '#95a5a6'; ctx.beginPath(); ctx.arc(px, py, 25, 0, Math.PI*2); ctx.fill();
                } else if (dragItem === 'FINISHED_PLATE') {
                    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(px, py, 40, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(px, py, 30, 0, Math.PI*2); ctx.fill();
                }
            }
            
            ctx.restore();
        }

        function checkWiping(px, py) {
            stains.forEach(stain => {
                if (stain.alpha > 0) {
                    const dist = Math.hypot(px - stain.x, py - stain.y);
                    if (dist < stain.r + 80) {
                        stain.alpha = Math.max(0, stain.alpha - 0.08);
                    }
                }
            });
        }

        function checkScrubbing(px, py) {
            if (px > washingPlate.x && px < washingPlate.x + washingPlate.w &&
                py > washingPlate.y && py < washingPlate.y + washingPlate.h) {

                if (lastHandPos) {
                    const dist = Math.hypot(px - lastHandPos.x, py - lastHandPos.y);
                    scrubAccumulator += dist;

                    washingPlate.dirtAmount = 100 - (scrubAccumulator / SCRUB_THRESHOLD) * 100;

                    if (washingPlate.dirtAmount <= 0) {
                        washingPlate.dirtAmount = 0;
                        cleanPlates = Math.min(MAX_PLATES, cleanPlates + 1);
                        plateCountEl.innerText = cleanPlates;
                        updateScore(10); // 洗碗獎勵
                    }
                }
                lastHandPos = { x: px, y: py };
            } else {
                lastHandPos = null;
            }
        }

        function drawFirstPersonHand(landmarks, isRight, isWipeMode) {
            ctx.save();
            // 在 WIPE_TABLE 階段，雙手都變成綠色 (抹布) 的感覺
            const baseColor = isWipeMode ? '46, 204, 113' : (isRight ? '52, 152, 219' : '46, 204, 113');

            // 繪製模擬手臂 (從手腕延伸至螢幕底部)
            const wrist = landmarks[0];
            const pxW = (1 - wrist.x) * GAME_WIDTH;
            const pyW = wrist.y * GAME_HEIGHT;

            ctx.beginPath();
            ctx.moveTo(pxW - 25, pyW);
            ctx.lineTo(pxW - 50, GAME_HEIGHT + 50);
            ctx.lineTo(pxW + 50, GAME_HEIGHT + 50);
            ctx.lineTo(pxW + 25, pyW);
            const armGrad = ctx.createLinearGradient(pxW, pyW, pxW, GAME_HEIGHT);
            armGrad.addColorStop(0, `rgba(${baseColor}, 0.5)`);
            armGrad.addColorStop(1, `rgba(${baseColor}, 0.0)`);
            ctx.fillStyle = armGrad;
            ctx.fill();

            // 繪製骨架發光特效
            ctx.shadowBlur = 15;
            ctx.shadowColor = `rgb(${baseColor})`;
            ctx.strokeStyle = `rgba(${baseColor}, 0.9)`;
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 畫骨架連線
            ctx.beginPath();
            HAND_CONNECTIONS.forEach(pair => {
                const p1 = landmarks[pair[0]];
                const p2 = landmarks[pair[1]];
                ctx.moveTo((1 - p1.x) * GAME_WIDTH, p1.y * GAME_HEIGHT);
                ctx.lineTo((1 - p2.x) * GAME_WIDTH, p2.y * GAME_HEIGHT);
            });
            ctx.stroke();

            // 畫關節點
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 5;
            landmarks.forEach(point => {
                ctx.beginPath();
                ctx.arc((1 - point.x) * GAME_WIDTH, point.y * GAME_HEIGHT, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            if (!isWipeMode) {
                // 推垃圾模式：手心光圈
                const middleMCP = landmarks[9];
                const pxM = (1 - middleMCP.x) * GAME_WIDTH;
                const pyM = middleMCP.y * GAME_HEIGHT;
                ctx.beginPath();
                ctx.arc(pxM, pyM, 35, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${baseColor}, 0.3)`;
                ctx.fill();
                ctx.strokeStyle = `rgba(${baseColor}, 0.8)`;
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                // 擦桌子模式：雙手都有抹布
                const middleMCP = landmarks[9];
                const pxM = (1 - middleMCP.x) * GAME_WIDTH;
                const pyM = middleMCP.y * GAME_HEIGHT;
                const angle = Math.atan2(pyM - pyW, pxM - pxW);

                ctx.translate(pxM, pyM);
                ctx.rotate(angle);

                // 畫一塊橘色/黃色的抹布海綿
                ctx.fillStyle = 'rgba(243, 156, 18, 0.85)';
                ctx.shadowColor = 'rgba(243, 156, 18, 1)';
                ctx.shadowBlur = 20;

                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(-25, -40, 50, 80, 15);
                } else {
                    ctx.rect(-25, -40, 50, 80);
                }
                ctx.fill();

                // 抹布上的紋理線條
                ctx.strokeStyle = 'rgba(211, 84, 0, 0.6)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-10, -20); ctx.lineTo(-10, 20);
                ctx.moveTo(10, -20); ctx.lineTo(10, 20);
                ctx.stroke();
            }

            // --- 繪製 UI 滯留進度環 ---
            if (macroState !== 'GAMEPLAY' && uiDwellProgress > 0) {
                const middleMCP = landmarks[9];
                const pxM = (1 - middleMCP.x) * GAME_WIDTH;
                const pyM = middleMCP.y * GAME_HEIGHT;
                
                const r = 45;
                ctx.beginPath();
                ctx.arc(pxM, pyM, r, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 6;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(pxM, pyM, r, -Math.PI / 2, -Math.PI / 2 + uiDwellProgress * Math.PI * 2);
                const ringColor = uiDwellProgress > 0.7 ? '#2ecc71' : '#f1c40f';
                ctx.strokeStyle = ringColor;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = ringColor;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function renderGame() {
            // 切換空間導航按鈕 (僅在 GAMEPLAY 顯示，之後會換成手勢觸發)
            drawNavigationArrows();

            if (microLocation === 'COUNTER') {
                // 畫客人 (僅顯示正在點餐的第一位)
                const orderingCustomers = customers.filter(c => c.state === 'ORDERING');
                if (orderingCustomers.length > 0) {
                    const c = orderingCustomers[0];
                    let cx = 480; 
                    let cy = 300;
                    
                    ctx.save();
                    // 畫客人本體
                    ctx.fillStyle = '#3498db';
                    ctx.beginPath(); ctx.arc(cx, cy, 40, 0, Math.PI*2); ctx.fill(); // 頭
                    ctx.fillRect(cx - 30, cy + 40, 60, 80); // 身體

                    // 點餐氣泡
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(cx, cy - 80, 50, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.font = '30px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🍝', cx, cy - 70);

                    // 出餐滯留環 (接單進度)
                    if (c.serveDwell > 0) {
                        ctx.beginPath();
                        ctx.arc(cx, cy - 80, 55, -Math.PI/2, -Math.PI/2 + c.serveDwell * Math.PI*2);
                        ctx.strokeStyle = '#2ecc71';
                        ctx.lineWidth = 6;
                        ctx.stroke();
                    }

                    // 耐心條
                    ctx.fillStyle = '#333';
                    ctx.fillRect(cx - 50, cy + 130, 100, 10);
                    ctx.fillStyle = c.patience > 50 ? '#2ecc71' : '#e74c3c';
                    ctx.fillRect(cx - 50, cy + 130, c.patience, 10);
                    
                    ctx.restore();
                }

                // 畫後面的排隊者 (簡化顯示)
                if (orderingCustomers.length > 1) {
                    for (let i = 1; i < orderingCustomers.length; i++) {
                        let cx = 480 + (i * 150);
                        ctx.fillStyle = 'rgba(127, 140, 141, 0.5)';
                        ctx.beginPath(); ctx.arc(cx, 300, 40, 0, Math.PI*2); ctx.fill();
                    }
                }

                // 畫掉落的錢
                droppedMoney.forEach(m => {
                    ctx.save();
                    ctx.translate(m.body.position.x, m.body.position.y);
                    ctx.rotate(m.body.angle);
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 4; ctx.stroke();
                    ctx.fillStyle = '#d35400';
                    ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('$', 0, 7);
                    ctx.restore();
                });

                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('櫃檯區：停留點餐氣泡出餐，微笑可安撫客人', 30, GAME_HEIGHT - 30);

                if (customers.length >= LEVELS[currentLevelIndex].tables) {
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = 'bold 32px Arial';
                    ctx.textAlign = 'right';
                    ctx.fillText('● 店內客滿 (FULL)', GAME_WIDTH - 30, GAME_HEIGHT - 30);
                    ctx.textAlign = 'left';
                }
            }

            if (microLocation === 'DINING_ROOM') {
                // 畫桌子與等餐客人
                const waitingCustomers = customers.filter(c => c.state === 'WAITING_FOOD');
                
                // 畫桌子
                for (let i = 0; i < LEVELS[currentLevelIndex].tables; i++) {
                    const pos = TABLE_POSITIONS[i];
                    ctx.fillStyle = '#7f8c8d';
                    ctx.fillRect(pos.x - 60, pos.y - 10, 120, 20); // 桌子底座
                    ctx.fillStyle = '#95a5a6';
                    ctx.fillRect(pos.x - 50, pos.y - 50, 100, 40); // 桌面
                }

                waitingCustomers.forEach((c, index) => {
                    const pos = TABLE_POSITIONS[index];
                    if (!pos) return;
                    
                    let cx = pos.x;
                    let cy = pos.y - 80;

                    ctx.save();
                    // 畫客人本體
                    ctx.fillStyle = '#e67e22';
                    ctx.beginPath(); ctx.arc(cx, cy, 35, 0, Math.PI * 2); ctx.fill(); // 頭
                    ctx.fillRect(cx - 25, cy + 35, 50, 60); // 身體

                    // 等餐提示
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('⌛ 等餐中', cx, cy - 60);

                    // 耐心條
                    ctx.fillStyle = '#333';
                    ctx.fillRect(cx - 30, cy + 100, 60, 6);
                    ctx.fillStyle = c.patience > 50 ? '#2ecc71' : '#e74c3c';
                    ctx.fillRect(cx - 30, cy + 100, (c.patience / 100) * 60, 6);
                    ctx.restore();
                });

                // 畫出原本的打掃桌子背景 (如果有的話，這裡可以微調)
                ctx.fillStyle = 'rgba(139, 69, 19, 0.3)';
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(100, 100, 760, 400, 20);
                } else {
                    ctx.rect(100, 100, 760, 400);
                }
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#5C3A21';
                ctx.stroke();

                // 畫污漬
                let remainingStainsCount = 0;
                stains.forEach(stain => {
                    if (stain.alpha > 0) {
                        remainingStainsCount++;
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(stain.x, stain.y, stain.r, 0, Math.PI * 2);
                        let grad = ctx.createRadialGradient(stain.x, stain.y, 0, stain.x, stain.y, stain.r);
                        grad.addColorStop(0, `rgba(101, 67, 33, ${stain.alpha})`);
                        grad.addColorStop(1, `rgba(101, 67, 33, 0)`);
                        ctx.fillStyle = grad;
                        ctx.fill();
                        ctx.restore();
                    }
                });

                // 畫物理垃圾
                trashBodies.forEach(body => {
                    ctx.save();
                    ctx.translate(body.position.x, body.position.y);
                    ctx.rotate(body.angle);

                    if (body.label === 'trash_plate') {
                        ctx.beginPath();
                        ctx.arc(0, 0, 60, 0, Math.PI * 2);
                        ctx.fillStyle = '#ecf0f1';
                        ctx.fill();
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = '#bdc3c7';
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(0, 0, 40, 0, Math.PI * 2);
                        ctx.stroke();
                    } else if (body.label === 'trash_utensil') {
                        ctx.fillStyle = '#95a5a6';
                        ctx.fillRect(-10, -50, 20, 100);
                        ctx.strokeStyle = '#7f8c8d';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(-10, -50, 20, 100);
                    } else if (body.label === 'trash_cup') {
                        ctx.fillStyle = '#e74c3c';
                        ctx.fillRect(-20, -35, 40, 70);
                        ctx.strokeStyle = '#c0392b';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(-20, -35, 40, 70);
                        ctx.fillStyle = 'white';
                        ctx.fillRect(-15, -10, 30, 20);
                    } else {
                        ctx.beginPath();
                        for (let i = 0; i < 8; i++) {
                            let a = i * Math.PI / 4;
                            let r = 20 + Math.random() * 10;
                            if (i === 0) ctx.moveTo(r * Math.cos(a), r * Math.sin(a));
                            else ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
                        }
                        ctx.closePath();
                        ctx.fillStyle = '#ecf0f1';
                        ctx.fill();
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#bdc3c7';
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                // 狀態文字提示
                if (cleaningSubState === 'INIT') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('開始整理桌子！', GAME_WIDTH / 2, GAME_HEIGHT / 2);
                    ctx.textAlign = 'left';
                } else if (cleaningSubState === 'TRANSITION') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                    ctx.fillStyle = '#f1c40f';
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('垃圾清理完畢，開始擦桌子！', GAME_WIDTH / 2, GAME_HEIGHT / 2);
                    ctx.textAlign = 'left';
                } else if (cleaningSubState === 'WIPE_TABLE' && remainingStainsCount === 0) {
                    ctx.fillStyle = '#2ecc71';
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'black';
                    ctx.fillText('✨ 完成清潔 ✨', GAME_WIDTH / 2, GAME_HEIGHT / 2);
                    ctx.textAlign = 'left';
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    if (cleaningSubState === 'CLEAR_TRASH') {
                        ctx.fillText('將垃圾與餐具撥出桌子邊緣', GAME_WIDTH / 2, GAME_HEIGHT - 20);
                    } else if (cleaningSubState === 'WIPE_TABLE') {
                        ctx.fillText('用雙手海綿擦拭桌面污漬', GAME_WIDTH / 2, GAME_HEIGHT - 20);
                    }
                    ctx.textAlign = 'left';
                }
            }

            if (microLocation === 'KITCHEN') {
                if (activeOrder) {
                    drawCookingUI();
                } else {
                    if (washingPlate.dirtAmount > 0) {
                        // 畫盤子底座
                        ctx.fillStyle = '#ecf0f1';
                        ctx.beginPath();
                        ctx.arc(washingPlate.x + washingPlate.w / 2, washingPlate.y + washingPlate.h / 2, 100, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.lineWidth = 8;
                        ctx.strokeStyle = '#bdc3c7';
                        ctx.stroke();

                        ctx.fillStyle = `rgba(120, 100, 60, ${washingPlate.dirtAmount / 100})`;
                        ctx.beginPath();
                        ctx.arc(washingPlate.x + washingPlate.w / 2, washingPlate.y + washingPlate.h / 2, 85, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = 'white';
                        ctx.font = 'bold 22px Arial';
                        ctx.textAlign = 'center';
                        ctx.shadowBlur = 4;
                        ctx.shadowColor = 'black';
                        ctx.fillText('在盤子上快速來回搓洗！', washingPlate.x + 100, washingPlate.y - 20);
                        ctx.textAlign = 'left';
                        ctx.shadowBlur = 0;
                    } else {
                        // 畫乾淨的盤子
                        ctx.fillStyle = '#ecf0f1';
                        ctx.beginPath();
                        ctx.arc(washingPlate.x + washingPlate.w / 2, washingPlate.y + washingPlate.h / 2, 100, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.lineWidth = 8;
                        ctx.strokeStyle = '#bdc3c7';
                        ctx.stroke();

                        ctx.fillStyle = '#2ecc71';
                        ctx.font = 'bold 32px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('✨ 閃閃發亮 ✨', washingPlate.x + 100, washingPlate.y + 110);
                        ctx.textAlign = 'left';
                    }
                }
            }
        }

        // --- 繪製空間導航箭頭 (Phase 2: 手部滯留觸發) ---
        function drawNavigationArrows() {
            const arrowDefs = [
                {
                    key: 'KITCHEN', show: microLocation !== 'KITCHEN',
                    cx: 55, cy: GAME_HEIGHT / 2, label: '廚房',
                    labelX: 30, labelY: GAME_HEIGHT / 2 + 70,
                    draw: () => { ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40); }
                },
                {
                    key: 'COUNTER', show: microLocation !== 'COUNTER',
                    cx: GAME_WIDTH / 2, cy: 55, label: '櫃檯',
                    labelX: GAME_WIDTH / 2 - 20, labelY: 110,
                    draw: () => { ctx.moveTo(GAME_WIDTH / 2, 30); ctx.lineTo(GAME_WIDTH / 2 - 40, 80); ctx.lineTo(GAME_WIDTH / 2 + 40, 80); }
                },
                {
                    key: 'DINING_ROOM', show: microLocation !== 'DINING_ROOM',
                    cx: GAME_WIDTH - 55, cy: GAME_HEIGHT / 2, label: '用餐區',
                    labelX: GAME_WIDTH - 80, labelY: GAME_HEIGHT / 2 + 70,
                    draw: () => { ctx.moveTo(GAME_WIDTH - 30, GAME_HEIGHT / 2); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 - 40); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 + 40); }
                },
                {
                    key: 'SINK', show: microLocation !== 'SINK',
                    cx: GAME_WIDTH / 2, cy: GAME_HEIGHT - 45, label: '洗手台',
                    labelX: GAME_WIDTH / 2 - 30, labelY: GAME_HEIGHT - 85,
                    draw: () => { ctx.moveTo(GAME_WIDTH / 2, GAME_HEIGHT - 30); ctx.lineTo(GAME_WIDTH / 2 - 40, GAME_HEIGHT - 70); ctx.lineTo(GAME_WIDTH / 2 + 40, GAME_HEIGHT - 70); }
                }
            ];

            for (const arrow of arrowDefs) {
                if (!arrow.show) continue;
                ctx.save();

                const isHovering = hoverTarget === arrow.key;
                const pulse = isHovering ? 0.5 + Math.sin(Date.now() / 200) * 0.2 : 0.2;

                // 箭頭本體
                ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1, pulse + 0.3)})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                arrow.draw();
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 標籤
                ctx.fillStyle = isHovering ? '#f1c40f' : 'white';
                ctx.font = isHovering ? 'bold 22px Arial' : '20px Arial';
                ctx.fillText(arrow.label, arrow.labelX, arrow.labelY);

                // 滯留進度環
                if (isHovering && dwellProgress > 0) {
                    const r = 48;
                    // 底環
                    ctx.beginPath();
                    ctx.arc(arrow.cx, arrow.cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                    ctx.lineWidth = 7;
                    ctx.stroke();
                    // 進度弧
                    ctx.beginPath();
                    ctx.arc(arrow.cx, arrow.cy, r, -Math.PI / 2, -Math.PI / 2 + dwellProgress * Math.PI * 2);
                    const ringColor = dwellProgress > 0.7 ? '#2ecc71' : '#f1c40f';
                    ctx.strokeStyle = ringColor;
                    ctx.lineWidth = 7;
                    ctx.lineCap = 'round';
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = ringColor;
                    ctx.stroke();
                    // 百分比
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${Math.round(dwellProgress * 100)}%`, arrow.cx, arrow.cy + 6);
                    ctx.textAlign = 'left';
                }

                ctx.restore();
            }
        }

        function updateScore(delta) {
            score += delta;
            scoreDisplay.innerText = score;
            if (delta > 0) {
                scoreDisplay.style.color = '#2ecc71';
            } else {
                scoreDisplay.style.color = '#e74c3c';
            }
            setTimeout(() => scoreDisplay.style.color = 'white', 500);
        }

        function updateReviews() {
            if (negativeReviews > 0) {
                reviewDisplay.style.display = 'inline-block';
                reviewDisplay.innerText = `😡 負評: ${negativeReviews}`;
                // 動畫閃爍
                reviewDisplay.style.transform = 'scale(1.3)';
                setTimeout(() => reviewDisplay.style.transform = 'scale(1)', 300);
            }
        }

        initMediaPipe();
    </script>
</body>
