        function drawFirstPersonHand(landmarks, isRight, isWipeMode, targetCtx = ctx) {
            const drawCtx = targetCtx;
            drawCtx.save();
            const wrist = landmarks[0];
            const middleMCP = landmarks[9];
            const indexMCP = landmarks[5];
            const pinkyMCP = landmarks[17];
            const pxW = (1 - wrist.x) * GAME_WIDTH;
            const pyW = wrist.y * GAME_HEIGHT;
            const pxM = (1 - middleMCP.x) * GAME_WIDTH;
            const pyM = middleMCP.y * GAME_HEIGHT;
            const pxIndex = (1 - indexMCP.x) * GAME_WIDTH;
            const pyIndex = indexMCP.y * GAME_HEIGHT;
            const pxPinky = (1 - pinkyMCP.x) * GAME_WIDTH;
            const pyPinky = pinkyMCP.y * GAME_HEIGHT;
            const handSide = isRight ? 'right' : 'left';
            const heldItem = dragItems[handSide];
            const gripHeldItems = ['RAW_PASTA', 'COOKED_PASTA', 'CEMENT', 'CILANTRO'];
            const forceOpen = Date.now() < handOpenUntil[handSide];
            const isFist = !forceOpen && (isFistGesture(landmarks) || gripHeldItems.includes(heldItem));
            const handImg = isFist ? fistHandImg : openHandImg;
            const handDirection = Math.atan2(pyM - pyW, pxM - pxW);
            const rotation = handDirection + Math.PI / 2;
            const palmSpan = Math.hypot(pxIndex - pxPinky, pyIndex - pyPinky);
            const palmLength = Math.hypot(pxM - pxW, pyM - pyW);
            const handHeight = Math.max(120, Math.min(255, Math.max(palmSpan * 2.7, palmLength * 4.0)));
            const handWidth = handImg.naturalWidth > 0 ? handHeight * (handImg.naturalWidth / handImg.naturalHeight) : handHeight * 0.9;
            const isScrubMode = microLocation === 'SINK' && washingPlate.dirtAmount > 0 && dirtyPlates > 0 && cleanPlates < getMaxPlates();

            if (!isWipeMode && heldItem) {
                drawCtx.save();
                drawCtx.translate(pxM, pyM);
                if (heldItem === 'RAW_PASTA') {
                    drawSpriteCentered(itemImages.rawPasta, 100, 155, 1, drawCtx);
                } else if (heldItem === 'COOKED_PASTA') {
                    drawSpriteCentered(itemImages.cookedPasta, 128, 104, 1, drawCtx);
                } else if (heldItem === 'CILANTRO') {
                    drawSpriteCentered(itemImages.cilantroHandful, 118, 96, 1, drawCtx);
                } else if (heldItem === 'CEMENT') {
                    drawSpriteCentered(itemImages.cementCan, 192, 264, 1, drawCtx);
                } else if (heldItem === 'FINISHED_PLATE') {
                    drawSpriteCentered(getFinishedPlateImage(), 175, 138, 1, drawCtx);
                } else if (heldItem === 'SHAKER') {
                    drawSpriteCentered(itemImages.shaker, 100, 145, 1, drawCtx);
                    if (drinkState === 'SHAKING') {
                        drawCtx.fillStyle = 'white'; drawCtx.font = 'bold 14px Arial';
                        drawCtx.fillText('SHAKE!', -25, -40);
                    }
                }
                drawCtx.restore();
            }

            if (isWipeMode || isScrubMode) {
                drawCtx.save();
                drawCtx.translate(pxM, pyM);
                drawCtx.rotate(rotation);
                if ((isFist && !isRight) || (!isFist && isRight)) drawCtx.scale(-1, 1);
                drawCtx.translate(0, -handHeight * 0.24);
                drawCtx.rotate(isWipeMode ? -0.18 : 0.08);
                drawCtx.shadowBlur = 10;
                drawCtx.shadowColor = 'rgba(0, 0, 0, 0.35)';
                if (isWipeMode) {
                    drawSpriteCentered(itemImages.cleaningRag, 230, 170, 1, drawCtx);
                } else {
                    drawSpriteCentered(itemImages.dishSponge, 174, 124, 1, drawCtx);
                }
                drawCtx.restore();
            }

            if (handImg.complete && handImg.naturalWidth > 0) {
                drawCtx.save();
                drawCtx.translate(pxM, pyM);
                drawCtx.rotate(rotation);
                if ((isFist && !isRight) || (!isFist && isRight)) drawCtx.scale(-1, 1);
                drawCtx.shadowBlur = isWipeMode ? 16 : 10;
                drawCtx.shadowColor = isWipeMode ? 'rgba(243, 156, 18, 0.9)' : 'rgba(255, 255, 255, 0.45)';
                drawCtx.drawImage(handImg, -handWidth / 2, -handHeight * 0.42, handWidth, handHeight);
                drawCtx.restore();
            } else {
                drawCtx.fillStyle = isFist ? '#f39c12' : '#ffffff';
                drawCtx.beginPath();
                drawCtx.arc(pxM, pyM, 35, 0, Math.PI * 2);
                drawCtx.fill();
            }

            // --- 蝜芾ˊ UI 皛舐??脣漲??---
            if (!isGameplayState() && uiDwellProgress > 0 && uiDwellHandSide === handSide) {
                const r = 45;
                drawCtx.beginPath();
                drawCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                drawCtx.lineWidth = 6;
                drawCtx.stroke();

                drawCtx.beginPath();
                drawCtx.arc(pxM, pyM, r, -Math.PI / 2, -Math.PI / 2 + uiDwellProgress * Math.PI * 2);
                const ringColor = uiDwellProgress > 0.7 ? '#2ecc71' : '#f1c40f';
                drawCtx.strokeStyle = ringColor;
                drawCtx.lineWidth = 6;
                drawCtx.lineCap = 'round';
                drawCtx.shadowBlur = 10;
                drawCtx.shadowColor = ringColor;
                drawCtx.stroke();
                drawCtx.shadowBlur = 0;
            }

            drawCtx.restore();
        }

            let allowedTargets = [];
            if (microLocation === 'COUNTER') allowedTargets = ['KITCHEN', 'DINING_ROOM'];
            else if (microLocation === 'KITCHEN') allowedTargets = ['COUNTER', 'SINK'];
            else if (microLocation === 'DINING_ROOM') allowedTargets = ['COUNTER'];
            else if (microLocation === 'SINK') allowedTargets = ['KITCHEN'];

            const arrowDefs = [
                {
                    key: 'KITCHEN', show: allowedTargets.includes('KITCHEN'),
                    cx: 100, cy: GAME_HEIGHT - 74, label: '廚房',
                    labelX: 74, labelY: GAME_HEIGHT - 67,
                    direction: 'left',
                    draw: () => { ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40); }
                },
                {
                    key: 'COUNTER', show: allowedTargets.includes('COUNTER'),
                    cx: GAME_WIDTH / 2, cy: GAME_HEIGHT - 74, label: '櫃台',
                    labelX: GAME_WIDTH / 2 - 20, labelY: GAME_HEIGHT - 67,
                    direction: 'up',
                    draw: () => {
                        if (microLocation === 'KITCHEN') {
                            // 撱����?��?瑼舀��?����
                            ctx.moveTo(GAME_WIDTH - 30, GAME_HEIGHT / 2); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 - 40); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 + 40);
                        } else if (microLocation === 'DINING_ROOM') {
                            // ?券??�?��?瑼舀��?�撌�
                            ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40);
                        } else {
                            // ?��?
                            ctx.moveTo(GAME_WIDTH / 2, 30); ctx.lineTo(GAME_WIDTH / 2 - 40, 80); ctx.lineTo(GAME_WIDTH / 2 + 40, 80);
                        }
                    }
                },
                {
                    key: 'DINING_ROOM', show: allowedTargets.includes('DINING_ROOM'),
                    cx: GAME_WIDTH - 100, cy: GAME_HEIGHT - 74, label: '用餐區',
                    labelX: GAME_WIDTH - 136, labelY: GAME_HEIGHT - 67,
                    direction: 'right',
                    draw: () => { ctx.moveTo(GAME_WIDTH - 30, GAME_HEIGHT / 2); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 - 40); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 + 40); }
                },
                {
                    key: 'SINK', show: allowedTargets.includes('SINK'),
                    cx: GAME_WIDTH / 2, cy: GAME_HEIGHT - 48, label: '洗手台',
                    labelX: GAME_WIDTH / 2 - 30, labelY: GAME_HEIGHT - 42,
                    direction: 'down',
                    draw: () => { ctx.moveTo(GAME_WIDTH / 2, GAME_HEIGHT - 30); ctx.lineTo(GAME_WIDTH / 2 - 40, GAME_HEIGHT - 70); ctx.lineTo(GAME_WIDTH / 2 + 40, GAME_HEIGHT - 70); }
                }
            ];

            // ?寞??��?嚗�靽格�?COUNTER ?其??��?蝵格??�摨扳���?蝢?
            const counterDef = arrowDefs.find(a => a.key === 'COUNTER');
            if (microLocation === 'KITCHEN') {
                counterDef.cx = GAME_WIDTH - 100; counterDef.cy = GAME_HEIGHT - 74;
                counterDef.labelX = GAME_WIDTH - 126; counterDef.labelY = GAME_HEIGHT - 67;
                counterDef.direction = 'right';
                const sinkDef = arrowDefs.find(a => a.key === 'SINK');
                sinkDef.cx = 100; sinkDef.cy = GAME_HEIGHT - 74;
                sinkDef.labelX = 52; sinkDef.labelY = GAME_HEIGHT - 67;
                sinkDef.direction = 'left';
                sinkDef.draw = () => { ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40); };
            } else if (microLocation === 'DINING_ROOM') {
                counterDef.cx = 100; counterDef.cy = GAME_HEIGHT - 74;
                counterDef.labelX = 74; counterDef.labelY = GAME_HEIGHT - 67;
                counterDef.direction = 'left';
            } else if (microLocation === 'SINK') {
                // 敺��??����?��??輻?蝞剝�剔宏��喳椰��湛�����?�鋡�?���刻�����?��?
                const kitchenDef = arrowDefs.find(a => a.key === 'KITCHEN');
                kitchenDef.cx = 100; kitchenDef.cy = GAME_HEIGHT - 74;
                kitchenDef.labelX = 74; kitchenDef.labelY = GAME_HEIGHT - 67;
                kitchenDef.direction = 'left';
                kitchenDef.draw = () => { ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40); };
            }

            const drawNavSticker = (arrow, isHovering) => {
                if (!navArrowImg.complete || navArrowImg.naturalWidth <= 0) return false;
                const rotation = {
                    left: 0,
                    right: Math.PI,
                    up: Math.PI / 2,
                    down: -Math.PI / 2
                }[arrow.direction] || 0;
                const width = isHovering ? 126 : 112;
                const height = isHovering ? 72 : 64;
                const labelOffsets = {
                    left: { x: 14, y: 2 },
                    right: { x: -14, y: 2 },
                    up: { x: 0, y: 10 },
                    down: { x: 0, y: -10 }
                };
                const offset = labelOffsets[arrow.direction] || { x: 0, y: 2 };
                ctx.save();
                ctx.translate(arrow.cx, arrow.cy);
                ctx.rotate(rotation);
                ctx.globalAlpha = isHovering ? 1 : 0.9;
                ctx.shadowBlur = isHovering ? 14 : 8;
                ctx.shadowColor = isHovering ? 'rgba(241, 196, 15, 0.8)' : 'rgba(0, 0, 0, 0.34)';
                ctx.drawImage(navArrowImg, -width / 2, -height / 2, width, height);
                ctx.restore();

                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = isHovering ? '900 22px Arial' : '900 20px Arial';
                ctx.fillStyle = isHovering ? '#5a2f16' : '#6a3b20';
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(255, 246, 215, 0.86)';
                ctx.shadowBlur = 3;
                ctx.shadowColor = 'rgba(255, 246, 215, 0.72)';
                ctx.strokeText(arrow.label, arrow.cx + offset.x, arrow.cy + offset.y);
                ctx.fillText(arrow.label, arrow.cx + offset.x, arrow.cy + offset.y);
                ctx.restore();
                return true;
            };

            for (const arrow of arrowDefs) {
                if (!arrow.show) continue;
                ctx.save();

                const isHovering = hoverTarget === arrow.key;
                const pulse = isHovering ? 0.5 + Math.sin(Date.now() / 200) * 0.2 : 0.2;

                // 蝞剝��?祇?
                const drewSticker = drawNavSticker(arrow, isHovering);
                if (!drewSticker) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
                    ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1, pulse + 0.3)})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    arrow.draw();
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                // 璅�蝐�
                if (!drewSticker) {
                    ctx.fillStyle = isHovering ? '#f1c40f' : 'white';
                    ctx.font = isHovering ? 'bold 22px Arial' : '20px Arial';
                    ctx.fillText(arrow.label, arrow.labelX, arrow.labelY);
                }

                // 皛舐??脣漲??
                if (isHovering && dwellProgress > 0) {
                    const r = 48;
                    // 摨����
                    ctx.beginPath();
                    ctx.arc(arrow.cx, arrow.cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                    ctx.lineWidth = 7;
                    ctx.stroke();
                    // ?脣漲撘?
                    ctx.beginPath();
                    ctx.arc(arrow.cx, arrow.cy, r, -Math.PI / 2, -Math.PI / 2 + dwellProgress * Math.PI * 2);
                    const ringColor = dwellProgress > 0.7 ? '#2ecc71' : '#f1c40f';
                    ctx.strokeStyle = ringColor;
                    ctx.lineWidth = 7;
                    ctx.lineCap = 'round';
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = ringColor;
                    ctx.stroke();
                    // ?曉?瘥?
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${Math.round(dwellProgress * 100)}%`, arrow.cx, arrow.cy + 6);
                    ctx.textAlign = 'left';
                }

                ctx.restore();
            }
        }

        function updateScore(delta) {
            score += delta;
            scoreDisplay.innerText = score;
            updateBattleHud();
            publishOnlineState(true);
            if (delta > 0) {
                scoreDisplay.style.color = '#2ecc71';
            } else {
                scoreDisplay.style.color = '#e74c3c';
            }
            setTimeout(() => scoreDisplay.style.color = '#77e79f', 500);
        }

        function updateReviews() {
            publishOnlineState(true);
            if (negativeReviews > 0) {
                reviewDisplay.style.display = 'inline-block';
                reviewDisplay.innerText = `?�� 鞎��?: ${negativeReviews}`;
                // ?����?��?
                reviewDisplay.style.transform = 'scale(1.3)';
                setTimeout(() => reviewDisplay.style.transform = 'scale(1)', 300);
            }
        }

        initMediaPipe();
    </script>
</body>

</html>
