<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪洨餐館 - MVP 核心架構 (第一人稱視角)</title>
    <style>
        /* 基礎重置與背景 */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 遊戲主容器 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            overflow: hidden;
        }

        /* Canvas 與 Video */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* 保持比例縮放 */
            z-index: 10;
        }

        video {
            display: none;
        }

        /* 遊戲內疊加 UI 層 (HUD) */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            /* 讓滑鼠點擊可以穿透到下方的 HTML/Canvas */
        }

        .hud {
            position: absolute;
            padding: 15px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #status-hud {
            bottom: 80px;
            /* 移至下方，避免與頂部訂單重疊 */
            left: 15px;
            display: none;
        }

        /* 預設隱藏，遊戲中才顯示 */
        #satisfaction-bar-container {
            width: 220px;
            height: 22px;
            background: #333;
            border-radius: 11px;
            overflow: hidden;
            margin-top: 8px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        #satisfaction-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            transition: width 0.1s, background 0.3s;
        }

        /* --- 宏觀狀態 UI 面板 (HTML 實作) --- */
        .panel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            /* 改為透明，讓下方的 Canvas 雙手能透出來 */
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* 標題畫面 */
        #title-screen h1 {
            font-size: 64px;
            color: #f1c40f;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
        }

        #title-screen p {
            font-size: 24px;
            color: #ccc;
            margin-bottom: 40px;
        }

        /* 關卡選擇畫面 */
        #level-select-screen h2 {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 30px;
        }

        .level-grid {
            display: flex;
            gap: 20px;
        }

        .level-card {
            background: rgba(44, 62, 80, 0.75);
            /* 改為半透明，讓後方的手勢特效能透出來 */
            border: 2px solid #34495e;
            border-radius: 12px;
            padding: 20px;
            width: 180px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            position: relative;
        }

        .level-card:hover {
            transform: translateY(-5px);
            background: rgba(52, 73, 94, 0.85);
        }

        .level-card.locked {
            opacity: 0.5;
            filter: grayscale(100%);
            cursor: not-allowed;
        }

        .level-card.locked:hover {
            transform: none;
            background: rgba(44, 62, 80, 0.75);
        }

        .level-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .level-stars {
            font-size: 24px;
            color: #f1c40f;
            letter-spacing: 2px;
        }

        /* 結算畫面 */
        #result-screen h2 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        #result-money {
            font-size: 48px;
            color: #2ecc71;
            margin-bottom: 5px;
        }

        #result-penalty {
            font-size: 24px;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        #result-stars {
            font-size: 48px;
            color: #f1c40f;
            margin-bottom: 30px;
            letter-spacing: 5px;
        }

        /* 共用按鈕樣式 (HTML 按鈕，僅供滑鼠測試或未來替換為手勢觸發) */
        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: rgba(231, 76, 60, 0.85);
            /* 改為半透明 */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(192, 57, 43, 0.85);
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 10px;
            position: relative;
        }

        .btn:hover {
            background: rgba(231, 76, 60, 0.95);
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(192, 57, 43, 0.85);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .hand-hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.9), 0 0 18px rgba(241, 196, 15, 0.6);
        }

        /* Overcooked 風格訂單 UI */
        #order-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 50;
            pointer-events: none;
        }

        .order-card {
            width: 120px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid #fff;
            transition: transform 0.3s;
        }

        .order-patience-bg {
            width: 100%;
            height: 10px;
            background: #eee;
        }

        .order-patience-fill {
            height: 100%;
            background: #27ae60;
            width: 100%;
            transition: width 0.1s;
        }

        .order-icon {
            font-size: 40px;
            margin: 10px 0;
        }

        .order-type-text {
            font-size: 14px;
            color: #333;
            font-weight: bold;
            padding-bottom: 5px;
        }

        .order-status {
            font-size: 12px;
            color: #666;
            padding: 2px 0;
            background: #f1f1f1;
            width: 100%;
            text-align: center;
        }

        /* 盤子顯示 */
        #plate-display {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 20px;
            color: white;
            border: 2px solid white;
            z-index: 40;
            display: none;
        }
    </style>
    <!-- Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>

<body>

    <div id="game-container">
        <div id="loading">載入 MediaPipe 模型與相機中...</div>
        <video id="webcam" width="960" height="540" autoplay playsinline></video>
        <canvas id="game-canvas" width="960" height="540"></canvas>

        <!-- 訂單 UI 容器 -->
        <div id="order-container"></div>

        <div id="plate-display">🍽️ 乾淨盤子: <span id="plate-count">2</span></div>

        <!-- 遊戲進行中的 HUD (目前隱藏，進入 GAMEPLAY 才顯示) -->
        <div id="ui-layer">
            <div id="status-hud" class="hud" style="display: none;">
                <div style="font-size: 1.1em;">目標金額: $<span id="target-display">0</span> | 時間: <span id="time-display"
                        style="color:#e74c3c; font-weight:bold;">0</span>s</div>
                <div style="font-size: 1.1em; margin-top: 5px;">目前位置: <span id="location-display"
                        style="font-weight:bold; color:#3498db;">COUNTER (櫃檯)</span></div>
                <div style="margin-top: 5px;">營業額: $<span id="score-display"
                        style="font-weight:bold; font-size: 1.2em; color:#2ecc71;">0</span>
                    <span id="review-display"
                        style="color:#e74c3c; font-size:0.9em; margin-left:10px; display:none;">負評: 0</span>
                </div>
            </div>
        </div>

        <!-- 標題畫面 (TITLE) -->
        <div id="title-screen" class="panel-overlay hidden">
            <h1>42號義麵店</h1>
            <p>雙手與微笑，是最好的調味料</p>
            <button class="btn" onclick="changeMacroState('LEVEL_SELECT')">開始營業</button>
        </div>

        <!-- 關卡選擇畫面 (LEVEL_SELECT) -->
        <div id="level-select-screen" class="panel-overlay hidden">
            <h2>選擇關卡</h2>
            <div class="level-grid" id="level-grid-container">
                <!-- 由 JS 動態生成 -->
            </div>
            <button class="btn" onclick="changeMacroState('TITLE')"
                style="margin-top: 40px; background:#7f8c8d; box-shadow: 0 4px 0 #546e7a;">返回標題</button>
        </div>

        <!-- 結算畫面 (LEVEL_RESULT) -->
        <div id="result-screen" class="panel-overlay hidden">
            <h2 id="result-title">關卡結算</h2>
            <div>總營業額</div>
            <div id="result-money">$0</div>
            <div id="result-penalty">負評扣分: -$0</div>
            <div id="result-stars">☆☆☆</div>
            <div style="display: flex; gap: 20px;">
                <button class="btn" onclick="changeMacroState('LEVEL_SELECT')"
                    style="background:#3498db; box-shadow: 0 4px 0 #2980b9;">回關卡選單</button>
                <button class="btn" id="btn-next-level" onclick="startNextLevel()" style="display:none;">下一關</button>
            </div>
        </div>
    </div>

    <!-- 除錯用的狀態強制切換按鈕 -->
    <div id="controls">
        <button onclick="setMicroLocation('COUNTER')">切換: 櫃檯 (COUNTER)</button>
        <button onclick="setMicroLocation('DINING_ROOM')">切換: 用餐區 (DINING_ROOM) [測試打掃]</button>
        <button onclick="setMicroLocation('KITCHEN')">切換: 廚房 (KITCHEN) [測試洗碗]</button>
    </div>

    <script type="module">
        window.addEventListener('error', function (e) {
            alert('Error: ' + e.message + ' at ' + e.lineno);
        });

        import {
            FaceLandmarker,
            HandLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- 遊戲架構狀態變數 ---
        let macroState = 'LOADING'; // LOADING, TITLE, LEVEL_SELECT, GAMEPLAY, LEVEL_RESULT
        let microLocation = 'COUNTER'; // COUNTER, KITCHEN, DINING_ROOM

        // 關卡設定
        const LEVELS = [
            { id: 1, targetMoney: 50, time: 120, tables: 2 },
            { id: 2, targetMoney: 150, time: 90, tables: 3 },
            { id: 3, targetMoney: 300, time: 120, tables: 4 }
        ];
        let currentLevelIndex = 0;
        let gameTimer = 0;
        let gameTimerInterval = null;

        // 存檔系統 (記錄每一關的最高星星數，0代表未解鎖/未過關)
        let saveMemory = {
            stars: [0, 0, 0] // 對應 LEVEL 1, 2, 3
        };

        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 540;
        let score = 0; // 改為金錢
        let isSmiling = false;
        let customers = [];
        let droppedMoney = [];
        let customerSpawnTimer = 0;
        let negativeReviews = 0; // 負評數量

        // 廚房料理系統
        let activeOrder = null; // 目前正在處理的訂單
        let cookState = 'IDLE'; // IDLE, PUT_PASTA, BOILING, PLATE_PASTA, ADD_CEMENT, ADD_CILANTRO, STIRRING, SERVE
        let dragItems = { left: null, right: null }; // 支援雙手抓取不同物品
        let cookProgress = 0;
        let stirProgress = 0;
        const STIR_THRESHOLD = 1200; // 攪拌閾值

        let washingPlate = { x: 330, y: 120, w: 300, h: 300, dirtAmount: 100 }; // 擴大感應範圍 (原本 200)
        let lastHandPositions = { left: null, right: null }; // 分開記錄雙手位置
        let scrubAccumulator = 0;
        const SCRUB_THRESHOLD = 1000; // 再度降低門檻，超好洗
        let cleanPlates = 2; // 初始盤子數量
        const MAX_PLATES = 2; // 最大盤子數量 (第一關)
        let stains = [];
        let trashBodies = [];
        let plateHasNoodles = false;
        let plateHasCement = false;
        let plateHasCilantro = false;
        let potNoodleState = 'EMPTY'; // 'EMPTY', 'RAW', 'BOILING', 'READY'
        let potCookProgress = 0;
        let tipText = "";
        let tipTimer = 0;

        const TABLE_POSITIONS = [
            { x: 250, y: 400 },
            { x: 480, y: 400 },
            { x: 710, y: 400 },
            { x: 480, y: 200 }
        ];
        let tableStates = ['FREE', 'FREE', 'FREE', 'FREE']; 
        let tableCleanProgress = [0, 0, 0, 0]; 
        let tableHasDrink = [false, false, false, false]; 
        let currentCleaningTable = -1; 

        // 導航停留偵測 (Dwell Navigation)
        let hoverTarget = null;
        let hoverStartTime = 0;
        const HOVER_DWELL_TIME = 800; // 縮短為 0.8 秒觸發，提升移動流暢感
        function getDynamicNavZones() {
            const zones = {
                KITCHEN: { x: 0, y: 190, w: 100, h: 160 },
                COUNTER: { x: 420, y: 0, w: 120, h: 130 },
                DINING_ROOM: { x: 860, y: 190, w: 100, h: 160 },
                SINK: { x: 420, y: 440, w: 120, h: 100 }
            };

            // 根據目前位置調整感應區
            if (microLocation === 'KITCHEN') {
                zones.COUNTER = { x: 860, y: 190, w: 100, h: 160 }; // 廚房回櫃檯在右
            } else if (microLocation === 'DINING_ROOM') {
                // 用餐區回櫃檯：左側
                zones.COUNTER = { x: 0, y: 190, w: 100, h: 160 };
                // 髒桌子感應區：如果桌子是髒的，增加一個進入特寫的感應
                tableStates.forEach((state, idx) => {
                    if (state === 'DIRTY' && idx < LEVELS[currentLevelIndex].tables) {
                        const pos = TABLE_POSITIONS[idx];
                        zones[`CLEAN_TABLE_${idx}`] = { x: pos.x - 50, y: pos.y - 50, w: 100, h: 100 };
                    }
                });
            } else if (microLocation === 'SINK') {
                // 洗手台回廚房：左側 (同步視覺移動)
                zones.KITCHEN = { x: 0, y: 190, w: 100, h: 160 };
            } else if (microLocation === 'TABLE_CLEANING') {
                // 從特寫畫面回用餐區
                zones.DINING_ROOM = { x: 0, y: 0, w: 100, h: 100 }; // 左上角返回
            }
            return zones;
        }
        let dwellProgress = 0;
        let dwellCooldown = 0;
        const DWELL_COOLDOWN_TIME = 1000;
        let activeHandPositions = [];
        let uiHoverTarget = null;
        let uiHoverStartTime = 0;
        let uiDwellProgress = 0;
        let uiDwellCooldown = 0;
        const UI_DWELL_TIME = 1200;
        const UI_COOLDOWN_TIME = 800;
        let registeredUiElements = [];

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');
        const stateDisplay = document.getElementById('location-display');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const targetDisplay = document.getElementById('target-display');
        const statusHud = document.getElementById('status-hud');
        const reviewDisplay = document.getElementById('review-display');
        const plateDisplay = document.getElementById('plate-display');
        const plateCountEl = document.getElementById('plate-count');
        const orderContainer = document.getElementById('order-container');

        // UI 畫面元素
        const titleScreen = document.getElementById('title-screen');
        const levelSelectScreen = document.getElementById('level-select-screen');
        const resultScreen = document.getElementById('result-screen');
        const levelGrid = document.getElementById('level-grid-container');

        let faceLandmarker, handLandmarker;
        let lastVideoTime = -1;
        let faceResult = null, handResult = null;

        // 手部骨架連接對應表
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [5, 9], [9, 10], [10, 11], [11, 12],
            [9, 13], [13, 14], [14, 15], [15, 16],
            [13, 17], [17, 18], [18, 19], [19, 20],
            [0, 17]
        ];

        async function initMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );

            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                    delegate: "GPU"
                },
                outputFaceBlendshapes: true,
                runningMode: "VIDEO",
                numFaces: 1
            });

            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });

            startCamera();
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: GAME_WIDTH, height: GAME_HEIGHT } });
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    loadingEl.classList.add('hidden');
                    initMatterJs();
                    loadSaveData();
                    changeMacroState('TITLE'); // 載入完成，進入標題畫面
                    requestAnimationFrame(gameLoop);
                });
            } catch (err) {
                alert("無法存取攝影機，請確認權限或在 Localhost/HTTPS 環境下執行。");
            }
        }

        // --- 存檔系統 ---
        function loadSaveData() {
            const saved = localStorage.getItem('42PastaSave');
            if (saved) {
                saveMemory = JSON.parse(saved);
            } else {
                // 初次遊玩，解鎖第一關
                saveMemory = { stars: [0, 0, 0] };
                saveMemory.stars[0] = 0; // 0星但可玩
            }
        }
        function saveGame() {
            localStorage.setItem('42PastaSave', JSON.stringify(saveMemory));
        }

        // --- 宏觀狀態切換 ---
        window.changeMacroState = function (newState) {
            macroState = newState;
            // 隱藏所有面板
            titleScreen.classList.add('hidden');
            levelSelectScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            statusHud.style.display = 'none';
            orderContainer.innerHTML = ''; // 每次切換狀態都先清空訂單卡片，避免殘留到結算畫面

            if (newState === 'TITLE') {
                titleScreen.classList.remove('hidden');
                plateDisplay.style.display = 'none';
                orderContainer.innerHTML = '';
            } else if (newState === 'LEVEL_SELECT') {
                buildLevelSelectUI();
                levelSelectScreen.classList.remove('hidden');
                plateDisplay.style.display = 'none';
            } else if (newState === 'GAMEPLAY') {
                statusHud.style.display = 'block';
                plateDisplay.style.display = 'block';
                startLevel(currentLevelIndex);
            } else if (newState === 'LEVEL_RESULT') {
                showResultScreen();
                plateDisplay.style.display = 'none';
            }

            updateUiTargets();
        };

        // --- 關卡選擇與初始化 ---
        function buildLevelSelectUI() {
            levelGrid.innerHTML = '';
            LEVELS.forEach((level, index) => {
                const isLocked = index > 0 && saveMemory.stars[index - 1] < 2; // 需要前一關2星解鎖

                const card = document.createElement('div');
                card.className = `level-card ${isLocked ? 'locked' : ''}`;

                let starText = isLocked ? '🔒' : '☆'.repeat(3);
                if (!isLocked && saveMemory.stars[index] > 0) {
                    starText = '★'.repeat(saveMemory.stars[index]) + '☆'.repeat(3 - saveMemory.stars[index]);
                }

                card.innerHTML = `
                    <div class="level-title">關卡 ${level.id}</div>
                    <div style="font-size: 14px; color: #bdc3c7; margin-bottom: 10px;">目標: $${level.targetMoney} / ${level.time}s</div>
                    <div class="level-stars">${starText}</div>
                `;

                if (!isLocked) {
                    card.onclick = () => {
                        currentLevelIndex = index;
                        changeMacroState('GAMEPLAY');
                    };
                }
                levelGrid.appendChild(card);
            });

            updateUiTargets();
        }

        function updateUiTargets() {
            registeredUiElements = [];
            if (macroState === 'TITLE') {
                const startBtn = titleScreen.querySelector('.btn');
                if (startBtn) {
                    registeredUiElements.push({
                        el: startBtn,
                        action: () => startBtn.click()
                    });
                }
            } else if (macroState === 'LEVEL_SELECT') {
                const cards = levelGrid.querySelectorAll('.level-card:not(.locked)');
                cards.forEach((card) => {
                    registeredUiElements.push({
                        el: card,
                        action: () => {
                            if (typeof card.onclick === 'function') card.onclick();
                            else card.click();
                        }
                    });
                });
                const backBtn = levelSelectScreen.querySelector('.btn');
                if (backBtn) {
                    registeredUiElements.push({
                        el: backBtn,
                        action: () => backBtn.click()
                    });
                }
            } else if (macroState === 'LEVEL_RESULT') {
                const backBtn = resultScreen.querySelector('.btn');
                if (backBtn) {
                    registeredUiElements.push({
                        el: backBtn,
                        action: () => backBtn.click()
                    });
                }
                const nextBtn = document.getElementById('btn-next-level');
                if (nextBtn && nextBtn.style.display !== 'none') {
                    registeredUiElements.push({
                        el: nextBtn,
                        action: () => nextBtn.click()
                    });
                }
            }

            registeredUiElements.forEach(item => {
                item.el.classList.remove('hand-hover');
            });
        }

        function startLevel(index) {
            const levelData = LEVELS[index];
            score = 0;
            scoreDisplay.innerText = score;
            targetDisplay.innerText = levelData.targetMoney;
            gameTimer = levelData.time;
            timeDisplay.innerText = gameTimer;

            customers = [];
            droppedMoney.forEach(m => World.remove(world, m.body));
            droppedMoney = [];
            customerSpawnTimer = 60; // 1秒後生第一位
            negativeReviews = 0;
            reviewDisplay.style.display = 'none';
            reviewDisplay.innerText = '負評: 0';
            cleanPlates = 2; // 每一關重置盤子
            plateCountEl.innerText = cleanPlates;

            setMicroLocation('COUNTER'); // 遊戲開始預設在櫃檯

            // 啟動倒數計時器
            if (gameTimerInterval) clearInterval(gameTimerInterval);
            gameTimerInterval = setInterval(() => {
                if (macroState === 'GAMEPLAY') {
                    gameTimer--;
                    timeDisplay.innerText = gameTimer;
                    if (gameTimer <= 0) {
                        clearInterval(gameTimerInterval);
                        changeMacroState('LEVEL_RESULT');
                    }
                }
            }, 1000);
        }

        function showResultScreen() {
            const levelData = LEVELS[currentLevelIndex];
            const penalty = negativeReviews * 15; // 每個負評扣 15 元
            const finalScore = Math.max(0, score - penalty);

            document.getElementById('result-money').innerText = `$${score}`;
            document.getElementById('result-penalty').innerText = `負評扣分: -$${penalty} (${negativeReviews} 個負評)`;

            // 計算星星 (依據扣分後的最終分數)
            let earnedStars = 0;
            if (finalScore >= levelData.targetMoney * 1.5) earnedStars = 3;
            else if (finalScore >= levelData.targetMoney) earnedStars = 2;
            else if (finalScore >= levelData.targetMoney * 0.5) earnedStars = 1;

            let starDisplay = '';
            for (let i = 0; i < 3; i++) starDisplay += (i < earnedStars) ? '★' : '☆';
            document.getElementById('result-stars').innerText = starDisplay;

            // 存檔更新
            if (earnedStars > saveMemory.stars[currentLevelIndex]) {
                saveMemory.stars[currentLevelIndex] = earnedStars;
                saveGame();
            }

            // 判斷是否顯示下一關按鈕 (有下一關且拿到2星以上)
            const nextBtn = document.getElementById('btn-next-level');
            if (currentLevelIndex < LEVELS.length - 1 && earnedStars >= 2) {
                nextBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'none';
            }

            resultScreen.classList.remove('hidden');
            updateUiTargets();
        }

        window.startNextLevel = function () {
            currentLevelIndex++;
            changeMacroState('GAMEPLAY');
        };

        // --- 微觀空間切換 (Micro Location) ---
        window.setMicroLocation = function (loc, tableIdx = -1) {
            if (macroState !== 'GAMEPLAY') return;

            // 離開舊空間的清理
            if (microLocation === 'COUNTER') {
                droppedMoney.forEach(m => World.remove(world, m.body));
                droppedMoney = [];
            }

            microLocation = loc;
            stateDisplay.innerText = loc === 'TABLE_CLEANING' ? `CLEANING TABLE ${tableIdx + 1}` : loc;
            currentCleaningTable = tableIdx;

            // 進入新空間的初始化
            if (loc === 'SINK') {
                if (cleanPlates < MAX_PLATES) {
                    // 如果目前有髒盤子，且還沒開始洗 (dirtAmount=0 表示之前洗完了)
                    if (washingPlate.dirtAmount <= 0) {
                        washingPlate.dirtAmount = 100;
                        scrubAccumulator = 0;
                    }
                } else {
                    washingPlate.dirtAmount = 0;
                }
            } else if (loc === 'COUNTER') {
                droppedMoney.forEach(m => World.add(world, m.body));
            } else if (loc === 'DINING_ROOM') {
                // 清理用餐區之前的髒汙物件
                trashBodies.forEach(b => World.remove(world, b));
                trashBodies = [];
                stains = [];
            } else if (loc === 'TABLE_CLEANING') {
                // 特寫進入時，產生打掃任務
                cleaningSubState = 'INIT';
                setTimeout(() => { cleaningSubState = 'CLEAR_TRASH'; }, 500); 
                
                // 產生該桌子的垃圾
                let plate = Bodies.circle(480, 300, 60, { frictionAir: 0.1, label: 'trash_plate', restitution: 0.2 });
                let fork = Bodies.rectangle(600, 300, 20, 100, { frictionAir: 0.1, label: 'trash_utensil', restitution: 0.2 });
                
                let bodies = [plate, fork];
                // 只有當該桌點過飲料時才生成杯子
                if (tableHasDrink[tableIdx]) {
                    let cup = Bodies.rectangle(350, 350, 40, 70, { frictionAir: 0.1, label: 'trash_cup', restitution: 0.2 });
                    bodies.push(cup);
                }
                
                trashBodies.push(...bodies);
                World.add(world, bodies);

                // 初始化精準擦拭的髒污點
                stains = [
                    { x: 300, y: 250, cleaned: false, size: 60 },
                    { x: 600, y: 350, cleaned: false, size: 50 },
                    { x: 480, y: 300, cleaned: false, size: 55 },
                    { x: 250, y: 380, cleaned: false, size: 45 },
                    { x: 700, y: 220, cleaned: false, size: 40 }
                ];
            }
        };

        // --- Phase 2: 手部滯留導航 (Dwell Navigation) ---
        function checkDwellNavigation() {
            if (macroState !== 'GAMEPLAY') return;
            if (Date.now() < dwellCooldown) {
                hoverTarget = null;
                dwellProgress = 0;
                return;
            }

            let currentZone = null;
            let targetKey = null;

            let allowedTargets = [];
            if (microLocation === 'COUNTER') allowedTargets = ['KITCHEN', 'DINING_ROOM'];
            else if (microLocation === 'KITCHEN') allowedTargets = ['COUNTER', 'SINK'];
            else if (microLocation === 'DINING_ROOM') allowedTargets = ['COUNTER'];
            else if (microLocation === 'SINK') allowedTargets = ['KITCHEN'];
            else if (microLocation === 'TABLE_CLEANING') allowedTargets = ['DINING_ROOM'];

            const zones = getDynamicNavZones();
            for (const key in zones) {
                // 限制只能在允許的範圍移動
                if (allowedTargets.includes(key) || key.startsWith('CLEAN_TABLE_')) {
                    const zone = zones[key];
                    for (const pos of activeHandPositions) {
                        if (pos.x >= zone.x && pos.x <= zone.x + zone.w &&
                            pos.y >= zone.y && pos.y <= zone.y + zone.h) {
                            currentZone = key;
                            break;
                        }
                    }
                }
                if (currentZone) { targetKey = currentZone; break; }
            }

            if (currentZone) {
                if (hoverTarget === currentZone) {
                    const elapsed = Date.now() - hoverStartTime;
                    dwellProgress = Math.min(1, elapsed / HOVER_DWELL_TIME);
                    if (dwellProgress >= 1) {
                        if (targetKey.startsWith('CLEAN_TABLE_')) {
                            const idx = parseInt(targetKey.replace('CLEAN_TABLE_', ''));
                            setMicroLocation('TABLE_CLEANING', idx);
                        } else {
                            setMicroLocation(targetKey);
                        }
                        hoverTarget = null;
                        dwellProgress = 0;
                        dwellCooldown = Date.now() + DWELL_COOLDOWN_TIME;
                    }
                } else {
                    hoverTarget = currentZone;
                    hoverStartTime = Date.now();
                    dwellProgress = 0;
                }
            } else {
                hoverTarget = null;
                dwellProgress = 0;
            }
        }

        // --- 主選單/關卡選單/結算畫面：手勢滯留操作 ---
        function checkUiDwellActions() {
            if (macroState === 'GAMEPLAY' || macroState === 'LOADING') return;
            if (Date.now() < uiDwellCooldown) {
                if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                uiHoverTarget = null;
                uiDwellProgress = 0;
                return;
            }

            let currentTarget = null;
            let currentAction = null;

            for (const item of registeredUiElements) {
                const rect = item.el.getBoundingClientRect();
                const canvasRect = canvas.getBoundingClientRect();

                // 計算縮放比例
                const scaleX = GAME_WIDTH / canvas.offsetWidth;
                const scaleY = GAME_HEIGHT / canvas.offsetHeight;

                // 將 CSS 座標轉換為遊戲內部座標 (960x540)
                const zone = {
                    x: (rect.left - canvasRect.left) * scaleX,
                    y: (rect.top - canvasRect.top) * scaleY,
                    w: rect.width * scaleX,
                    h: rect.height * scaleY
                };
                for (const pos of activeHandPositions) {
                    if (pos.x >= zone.x && pos.x <= zone.x + zone.w &&
                        pos.y >= zone.y && pos.y <= zone.y + zone.h) {
                        currentTarget = item.el;
                        currentAction = item.action;
                        break;
                    }
                }
                if (currentTarget) break;
            }

            if (currentTarget) {
                if (uiHoverTarget === currentTarget) {
                    const elapsed = Date.now() - uiHoverStartTime;
                    uiDwellProgress = Math.min(1, elapsed / UI_DWELL_TIME);
                    if (uiDwellProgress >= 1) {
                        try {
                            currentAction();
                        } catch (e) {
                            console.error("Action Error: ", e);
                        }
                        if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                        uiHoverTarget = null;
                        uiDwellProgress = 0;
                        uiDwellCooldown = Date.now() + UI_COOLDOWN_TIME;
                        return; // 執行完動作後直接跳出，避免對 null 操作
                    }
                } else {
                    if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                    uiHoverTarget = currentTarget;
                    uiHoverStartTime = Date.now();
                    uiDwellProgress = 0;
                }

                if (uiHoverTarget) {
                    uiHoverTarget.classList.add('hand-hover');
                }
            } else {
                if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                uiHoverTarget = null;
                uiDwellProgress = 0;
            }
        }

        const Engine = Matter.Engine,
            World = Matter.World,
            Bodies = Matter.Bodies,
            Body = Matter.Body,
            Events = Matter.Events;

        let engine, world;
        let rightHandBody;
        let leftHandBody;

        let cleaningSubState = 'INIT'; // INIT, CLEAR_TRASH, TRANSITION, WIPE_TABLE, DONE
        let lastOrderType = 'PASTA';

        function initMatterJs() {
            engine = Engine.create();
            world = engine.world;
            engine.world.gravity.y = 0;

            rightHandBody = Bodies.circle(-100, -100, 60, {
                isStatic: true,
                label: 'rightHand'
            });
            leftHandBody = Bodies.circle(-100, -100, 60, {
                isStatic: true,
                label: 'leftHand'
            });
            World.add(world, [rightHandBody, leftHandBody]);
        }

        function gameLoop() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                faceResult = faceLandmarker.detectForVideo(video, performance.now());
                handResult = handLandmarker.detectForVideo(video, performance.now());
            }

            Engine.update(engine, 1000 / 60);

            // 客人排隊邏輯
            if (macroState === 'GAMEPLAY') {
                customerSpawnTimer--;
                // 這裡的 customers.length < LEVELS[currentLevelIndex].tables 代表「有空位才會來新客人」
                // 等之後 Phase 4，會把這個條件改成 (櫃檯排隊人數 + 用餐區佔位人數) < 總座位數
                if (customerSpawnTimer <= 0 && customers.length < LEVELS[currentLevelIndex].tables) {
                    const rand = Math.random();
                    let type = 'PASTA_NORMAL';
                    if (rand < 0.33) type = 'PASTA_CILANTRO';
                    else if (rand < 0.66) type = 'PASTA_CEMENT';
                    else type = 'PASTA_CEMENT_CILANTRO';

                    customers.push({
                        id: Date.now(),
                        orderType: type,
                        state: 'ORDERING',
                        patience: 100,
                        serveDwell: 0,
                        tableIndex: -1, // 尚未入座
                        eatTimer: 0,
                        hasDrink: false // 預留給未來關卡
                    });
                    // 基礎 4 秒生一個 + 每個負評增加 1.5 秒的生成時間
                    customerSpawnTimer = 240 + (negativeReviews * 90);
                }
                for (let i = customers.length - 1; i >= 0; i--) {
                    let c = customers[i];
                    // 坐在位子上等餐 (WAITING_FOOD) 通常比站在櫃檯點餐有耐心 (大幅調慢)
                    // 客人耐心下降速度調慢 (點餐從 0.04 -> 0.02，等餐從 0.01 -> 0.006)
                    const patienceLoss = (c.state === 'WAITING_FOOD') ? 0.006 : 0.02;
                    c.patience -= patienceLoss;

                    if (c.patience <= 0) {
                        // ... (之前已有的耐心耗盡邏輯)
                        if (activeOrder && activeOrder.id === c.id) {
                            activeOrder = null; cookState = 'IDLE'; 
                            dragItems.left = dragItems.right = null;
                            plateHasNoodles = plateHasCement = plateHasCilantro = false;
                            potNoodleState = 'EMPTY'; potCookProgress = 0;
                        }
                        if (c.tableIndex !== -1) {
                            tableStates[c.tableIndex] = 'DIRTY';
                            tableCleanProgress[c.tableIndex] = 0;
                        }
                        customers.splice(i, 1);
                        negativeReviews++; customerSpawnTimer += 180;
                        updateReviews();
                    } else if (c.state === 'EATING') {
                        c.eatTimer++;
                        if (c.eatTimer > 300) { // 用餐 5 秒
                            if (c.tableIndex !== -1) {
                                tableStates[c.tableIndex] = 'DIRTY';
                                tableCleanProgress[c.tableIndex] = 0;
                                tableHasDrink[c.tableIndex] = c.hasDrink; // 轉移飲料垃圾狀態
                            }
                            customers.splice(i, 1);
                        }
                    }
                }
            }

            // 檢查垃圾是否被撥出畫面 (特寫畫面)
            if (microLocation === 'TABLE_CLEANING') {
                if (cleaningSubState === 'CLEAR_TRASH') {
                    trashBodies = trashBodies.filter(body => {
                        const px = body.position.x;
                        const py = body.position.y;
                        if (px < 50 || px > 910 || py < 50 || py > 550) {
                            World.remove(world, body);
                            // 移除任何清理垃圾的金錢獎勵
                            return false;
                        }
                        return true;
                    });

                    if (trashBodies.length === 0) {
                        cleaningSubState = 'WIPE_TABLE';
                    }
                }
            }

            ctx.save();
            ctx.scale(-1, 1);
            ctx.translate(-GAME_WIDTH, 0);

            // 永遠繪製攝影機，讓選單狀態也能看到手
            ctx.drawImage(video, 0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 根據狀態加深背景
            ctx.fillStyle = macroState === 'GAMEPLAY' ? 'rgba(10, 15, 20, 0.75)' : 'rgba(10, 15, 20, 0.85)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.restore();

            handleHandLogic(); // 執行手勢邏輯 (UI判定、物理座標等)

            if (macroState === 'GAMEPLAY') {
                updateOrderUI(); // 更新頂部訂單列
                handleFaceLogic();
                renderGame();
            }

            // 永遠繪製第一人稱手部 (不管哪個狀態都畫)
            if (handResult && handResult.landmarks) {
                const isWipeMode = (macroState === 'GAMEPLAY' && microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE');
                handResult.handednesses.forEach((h, idx) => {
                    const isRight = h[0].categoryName === 'Left'; // 鏡像反轉
                    drawFirstPersonHand(handResult.landmarks[idx], isRight, isWipeMode);
                });
            }

            requestAnimationFrame(gameLoop);
        }

        function handleFaceLogic() {
            if (microLocation !== 'COUNTER') return; // 不在櫃檯不判定微笑

            isSmiling = false;
            if (faceResult && faceResult.faceBlendshapes.length > 0) {
                const blendshapes = faceResult.faceBlendshapes[0].categories;
                const smileLeft = blendshapes.find(c => c.categoryName === 'mouthSmileLeft')?.score || 0;
                const smileRight = blendshapes.find(c => c.categoryName === 'mouthSmileRight')?.score || 0;
                if (smileLeft > 0.2 || smileRight > 0.2) isSmiling = true;
            }

            if (customers.length > 0) {
                // 1. 微笑接單邏輯
                const orderingCustomer = customers.find(c => c.state === 'ORDERING');
                if (orderingCustomer) {
                    // 檢查是否有空桌子 (FREE 狀態且在當前關卡桌數範圍內)
                    const freeTableIndex = tableStates.findIndex((s, idx) => s === 'FREE' && idx < LEVELS[currentLevelIndex].tables);

                    if (freeTableIndex === -1) {
                        // 沒空桌時，微笑會給予提示
                        if (isSmiling) showTip('⚠️ 沒有空桌子了！請先往用餐區清理桌面 ⚠️');
                        orderingCustomer.serveDwell = 0;
                    } else {
                        if (isSmiling) {
                            orderingCustomer.serveDwell += 0.03;
                            if (orderingCustomer.serveDwell >= 1) {
                                orderingCustomer.state = 'WAITING_FOOD';
                                orderingCustomer.tableIndex = freeTableIndex;
                                tableStates[freeTableIndex] = 'OCCUPIED';
                                orderingCustomer.serveDwell = 0;
                                orderingCustomer.patience = Math.min(100, orderingCustomer.patience + 25);

                                if (!activeOrder) {
                                    activeOrder = orderingCustomer;
                                    cookState = 'PUT_PASTA';
                                }
                                showTip('😊 收到訂單！請往桌位 ' + (freeTableIndex + 1));
                            }
                        } else {
                            orderingCustomer.serveDwell = Math.max(0, orderingCustomer.serveDwell - 0.01);
                        }
                    }
                }
            }
        }

        function updateOrderUI() {
            if (macroState !== 'GAMEPLAY') {
                orderContainer.innerHTML = '';
                return;
            }

            // 比對當前 UI 元素數量與客人數量，避免頻繁 innerHTML 重建
            const currentCards = orderContainer.querySelectorAll('.order-card');

            // 簡單處理：全量更新 (或可優化為對應更新)
            let html = '';
            customers.forEach((c, index) => {
                const icon = '🍝';
                let typeText = '義大利麵';
                if (c.orderType === 'PASTA_CILANTRO') typeText = '香菜麵';
                else if (c.orderType === 'PASTA_CEMENT') typeText = '混泥土麵';
                else if (c.orderType === 'PASTA_CEMENT_CILANTRO') typeText = '混泥土香菜麵';
                else typeText = '原味麵';

                const statusText = c.state === 'ORDERING' ? '點餐中' : '等餐中';
                const color = c.patience > 60 ? '#27ae60' : (c.patience > 30 ? '#f39c12' : '#e74c3c');

                html += `
                    <div class="order-card" style="border-color: ${index === 0 ? '#f1c40f' : '#fff'}">
                        <div class="order-patience-bg">
                            <div class="order-patience-fill" style="width: ${c.patience}%; background: ${color}"></div>
                        </div>
                        <div class="order-icon">${icon}</div>
                        <div class="order-type-text">${typeText}</div>
                        <div class="order-status">${statusText}</div>
                    </div>
                `;
            });
            orderContainer.innerHTML = html;
        }

        function handleHandLogic() {
            activeHandPositions = [];
            if (!handResult || handResult.landmarks.length === 0) {
                Body.setPosition(rightHandBody, { x: -100, y: -100 });
                lastHandPositions.left = null;
                lastHandPositions.right = null;
                checkDwellNavigation();
                checkUiDwellActions();
                return;
            }

            let rightHandIdx = -1;
            let leftHandIdx = -1;

            handResult.handednesses.forEach((h, idx) => {
                if (h[0].categoryName === 'Left') rightHandIdx = idx;
                else leftHandIdx = idx;
            });

            if (rightHandIdx !== -1) {
                const landmarks = handResult.landmarks[rightHandIdx];
                const palm = landmarks[9];
                const px = (1 - palm.x) * GAME_WIDTH;
                const py = palm.y * GAME_HEIGHT;
                activeHandPositions.push({ x: px, y: py, isRight: true });

                if (macroState === 'GAMEPLAY') {
                    if (microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE') {
                        Body.setPosition(rightHandBody, { x: -100, y: -100 });
                    } else {
                        Body.setPosition(rightHandBody, { x: px, y: py });
                    }
                } else {
                    Body.setPosition(rightHandBody, { x: -100, y: -100 });
                }
            } else {
                Body.setPosition(rightHandBody, { x: -100, y: -100 });
            }

            if (leftHandIdx !== -1) {
                const landmarks = handResult.landmarks[leftHandIdx];
                const palm = landmarks[9];
                const px = (1 - palm.x) * GAME_WIDTH;
                const py = palm.y * GAME_HEIGHT;
                activeHandPositions.push({ x: px, y: py, isRight: false });

                if (macroState === 'GAMEPLAY') {
                    if (microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE') {
                        Body.setPosition(leftHandBody, { x: -100, y: -100 });
                    } else {
                        Body.setPosition(leftHandBody, { x: px, y: py });
                    }
                } else {
                    Body.setPosition(leftHandBody, { x: -100, y: -100 });
                }
            } else {
                Body.setPosition(leftHandBody, { x: -100, y: -100 });
            }

            // --- 統一處理空間邏輯 (依據收集到的 activeHandPositions) ---
            if (macroState === 'GAMEPLAY') {
                if (microLocation === 'TABLE_CLEANING') {
                    // 特寫擦拭邏輯 (雙手皆可觸發)
                    if (cleaningSubState === 'WIPE_TABLE' && currentCleaningTable !== -1) {
                        activeHandPositions.forEach(pos => {
                            // 檢查是否碰到任何尚未清理的髒污
                            stains.forEach(stain => {
                                if (!stain.cleaned) {
                                    const dist = Math.hypot(pos.x - stain.x, pos.y - stain.y);
                                    if (dist < stain.size) {
                                        stain.cleaned = true;
                                        showTip('🧹 擦掉髒污！');
                                    }
                                }
                            });

                            // 根據已清理的髒污比例更新總進度
                            const cleanedCount = stains.filter(s => s.cleaned).length;
                            tableCleanProgress[currentCleaningTable] = (cleanedCount / stains.length) * 100;

                            if (tableCleanProgress[currentCleaningTable] >= 100) {
                                tableStates[currentCleaningTable] = 'FREE';
                                tableCleanProgress[currentCleaningTable] = 0;
                                showTip('✨ 桌面已清理乾淨！');
                                setTimeout(() => { setMicroLocation('DINING_ROOM'); }, 800);
                            }
                        });
                    }
                }
                if (microLocation === 'SINK') {
                    if (washingPlate.dirtAmount > 0) {
                        handResult.landmarks.forEach((landmarks, idx) => {
                            // 修正：應使用鏡像反轉邏輯，Left 標籤代表畫面右側的手
                            const isRight = handResult.handednesses[idx][0].categoryName === 'Left';
                            const palm = landmarks[9];
                            const px = (1 - palm.x) * GAME_WIDTH;
                            const py = palm.y * GAME_HEIGHT;
                            checkScrubbing(px, py, isRight ? 'right' : 'left');
                        });
                    }
                }
                if (microLocation === 'COUNTER') {
                    // 移除掉落錢幣的抓取邏輯，確保只有出餐給錢
                    droppedMoney = [];
                }
                checkDwellNavigation();
                if (microLocation === 'KITCHEN' && activeOrder) {
                    // 雙手皆可抓取食材與料理
                    handleCookingLogic();
                }
            }
            checkUiDwellActions();
        }

        function handleCookingLogic() {
            if (!activeOrder || activeHandPositions.length === 0) return;

            // 遍歷所有偵測到的手部位置
            activeHandPositions.forEach(pos => {
                const px = pos.x;
                const py = pos.y;
                const handSide = pos.isRight ? 'right' : 'left';

                // 定義感應區
                const rawPastaArea = { x: 70, y: 350, w: 120, h: 120 };
                const potArea = { x: 300, y: 300, w: 150, h: 120 };
                const plateArea = { x: 750, y: 350, w: 150, h: 100 };
                const cilantroArea = { x: 70, y: 100, w: 120, h: 120 };
                const cementArea = { x: 250, y: 100, w: 120, h: 120 };
                const serveArea = { x: 600, y: 50, w: 200, h: 100 };

                // 狀態機
                if (cookState === 'PUT_PASTA' || cookState === 'ASSEMBLY') {
                    // --- 鍋子邏輯 ---
                    if (potNoodleState === 'EMPTY') {
                        // 增加排他性檢查：如果另一隻手已經拿了生麵，則此手不能再拿 (防止分身 BUG)
                        const otherHandSide = handSide === 'right' ? 'left' : 'right';
                        if (!dragItems[handSide] && dragItems[otherHandSide] !== 'RAW_PASTA' && px > rawPastaArea.x && px < rawPastaArea.x + rawPastaArea.w && py > rawPastaArea.y && py < rawPastaArea.y + rawPastaArea.h) {
                            dragItems[handSide] = 'RAW_PASTA';
                        }
                        if (dragItems[handSide] === 'RAW_PASTA' && px > potArea.x && px < potArea.x + potArea.w && py > potArea.y && py < potArea.y + potArea.h) {
                            dragItems[handSide] = null;
                            potNoodleState = 'BOILING';
                            potCookProgress = 0;
                        }
                    } else if (potNoodleState === 'BOILING') {
                        potCookProgress += 0.5;
                        if (potCookProgress >= 100) {
                            potNoodleState = 'READY';
                        }
                    } else if (potNoodleState === 'READY') {
                        const otherHandSide = handSide === 'right' ? 'left' : 'right';
                        if (!dragItems[handSide] && dragItems[otherHandSide] !== 'COOKED_PASTA' && !plateHasNoodles && px > potArea.x && px < potArea.x + potArea.w && py > potArea.y && py < potArea.y + potArea.h) {
                            dragItems[handSide] = 'COOKED_PASTA';
                            potNoodleState = 'EMPTY';
                        }
                    }

                    // --- 盤子配料邏輯 ---
                    const otherHandSide = handSide === 'right' ? 'left' : 'right';
                    if (!dragItems[handSide] && dragItems[otherHandSide] !== 'CEMENT' && activeOrder.orderType.includes('CEMENT') && !plateHasCement && px > cementArea.x && px < cementArea.x + cementArea.w && py > cementArea.y && py < cementArea.y + cementArea.h) {
                        dragItems[handSide] = 'CEMENT';
                    }
                    if (!dragItems[handSide] && dragItems[otherHandSide] !== 'CILANTRO' && activeOrder.orderType.includes('CILANTRO') && !plateHasCilantro && px > cilantroArea.x && px < cilantroArea.x + cilantroArea.w && py > cilantroArea.y && py < cilantroArea.y + cilantroArea.h) {
                        dragItems[handSide] = 'CILANTRO';
                    }

                    if (dragItems[handSide] && (dragItems[handSide] === 'COOKED_PASTA' || dragItems[handSide] === 'CEMENT' || dragItems[handSide] === 'CILANTRO') && px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        if (cleanPlates > 0 || plateHasNoodles || plateHasCement || plateHasCilantro) {
                            if (dragItems[handSide] === 'COOKED_PASTA') plateHasNoodles = true;
                            if (dragItems[handSide] === 'CEMENT') plateHasCement = true;
                            if (dragItems[handSide] === 'CILANTRO') plateHasCilantro = true;
                            dragItems[handSide] = null;
                        } else {
                            showTip('❌ 沒有乾淨盤子了！快去洗碗！');
                        }
                    }

                    const needsCement = activeOrder.orderType.includes('CEMENT');
                    const needsCilantro = activeOrder.orderType.includes('CILANTRO');
                    if (plateHasNoodles && (plateHasCement || !needsCement) && (plateHasCilantro || !needsCilantro)) {
                        cookState = 'STIRRING';
                        stirProgress = 0;
                        lastHandPositions[handSide] = null;
                    }
                } else if (cookState === 'STIRRING') {
                    if (px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        const lastPos = lastHandPositions[handSide];
                        if (lastPos) {
                            const dist = Math.hypot(px - lastPos.x, py - lastPos.y);
                            stirProgress += dist;
                            if (stirProgress > STIR_THRESHOLD) {
                                cookState = 'SERVE';
                                dragItems[handSide] = null;
                            }
                        }
                        lastHandPositions[handSide] = { x: px, y: py };
                    } else {
                        lastHandPositions[handSide] = null;
                    }
                } else if (cookState === 'SERVE') {
                    const otherHandSide = handSide === 'right' ? 'left' : 'right';
                    if (!dragItems[handSide] && dragItems[otherHandSide] !== 'FINISHED_PLATE' && px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        dragItems[handSide] = 'FINISHED_PLATE';
                    }
                    if (dragItems[handSide] === 'FINISHED_PLATE' && px > serveArea.x && px < serveArea.x + serveArea.w && py > serveArea.y && py < serveArea.y + serveArea.h) {
                        if (cleanPlates > 0) {
                            cleanPlates--; 
                            plateCountEl.innerText = cleanPlates;

                            let servedIndex = -1;
                            if (activeOrder) {
                                for (let i = 0; i < customers.length; i++) {
                                    if (customers[i].state === 'WAITING_FOOD' && customers[i].orderType === activeOrder.orderType) {
                                        servedIndex = i;
                                        break;
                                    }
                                }
                            }

                            if (servedIndex !== -1) {
                                updateScore(25);
                                const c = customers[servedIndex];
                                c.state = 'EATING';
                                c.eatTimer = 0;
                                if (c.tableIndex !== -1) {
                                    tableStates[c.tableIndex] = 'EATING';
                                }
                            } else {
                                showTip('❌ 找不到對應的客人需求！');
                            }

                            activeOrder = null;
                            dragItems[handSide] = null;
                            cookState = 'IDLE';
                            plateHasNoodles = plateHasCement = plateHasCilantro = false;

                            const nextCustomer = customers.find(c => c.state === 'WAITING_FOOD');
                            if (nextCustomer) {
                                activeOrder = nextCustomer;
                                cookState = 'PUT_PASTA';
                            }
                        } else {
                            showTip('❌ 沒有乾淨盤子了！快去洗碗！');
                        }
                    }
                }
            });
        }

        function showTip(text) {
            tipText = text;
            tipTimer = 180; // 約 3 秒 (60fps)
        }

        function drawCookingUI() {

            else if (cookState === 'BOILING') tipTextStr = '2. 煮麵中...';
            else if (cookState === 'PLATE_PASTA') tipTextStr = '3. 把熟麵抓起放到盤子上';
            else if (cookState === 'ADD_CEMENT') tipTextStr = '4. 依照需求加入混泥土';
            else if (cookState === 'ADD_CILANTRO') tipTextStr = '5. 依照需求加入香菜';
            else if (cookState === 'STIRRING') tipTextStr = '6. 在盤子上畫圈攪拌！';
            else if (cookState === 'SERVE') tipTextStr = '7. 把盤子放到上方出餐口！';

            ctx.fillText(tipTextStr, 20, 80);

            // 畫生麵區
            ctx.fillStyle = 'rgba(241, 196, 15, 0.5)';
            ctx.fillRect(rawPastaArea.x, rawPastaArea.y, rawPastaArea.w, rawPastaArea.h);
            ctx.fillStyle = 'white'; ctx.font = '20px Arial';
            ctx.fillText('生麵', rawPastaArea.x + 40, rawPastaArea.y + 70);

            // 畫香菜區
            ctx.fillStyle = 'rgba(46, 204, 113, 0.5)';
            ctx.fillRect(cilantroArea.x, cilantroArea.y, cilantroArea.w, cilantroArea.h);
            ctx.fillStyle = 'white';
            ctx.fillText('香菜', cilantroArea.x + 40, cilantroArea.y + 65);

            // 畫混泥土區
            ctx.fillStyle = 'rgba(149, 165, 166, 0.6)';
            ctx.fillRect(cementArea.x, cementArea.y, cementArea.w, cementArea.h);
            ctx.fillStyle = 'white';
            ctx.fillText('混泥土', cementArea.x + 30, cementArea.y + 65);

            // 畫鍋子
            ctx.fillStyle = '#34495e';
            ctx.beginPath(); ctx.arc(potArea.x + potArea.w / 2, potArea.y + potArea.h / 2 + 20, 60, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.arc(potArea.x + potArea.w / 2, potArea.y + potArea.h / 2, 60, 0, Math.PI * 2); ctx.fill();

            // 鍋子邏輯顯示
            if (potNoodleState !== 'EMPTY') {
                ctx.fillStyle = '#3498db'; // 水
                ctx.beginPath(); ctx.arc(potArea.x + potArea.w / 2, potArea.y + potArea.h / 2, 50, 0, Math.PI * 2); ctx.fill();

                if (potNoodleState === 'BOILING') {
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillRect(potArea.x + 25, potArea.y - 20, potCookProgress, 10);
                } else if (potNoodleState === 'READY') {
                    ctx.fillStyle = '#f39c12'; // 熟麵色
                    ctx.beginPath(); ctx.arc(potArea.x + potArea.w / 2, potArea.y + potArea.h / 2, 40, 0, Math.PI * 2); ctx.fill();

            const shouldShowPlate = (cleanPlates > 0 || plateHasNoodles || plateHasCement || plateHasCilantro);
            if (dragItems.left !== 'FINISHED_PLATE' && dragItems.right !== 'FINISHED_PLATE' && shouldShowPlate) {
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(plateArea.x + plateArea.w / 2, plateArea.y + plateArea.h / 2, 60, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 4; ctx.strokeStyle = '#bdc3c7'; ctx.stroke();

                // 盤子內容物 (改為依據 boolean 判斷)
                if (plateHasNoodles) {
                    ctx.fillStyle = '#f39c12'; // 麵

                    ctx.fillStyle = '#95a5a6'; // 混泥土色

                    ctx.fillStyle = '#2ecc71'; // 香菜

                ctx.strokeStyle = '#f1c40f';

                ctx.arc(plateArea.x + plateArea.w / 2, plateArea.y + plateArea.h / 2, 70, -Math.PI / 2, -Math.PI / 2 + stirRatio * Math.PI * 2);
