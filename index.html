            ctx.strokeRect(serveArea.x, serveArea.y, serveArea.w, serveArea.h);
            ctx.fillStyle = 'white';
            ctx.fillText('出餐口', serveArea.x + 70, serveArea.y + 60);

            // 移除舊的單一 dragItem 繪製，改由 drawFirstPersonHand 統一處理

            ctx.restore();
        }


        function checkScrubbing(px, py, handType) {
            // 使用較寬鬆的判定範圍，讓玩家容易搓洗
            const margin = 50;
            if (px > washingPlate.x - margin && px < washingPlate.x + washingPlate.w + margin &&
                py > washingPlate.y - margin && py < washingPlate.y + washingPlate.h + margin) {

                const lastPos = lastHandPositions[handType];
                if (lastPos) {
                    const dist = Math.hypot(px - lastPos.x, py - lastPos.y);
                    // 只有合理的位移才計算 (排除手部跳變造成的誤判，例如 > 200px)
                    if (dist < 200) {
                        scrubAccumulator += dist;
                        washingPlate.dirtAmount = 100 - (scrubAccumulator / SCRUB_THRESHOLD) * 100;
                    }

                    if (washingPlate.dirtAmount <= 0) {
                        washingPlate.dirtAmount = 0;
                        cleanPlates = Math.min(MAX_PLATES, cleanPlates + 1);
                        plateCountEl.innerText = cleanPlates;
                        // 移除洗碗金錢獎勵

                        // 重置，準備洗下一個盤子
                        scrubAccumulator = 0;
                        if (cleanPlates < MAX_PLATES) {
                            washingPlate.dirtAmount = 100;
                        }
                    }
                }
                lastHandPositions[handType] = { x: px, y: py };
            } else {
                lastHandPositions[handType] = null;
            }
        }

        function drawFirstPersonHand(landmarks, isRight, isWipeMode) {
            ctx.save();
            // 在 WIPE_TABLE 階段，雙手都變成綠色 (抹布) 的感覺
            const baseColor = isWipeMode ? '46, 204, 113' : (isRight ? '52, 152, 219' : '46, 204, 113');

            // 繪製模擬手臂 (從手腕延伸至螢幕底部)
            const wrist = landmarks[0];
            const pxW = (1 - wrist.x) * GAME_WIDTH;
            const pyW = wrist.y * GAME_HEIGHT;

            ctx.beginPath();
            ctx.moveTo(pxW - 25, pyW);
            ctx.lineTo(pxW - 50, GAME_HEIGHT + 50);
            ctx.lineTo(pxW + 50, GAME_HEIGHT + 50);
            ctx.lineTo(pxW + 25, pyW);
            const armGrad = ctx.createLinearGradient(pxW, pyW, pxW, GAME_HEIGHT);
            armGrad.addColorStop(0, `rgba(${baseColor}, 0.5)`);
            armGrad.addColorStop(1, `rgba(${baseColor}, 0.0)`);
            ctx.fillStyle = armGrad;
            ctx.fill();

            // 繪製骨架發光特效
            ctx.shadowBlur = 15;
            ctx.shadowColor = `rgb(${baseColor})`;
            ctx.strokeStyle = `rgba(${baseColor}, 0.9)`;
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 畫骨架連線
            ctx.beginPath();
            HAND_CONNECTIONS.forEach(pair => {
                const p1 = landmarks[pair[0]];
                const p2 = landmarks[pair[1]];
                ctx.moveTo((1 - p1.x) * GAME_WIDTH, p1.y * GAME_HEIGHT);
                ctx.lineTo((1 - p2.x) * GAME_WIDTH, p2.y * GAME_HEIGHT);
            });
            ctx.stroke();

            // 畫關節點
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 5;
            landmarks.forEach(point => {
                ctx.beginPath();
                ctx.arc((1 - point.x) * GAME_WIDTH, point.y * GAME_HEIGHT, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            if (!isWipeMode) {
                const middleMCP = landmarks[9];
                const pxM = (1 - middleMCP.x) * GAME_WIDTH;
                const pyM = middleMCP.y * GAME_HEIGHT;
                
                // 畫手心光圈
                ctx.beginPath();
                ctx.arc(pxM, pyM, 35, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${baseColor}, 0.3)`;
                ctx.fill();
                ctx.strokeStyle = `rgba(${baseColor}, 0.8)`;
                ctx.lineWidth = 2;
                ctx.stroke();

                // 繪製手上持有的物品
                const handSide = isRight ? 'right' : 'left';
                const heldItem = dragItems[handSide];
                if (heldItem) {
                    ctx.save();
                    ctx.translate(pxM, pyM);
                    if (heldItem === 'RAW_PASTA') {
                        ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
                    } else if (heldItem === 'COOKED_PASTA') {
                        ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
                    } else if (heldItem === 'CILANTRO') {
                        ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
                    } else if (heldItem === 'CEMENT') {
                        ctx.fillStyle = '#95a5a6'; ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI * 2); ctx.fill();
                    } else if (heldItem === 'FINISHED_PLATE') {
                        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.restore();
                }
            } else {
                // 擦桌子模式：雙手都有抹布
                const middleMCP = landmarks[9];
                const pxM = (1 - middleMCP.x) * GAME_WIDTH;
                const pyM = middleMCP.y * GAME_HEIGHT;
                const angle = Math.atan2(pyM - pyW, pxM - pxW);

                ctx.translate(pxM, pyM);
                ctx.rotate(angle);

                // 畫一塊橘色/黃色的抹布海綿
                ctx.fillStyle = 'rgba(243, 156, 18, 0.85)';
                ctx.shadowColor = 'rgba(243, 156, 18, 1)';
                ctx.shadowBlur = 20;

                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(-25, -40, 50, 80, 15);
                } else {
                    ctx.rect(-25, -40, 50, 80);
                }
                ctx.fill();

                // 抹布上的紋理線條
                ctx.strokeStyle = 'rgba(211, 84, 0, 0.6)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-10, -20); ctx.lineTo(-10, 20);
                ctx.moveTo(10, -20); ctx.lineTo(10, 20);
                ctx.stroke();
            }

            // --- 繪製 UI 滯留進度環 ---
            if (macroState !== 'GAMEPLAY' && uiDwellProgress > 0) {
                const middleMCP = landmarks[9];
                const pxM = (1 - middleMCP.x) * GAME_WIDTH;
                const pyM = middleMCP.y * GAME_HEIGHT;

                const r = 45;
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 6;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(pxM, pyM, r, -Math.PI / 2, -Math.PI / 2 + uiDwellProgress * Math.PI * 2);
                const ringColor = uiDwellProgress > 0.7 ? '#2ecc71' : '#f1c40f';
                ctx.strokeStyle = ringColor;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = ringColor;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function renderGame() {
            // 切換空間導航按鈕 (僅在 GAMEPLAY 顯示，之後會換成手勢觸發)
            drawNavigationArrows();

            if (microLocation === 'COUNTER') {
                // 畫客人 (僅顯示正在點餐的第一位)
                const orderingCustomers = customers.filter(c => c.state === 'ORDERING');
                if (orderingCustomers.length > 0) {
                    const c = orderingCustomers[0];
                    let cx = 480;
                    let cy = 300;

                    ctx.save();
                    // 畫客人本體
                    ctx.fillStyle = '#3498db';
                    ctx.beginPath(); ctx.arc(cx, cy, 40, 0, Math.PI * 2); ctx.fill(); // 頭
                    ctx.fillRect(cx - 30, cy + 40, 60, 80); // 身體

                    // 點餐氣泡
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(cx, cy - 80, 50, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.font = '30px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🍝', cx, cy - 70);

                    // 出餐滯留環 (接單進度)
                    if (c.serveDwell > 0) {
                        ctx.beginPath();
                        ctx.arc(cx, cy - 80, 55, -Math.PI / 2, -Math.PI / 2 + c.serveDwell * Math.PI * 2);
                        ctx.strokeStyle = '#2ecc71';
                        ctx.lineWidth = 6;
                        ctx.stroke();
                    }

                    // 耐心條
                    ctx.fillStyle = '#333';
                    ctx.fillRect(cx - 50, cy + 130, 100, 10);
                    ctx.fillStyle = c.patience > 50 ? '#2ecc71' : '#e74c3c';
                    ctx.fillRect(cx - 50, cy + 130, c.patience, 10);

                    ctx.restore();
                }

                // 畫後面的排隊者 (簡化顯示)
                if (orderingCustomers.length > 1) {
                    for (let i = 1; i < orderingCustomers.length; i++) {
                        let cx = 480 + (i * 150);
                        ctx.fillStyle = 'rgba(127, 140, 141, 0.5)';
                        ctx.beginPath(); ctx.arc(cx, 300, 40, 0, Math.PI * 2); ctx.fill();
                    }
                }

                // 畫掉落的錢
                droppedMoney.forEach(m => {
                    ctx.save();
                    ctx.translate(m.body.position.x, m.body.position.y);
                    ctx.rotate(m.body.angle);
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 4; ctx.stroke();
                    ctx.fillStyle = '#d35400';
                    ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('$', 0, 7);
                    ctx.restore();
                });

                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('櫃檯區：露出微笑即可接單', 30, GAME_HEIGHT - 30);

                if (customers.length >= LEVELS[currentLevelIndex].tables) {
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = 'bold 32px Arial';
                    ctx.textAlign = 'right';
                    ctx.fillText('● 店內客滿 (FULL)', GAME_WIDTH - 30, GAME_HEIGHT - 30);
                    ctx.textAlign = 'left';
                }
            }

            if (microLocation === 'DINING_ROOM') {
                // 1. 清理桌面邏輯
                activeHandPositions.forEach(pos => {
                    tableStates.forEach((state, idx) => {
                        if (state === 'DIRTY') {
                            const tablePos = TABLE_POSITIONS[idx];
                            if (Math.hypot(pos.x - tablePos.x, pos.y - tablePos.y) < 100) {
                                tableCleanProgress[idx] += 0.8;
                                if (tableCleanProgress[idx] >= 100) {
                                    tableStates[idx] = 'FREE'; tableCleanProgress[idx] = 0;
                                    showTip('✨ 桌面已清理乾淨！');
                                }
                            }
                        }
                    });
                });

                // 2. 繪製桌子與內容 (基於 tableStates)
                for (let i = 0; i < LEVELS[currentLevelIndex].tables; i++) {
                    const pos = TABLE_POSITIONS[i];
                    const state = tableStates[i];
                    
                    // 桌子基座
                    ctx.fillStyle = '#7f8c8d'; ctx.fillRect(pos.x - 60, pos.y - 10, 120, 20);
                    ctx.fillStyle = (state === 'DIRTY') ? '#5d4037' : '#95a5a6';
                    ctx.fillRect(pos.x - 50, pos.y - 50, 100, 40);

                    if (state === 'DIRTY') {
                        // 髒污視覺與進入提示
                        ctx.fillStyle = 'rgba(101, 67, 33, 0.6)';
                        ctx.beginPath(); ctx.arc(pos.x - 20, pos.y - 35, 15, 0, Math.PI * 2); ctx.fill();
                        
                        ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
                        ctx.fillText('停留進入清理', pos.x, pos.y - 70);
                    } else if (state === 'OCCUPIED' || state === 'EATING') {
                        const c = customers.find(cust => cust.tableIndex === i);
                        if (c) {
                            let cx = pos.x; let cy = pos.y - 80;
                            ctx.save();
                            ctx.fillStyle = (state === 'EATING') ? '#d35400' : '#e67e22';
                            ctx.beginPath(); ctx.arc(cx, cy, 35, 0, Math.PI * 2); ctx.fill();
                            ctx.fillRect(cx - 25, cy + 35, 50, 60);

                            ctx.fillStyle = 'white'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
                            ctx.fillText(state === 'EATING' ? '😋 用餐中' : '⌛ 等餐中', cx, cy - 60);

                            // 狀態條
                            ctx.fillStyle = '#333'; ctx.fillRect(cx - 30, cy + 100, 60, 6);
                            if (state === 'OCCUPIED') {
                                ctx.fillStyle = c.patience > 50 ? '#2ecc71' : '#e74c3c';
                                ctx.fillRect(cx - 30, cy + 100, (c.patience / 100) * 60, 6);
                            } else {
                                ctx.fillStyle = '#3498db';
                                ctx.fillRect(cx - 30, cy + 100, (c.eatTimer / 300) * 60, 6);
                            }
                            ctx.restore();
                        }
                    }
                }
            }

            if (microLocation === 'TABLE_CLEANING') {
                // 畫特寫大桌子
                ctx.fillStyle = '#7f8c8d'; ctx.fillRect(100, 450, 760, 40); 
                ctx.fillStyle = '#95a5a6'; ctx.fillRect(100, 150, 760, 300); 
                
                if (cleaningSubState === 'WIPE_TABLE') {
                    // 顯示髒污特寫 (僅顯示尚未清理的部分)
                    stains.forEach(stain => {
                        if (!stain.cleaned) {
                            ctx.fillStyle = 'rgba(101, 67, 33, 0.4)';
                            ctx.beginPath(); ctx.arc(stain.x, stain.y, stain.size, 0, Math.PI*2); ctx.fill();
                        }
                    });
                    
                    // 清理進度條
                    const progress = tableCleanProgress[currentCleaningTable];
                    ctx.fillStyle = '#333'; ctx.fillRect(280, 100, 400, 20);
                    ctx.fillStyle = '#f1c40f'; ctx.fillRect(280, 100, (progress/100)*400, 20);
                    ctx.fillStyle = 'white'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('在桌面上快速來回擦拭！', 480, 90);
                } else if (cleaningSubState === 'CLEAR_TRASH') {
                    ctx.fillStyle = 'white'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('請先把桌上的碗盤撥到旁邊！', 480, 90);
                }

                // 畫出物理垃圾 (特寫畫面)
                trashBodies.forEach(body => {
                    ctx.save();
                    ctx.translate(body.position.x, body.position.y); ctx.rotate(body.angle);
                    if (body.label === 'trash_plate') {
                        ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2);
                        ctx.fillStyle = '#ecf0f1'; ctx.fill();
                        ctx.lineWidth = 4; ctx.strokeStyle = '#bdc3c7'; ctx.stroke();
                    } else if (body.label === 'trash_utensil') {
                        // 改變筷子顏色為深木色，與淺色桌面區分
                        ctx.fillStyle = '#5d4037'; ctx.fillRect(-10, -50, 20, 100);
                    } else if (body.label === 'trash_cup') {
                        ctx.fillStyle = '#e74c3c'; ctx.fillRect(-20, -35, 40, 70);
                    }
                    ctx.restore();
                });
                
                ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'left';
                ctx.fillText('⬅️ 停留左上角返回', 20, 40);
            }

            if (microLocation === 'KITCHEN') {
                drawCookingUI();
            } else if (microLocation === 'SINK') {
                if (washingPlate.dirtAmount > 0) {
                    // 畫盤子底座
                    ctx.fillStyle = '#ecf0f1';
                    ctx.beginPath();
                    ctx.arc(washingPlate.x + washingPlate.w / 2, washingPlate.y + washingPlate.h / 2, 100, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 8;
                    ctx.strokeStyle = '#bdc3c7';
                    ctx.stroke();

                    ctx.fillStyle = `rgba(120, 100, 60, ${washingPlate.dirtAmount / 100})`;
                    ctx.beginPath();
                    ctx.arc(washingPlate.x + washingPlate.w / 2, washingPlate.y + washingPlate.h / 2, 85, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 22px Arial';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'black';
                    ctx.fillText('在盤子上快速來回搓洗！', washingPlate.x + 150, washingPlate.y - 40);

                    // 顯示進度百分比
                    const progress = Math.floor(Math.min(100, (scrubAccumulator / SCRUB_THRESHOLD) * 100));
                    ctx.fillStyle = '#f1c40f';
                    ctx.font = 'bold 32px Arial';
                    ctx.fillText(`洗滌進度: ${progress}%`, washingPlate.x + 150, washingPlate.y - 10);

                    ctx.textAlign = 'left';
                    ctx.shadowBlur = 0;
                } else {
                    if (cleanPlates < MAX_PLATES) {
                        // 畫乾淨的盤子
                        ctx.fillStyle = '#ecf0f1';
                        ctx.beginPath();
                        ctx.arc(washingPlate.x + washingPlate.w / 2, washingPlate.y + washingPlate.h / 2, 100, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.lineWidth = 8;
                        ctx.strokeStyle = '#bdc3c7';
                        ctx.stroke();

                        ctx.fillStyle = '#2ecc71';
                        ctx.font = 'bold 32px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('✨ 閃閃發亮 ✨', washingPlate.x + 150, washingPlate.y + 150);
                        ctx.textAlign = 'left';
                    } else {
                        ctx.fillStyle = '#f1c40f';
                        ctx.font = 'bold 32px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('✅ 盤子已經補滿囉！', GAME_WIDTH / 2, GAME_HEIGHT / 2);
                        ctx.textAlign = 'left';
                    }
                }
            }
        }

        // --- 繪製空間導航箭頭 (Phase 2: 手部滯留觸發) ---
        function drawNavigationArrows() {
            let allowedTargets = [];
            if (microLocation === 'COUNTER') allowedTargets = ['KITCHEN', 'DINING_ROOM'];
            else if (microLocation === 'KITCHEN') allowedTargets = ['COUNTER', 'SINK'];
            else if (microLocation === 'DINING_ROOM') allowedTargets = ['COUNTER'];
            else if (microLocation === 'SINK') allowedTargets = ['KITCHEN'];

            const arrowDefs = [
                {
                    key: 'KITCHEN', show: allowedTargets.includes('KITCHEN'),
                    cx: 55, cy: GAME_HEIGHT / 2, label: '廚房',
                    labelX: 30, labelY: GAME_HEIGHT / 2 + 70,
                    draw: () => { ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40); }
                },
                {
                    key: 'COUNTER', show: allowedTargets.includes('COUNTER'),
                    cx: GAME_WIDTH / 2, cy: 55, label: '櫃檯',
                    labelX: GAME_WIDTH / 2 - 20, labelY: 110,
                    draw: () => {
                        if (microLocation === 'KITCHEN') {
                            // 廚房回櫃檯是向右
                            ctx.moveTo(GAME_WIDTH - 30, GAME_HEIGHT / 2); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 - 40); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 + 40);
                        } else if (microLocation === 'DINING_ROOM') {
                            // 用餐區回櫃檯是向左
                            ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40);
                        } else {
                            // 向上
                            ctx.moveTo(GAME_WIDTH / 2, 30); ctx.lineTo(GAME_WIDTH / 2 - 40, 80); ctx.lineTo(GAME_WIDTH / 2 + 40, 80);
                        }
                    }
                },
                {
                    key: 'DINING_ROOM', show: allowedTargets.includes('DINING_ROOM'),
                    cx: GAME_WIDTH - 55, cy: GAME_HEIGHT / 2, label: '用餐區',
                    labelX: GAME_WIDTH - 80, labelY: GAME_HEIGHT / 2 + 70,
                    draw: () => { ctx.moveTo(GAME_WIDTH - 30, GAME_HEIGHT / 2); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 - 40); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 + 40); }
                },
                {
                    key: 'SINK', show: allowedTargets.includes('SINK'),
                    cx: GAME_WIDTH / 2, cy: GAME_HEIGHT - 45, label: '洗手台',
                    labelX: GAME_WIDTH / 2 - 30, labelY: GAME_HEIGHT - 85,
                    draw: () => { ctx.moveTo(GAME_WIDTH / 2, GAME_HEIGHT - 30); ctx.lineTo(GAME_WIDTH / 2 - 40, GAME_HEIGHT - 70); ctx.lineTo(GAME_WIDTH / 2 + 40, GAME_HEIGHT - 70); }
                }
            ];

            // 特殊處理：修正 COUNTER 在不同位置時的座標定義
            const counterDef = arrowDefs.find(a => a.key === 'COUNTER');
            if (microLocation === 'KITCHEN') {
                counterDef.cx = GAME_WIDTH - 55; counterDef.cy = GAME_HEIGHT / 2;
                counterDef.labelX = GAME_WIDTH - 80; counterDef.labelY = GAME_HEIGHT / 2 + 70;
            } else if (microLocation === 'DINING_ROOM') {
                counterDef.cx = 55; counterDef.cy = GAME_HEIGHT / 2;
                counterDef.labelX = 30; counterDef.labelY = GAME_HEIGHT / 2 + 70;
            } else if (microLocation === 'SINK') {
                // 從洗手台回廚房的箭頭移至左側，避免被頂部訂單擋住
                const kitchenDef = arrowDefs.find(a => a.key === 'KITCHEN');
                kitchenDef.cx = 55; kitchenDef.cy = GAME_HEIGHT / 2;
                kitchenDef.labelX = 30; kitchenDef.labelY = GAME_HEIGHT / 2 + 70;
                kitchenDef.draw = () => { ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40); };
            }

            for (const arrow of arrowDefs) {
                if (!arrow.show) continue;
                ctx.save();

                const isHovering = hoverTarget === arrow.key;
                const pulse = isHovering ? 0.5 + Math.sin(Date.now() / 200) * 0.2 : 0.2;

                // 箭頭本體
                ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1, pulse + 0.3)})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                arrow.draw();
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 標籤
                ctx.fillStyle = isHovering ? '#f1c40f' : 'white';
                ctx.font = isHovering ? 'bold 22px Arial' : '20px Arial';
                ctx.fillText(arrow.label, arrow.labelX, arrow.labelY);

                // 滯留進度環
                if (isHovering && dwellProgress > 0) {
                    const r = 48;
                    // 底環
                    ctx.beginPath();
                    ctx.arc(arrow.cx, arrow.cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                    ctx.lineWidth = 7;
                    ctx.stroke();
                    // 進度弧
                    ctx.beginPath();
                    ctx.arc(arrow.cx, arrow.cy, r, -Math.PI / 2, -Math.PI / 2 + dwellProgress * Math.PI * 2);
                    const ringColor = dwellProgress > 0.7 ? '#2ecc71' : '#f1c40f';
                    ctx.strokeStyle = ringColor;
                    ctx.lineWidth = 7;
                    ctx.lineCap = 'round';
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = ringColor;
                    ctx.stroke();
                    // 百分比
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${Math.round(dwellProgress * 100)}%`, arrow.cx, arrow.cy + 6);
                    ctx.textAlign = 'left';
                }

                ctx.restore();
            }
            if (tipTimer > 0) {
                tipTimer--;
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(GAME_WIDTH / 2 - 250, GAME_HEIGHT / 2 - 30, 500, 60);
                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(tipText, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10);
                ctx.restore();
            }

            // 微笑偵測指示燈 (Debug/回饋用)
            if (isSmiling) {
                ctx.save();
                ctx.fillStyle = '#2ecc71';
                ctx.font = 'bold 20px Arial';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#2ecc71';
                const pulse = 1 + Math.sin(Date.now() / 150) * 0.1;
                ctx.translate(30, GAME_HEIGHT - 160);
                ctx.scale(pulse, pulse);
                ctx.fillText('😊 微笑接單中...', 0, 0);
                ctx.restore();
            }
        }

        function updateScore(delta) {
            score += delta;
            scoreDisplay.innerText = score;
            if (delta > 0) {
                scoreDisplay.style.color = '#2ecc71';
            } else {
                scoreDisplay.style.color = '#e74c3c';
            }
            setTimeout(() => scoreDisplay.style.color = 'white', 500);
        }

        function updateReviews() {
            if (negativeReviews > 0) {
                reviewDisplay.style.display = 'inline-block';
                reviewDisplay.innerText = `😡 負評: ${negativeReviews}`;
                // 動畫閃爍
                reviewDisplay.style.transform = 'scale(1.3)';
                setTimeout(() => reviewDisplay.style.transform = 'scale(1)', 300);
            }
        }

        initMediaPipe();
    </script>
</body>
