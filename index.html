<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪洨餐館 - MVP 核心架構 (第一人稱視角)</title>
    <style>
        /* 基礎重置與背景 */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 遊戲主容器 */
        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            margin-top: 20px;
            background-color: #2c3e50;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Canvas 與 Video */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        video {
            display: none;
        }

        /* 遊戲內疊加 UI 層 (HUD) */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; /* 讓滑鼠點擊可以穿透到下方的 HTML/Canvas */
        }
        .hud {
            position: absolute;
            padding: 15px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #status-hud { top: 15px; left: 15px; display: none; } /* 預設隱藏，遊戲中才顯示 */
        #satisfaction-bar-container {
            width: 220px;
            height: 22px;
            background: #333;
            border-radius: 11px;
            overflow: hidden;
            margin-top: 8px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        #satisfaction-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            transition: width 0.1s, background 0.3s;
        }

        /* --- 宏觀狀態 UI 面板 (HTML 實作) --- */
        .panel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hidden { display: none !important; }

        /* 標題畫面 */
        #title-screen h1 {
            font-size: 64px;
            color: #f1c40f;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }
        #title-screen p {
            font-size: 24px;
            color: #ccc;
            margin-bottom: 40px;
        }

        /* 關卡選擇畫面 */
        #level-select-screen h2 {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 30px;
        }
        .level-grid {
            display: flex;
            gap: 20px;
        }
        .level-card {
            background: #2c3e50;
            border: 2px solid #34495e;
            border-radius: 12px;
            padding: 20px;
            width: 180px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .level-card:hover { transform: translateY(-5px); background: #34495e; }
        .level-card.locked { opacity: 0.5; filter: grayscale(100%); cursor: not-allowed; }
        .level-card.locked:hover { transform: none; background: #2c3e50; }
        .level-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .level-stars { font-size: 24px; color: #f1c40f; letter-spacing: 2px; }

        /* 結算畫面 */
        #result-screen h2 { font-size: 48px; margin-bottom: 20px; }
        #result-money { font-size: 64px; color: #2ecc71; margin-bottom: 10px; }
        #result-stars { font-size: 48px; color: #f1c40f; margin-bottom: 30px; letter-spacing: 5px; }

        /* 共用按鈕樣式 (HTML 按鈕，僅供滑鼠測試或未來替換為手勢觸發) */
        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: #e74c3c;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c0392b;
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 10px;
        }
        .btn:hover { background: #e74c3c; transform: translateY(2px); box-shadow: 0 2px 0 #c0392b; }
        .btn:active { transform: translateY(4px); box-shadow: none; }

        /* 載入中文字 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            z-index: 200;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
        }

        /* 除錯按鈕區 (暫時保留用於測試) */
        #controls {
            margin-top: 20px;
            z-index: 30;
            display: flex;
            gap: 10px;
        }
        #controls button {
            padding: 10px 20px; font-size: 14px;
        }
    </style>
    <!-- Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="loading">載入 MediaPipe 模型與相機中...</div>
        <video id="webcam" width="960" height="540" autoplay playsinline></video>
        <canvas id="game-canvas" width="960" height="540"></canvas>
        
        <!-- 遊戲進行中的 HUD (目前隱藏，進入 GAMEPLAY 才顯示) -->
        <div id="ui-layer">
            <div id="status-hud" class="hud">
                <div style="font-size: 1.1em;">目標金額: $<span id="target-display">0</span> | 時間: <span id="time-display" style="color:#e74c3c; font-weight:bold;">0</span>s</div>
                <div style="font-size: 1.1em; margin-top: 5px;">目前位置: <span id="location-display" style="font-weight:bold; color:#3498db;">COUNTER (櫃檯)</span></div>
                <div style="margin-top: 5px;">營業額: $<span id="score-display" style="font-weight:bold; font-size: 1.2em; color:#2ecc71;">0</span></div>
                
                <!-- 暫時保留滿意度條給後續櫃檯邏輯用 -->
                <div id="satisfaction-container" style="display:none;">
                    <div style="margin-top: 10px; font-size: 0.9em; color:#ccc;">客人滿意度:</div>
                    <div id="satisfaction-bar-container">
                        <div id="satisfaction-bar"></div>
                    </div>
                    <div id="smile-indicator" style="margin-top:8px; font-weight:bold; color:#e74c3c;">未偵測到微笑</div>
                </div>
            </div>
        </div>

        <!-- 標題畫面 (TITLE) -->
        <div id="title-screen" class="panel-overlay hidden">
            <h1>42號義麵店</h1>
            <p>雙手與微笑，是最好的調味料</p>
            <button class="btn" onclick="changeMacroState('LEVEL_SELECT')">開始營業</button>
        </div>

        <!-- 關卡選擇畫面 (LEVEL_SELECT) -->
        <div id="level-select-screen" class="panel-overlay hidden">
            <h2>選擇關卡</h2>
            <div class="level-grid" id="level-grid-container">
                <!-- 由 JS 動態生成 -->
            </div>
            <button class="btn" onclick="changeMacroState('TITLE')" style="margin-top: 40px; background:#7f8c8d; box-shadow: 0 4px 0 #546e7a;">返回標題</button>
        </div>

        <!-- 結算畫面 (LEVEL_RESULT) -->
        <div id="result-screen" class="panel-overlay hidden">
            <h2 id="result-title">關卡結算</h2>
            <div>總營業額</div>
            <div id="result-money">$0</div>
            <div id="result-stars">☆☆☆</div>
            <div style="display: flex; gap: 20px;">
                <button class="btn" onclick="changeMacroState('LEVEL_SELECT')" style="background:#3498db; box-shadow: 0 4px 0 #2980b9;">回關卡選單</button>
                <button class="btn" id="btn-next-level" onclick="startNextLevel()" style="display:none;">下一關</button>
            </div>
        </div>
    </div>

    <!-- 除錯用的狀態強制切換按鈕 -->
    <div id="controls">
        <button onclick="setMicroLocation('COUNTER')">切換: 櫃檯 (COUNTER)</button>
        <button onclick="setMicroLocation('DINING_ROOM')">切換: 用餐區 (DINING_ROOM) [測試打掃]</button>
        <button onclick="setMicroLocation('KITCHEN')">切換: 廚房 (KITCHEN) [測試洗碗]</button>
    </div>

    <script type="module">
        import {
            FaceLandmarker,
            HandLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- 遊戲架構狀態變數 ---
        let macroState = 'LOADING'; // LOADING, TITLE, LEVEL_SELECT, GAMEPLAY, LEVEL_RESULT
        let microLocation = 'COUNTER'; // COUNTER, KITCHEN, DINING_ROOM
        
        // 關卡設定
        const LEVELS = [
            { id: 1, targetMoney: 50, time: 60, tables: 2 },
            { id: 2, targetMoney: 150, time: 90, tables: 3 },
            { id: 3, targetMoney: 300, time: 120, tables: 4 }
        ];
        let currentLevelIndex = 0;
        let gameTimer = 0;
        let gameTimerInterval = null;

        // 存檔系統 (記錄每一關的最高星星數，0代表未解鎖/未過關)
        let saveMemory = {
            stars: [0, 0, 0] // 對應 LEVEL 1, 2, 3
        };

        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 540;
        let score = 0; // 改為金錢
        let satisfaction = 100;
        let isSmiling = false;

        let washingPlate = { x: 380, y: 170, w: 200, h: 200, dirtAmount: 100 };
        let lastHandPos = null;
        let scrubAccumulator = 0;
        const SCRUB_THRESHOLD = 5000;
        let stains = [];

        // 導航停留偵測 (Dwell Navigation)
        let hoverTarget = null;
        let hoverStartTime = 0;
        const HOVER_DWELL_TIME = 1500; // 停留 1.5 秒觸發
        const NAV_ZONES = {
            COUNTER:     { x: 0,   y: 190, w: 100, h: 160 },
            KITCHEN:     { x: 420, y: 0,   w: 120, h: 130 },
            DINING_ROOM: { x: 860, y: 190, w: 100, h: 160 }
        };
        let dwellProgress = 0;
        let dwellCooldown = 0;
        const DWELL_COOLDOWN_TIME = 1000;
        let activeHandPositions = [];

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');
        const stateDisplay = document.getElementById('location-display');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const targetDisplay = document.getElementById('target-display');
        const satBar = document.getElementById('satisfaction-bar');
        const smileInd = document.getElementById('smile-indicator');
        const statusHud = document.getElementById('status-hud');

        // UI 畫面元素
        const titleScreen = document.getElementById('title-screen');
        const levelSelectScreen = document.getElementById('level-select-screen');
        const resultScreen = document.getElementById('result-screen');
        const levelGrid = document.getElementById('level-grid-container');

        let faceLandmarker, handLandmarker;
        let lastVideoTime = -1;
        let faceResult = null, handResult = null;

        // 手部骨架連接對應表
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [5, 9], [9, 10], [10, 11], [11, 12],
            [9, 13], [13, 14], [14, 15], [15, 16],
            [13, 17], [17, 18], [18, 19], [19, 20],
            [0, 17]
        ];

        async function initMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );

            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                    delegate: "GPU"
                },
                outputFaceBlendshapes: true,
                runningMode: "VIDEO",
                numFaces: 1
            });

            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });

            startCamera();
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: GAME_WIDTH, height: GAME_HEIGHT } });
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    loadingEl.classList.add('hidden');
                    initMatterJs();
                    loadSaveData();
                    changeMacroState('TITLE'); // 載入完成，進入標題畫面
                    requestAnimationFrame(gameLoop);
                });
            } catch (err) {
                alert("無法存取攝影機，請確認權限或在 Localhost/HTTPS 環境下執行。");
            }
        }

        // --- 存檔系統 ---
        function loadSaveData() {
            const saved = localStorage.getItem('42PastaSave');
            if (saved) {
                saveMemory = JSON.parse(saved);
            } else {
                // 初次遊玩，解鎖第一關
                saveMemory = { stars: [0, 0, 0] };
                saveMemory.stars[0] = 0; // 0星但可玩
            }
        }
        function saveGame() {
            localStorage.setItem('42PastaSave', JSON.stringify(saveMemory));
        }

        // --- 宏觀狀態切換 ---
        window.changeMacroState = function(newState) {
            macroState = newState;
            // 隱藏所有面板
            titleScreen.classList.add('hidden');
            levelSelectScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            statusHud.style.display = 'none';

            if (newState === 'TITLE') {
                titleScreen.classList.remove('hidden');
            } else if (newState === 'LEVEL_SELECT') {
                buildLevelSelectUI();
                levelSelectScreen.classList.remove('hidden');
            } else if (newState === 'GAMEPLAY') {
                statusHud.style.display = 'block';
                startLevel(currentLevelIndex);
            } else if (newState === 'LEVEL_RESULT') {
                showResultScreen();
            }
        };

        // --- 關卡選擇與初始化 ---
        function buildLevelSelectUI() {
            levelGrid.innerHTML = '';
            LEVELS.forEach((level, index) => {
                const isLocked = index > 0 && saveMemory.stars[index - 1] < 2; // 需要前一關2星解鎖
                
                const card = document.createElement('div');
                card.className = `level-card ${isLocked ? 'locked' : ''}`;
                
                let starText = isLocked ? '🔒' : '☆'.repeat(3);
                if (!isLocked && saveMemory.stars[index] > 0) {
                    starText = '★'.repeat(saveMemory.stars[index]) + '☆'.repeat(3 - saveMemory.stars[index]);
                }

                card.innerHTML = `
                    <div class="level-title">關卡 ${level.id}</div>
                    <div style="font-size: 14px; color: #bdc3c7; margin-bottom: 10px;">目標: $${level.targetMoney} / ${level.time}s</div>
                    <div class="level-stars">${starText}</div>
                `;

                if (!isLocked) {
                    card.onclick = () => {
                        currentLevelIndex = index;
                        changeMacroState('GAMEPLAY');
                    };
                }
                levelGrid.appendChild(card);
            });
        }

        function startLevel(index) {
            const levelData = LEVELS[index];
            score = 0;
            scoreDisplay.innerText = score;
            targetDisplay.innerText = levelData.targetMoney;
            gameTimer = levelData.time;
            timeDisplay.innerText = gameTimer;
            
            setMicroLocation('COUNTER'); // 遊戲開始預設在櫃檯

            // 啟動倒數計時器
            if (gameTimerInterval) clearInterval(gameTimerInterval);
            gameTimerInterval = setInterval(() => {
                if (macroState === 'GAMEPLAY') {
                    gameTimer--;
                    timeDisplay.innerText = gameTimer;
                    if (gameTimer <= 0) {
                        clearInterval(gameTimerInterval);
                        changeMacroState('LEVEL_RESULT');
                    }
                }
            }, 1000);
        }

        function showResultScreen() {
            const levelData = LEVELS[currentLevelIndex];
            document.getElementById('result-money').innerText = `$${score}`;
            
            // 計算星星
            let earnedStars = 0;
            if (score >= levelData.targetMoney * 1.5) earnedStars = 3;
            else if (score >= levelData.targetMoney) earnedStars = 2;
            else if (score >= levelData.targetMoney * 0.5) earnedStars = 1;

            let starDisplay = '';
            for(let i=0; i<3; i++) starDisplay += (i < earnedStars) ? '★' : '☆';
            document.getElementById('result-stars').innerText = starDisplay;

            // 存檔更新
            if (earnedStars > saveMemory.stars[currentLevelIndex]) {
                saveMemory.stars[currentLevelIndex] = earnedStars;
                saveGame();
            }

            // 判斷是否顯示下一關按鈕 (有下一關且拿到2星以上)
            const nextBtn = document.getElementById('btn-next-level');
            if (currentLevelIndex < LEVELS.length - 1 && earnedStars >= 2) {
                nextBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'none';
            }

            resultScreen.classList.remove('hidden');
        }

        window.startNextLevel = function() {
            currentLevelIndex++;
            changeMacroState('GAMEPLAY');
        };

        // --- 微觀空間切換 (Micro Location) ---
        window.setMicroLocation = function(loc) {
            if (macroState !== 'GAMEPLAY') return;
            microLocation = loc;
            stateDisplay.innerText = loc;
            
            // 清理舊狀態物件
            trashBodies.forEach(b => World.remove(world, b));
            trashBodies = [];
            stains = [];
            scrubAccumulator = 0;
            washingPlate.dirtAmount = 100;

            // 根據不同房間初始化環境
            if (loc === 'DINING_ROOM') {
                // 為了測試，進入用餐區時直接生成打掃事件
                cleaningSubState = 'INIT';
                setTimeout(() => { cleaningSubState = 'CLEAR_TRASH'; }, 1500); // 提示 1.5 秒後開始
                lastOrderType = Math.random() > 0.5 ? 'PASTA' : 'DRINK';

                // 生成特定餐具垃圾
                if (lastOrderType === 'PASTA') {
                    let plate = Bodies.circle(480, 300, 60, { frictionAir: 0.1, label: 'trash_plate', restitution: 0.2 });
                    let fork = Bodies.rectangle(600, 300, 20, 100, { frictionAir: 0.1, label: 'trash_utensil', restitution: 0.2 });
                    trashBodies.push(plate, fork);
                    World.add(world, [plate, fork]);
                } else {
                    let cup = Bodies.rectangle(480, 300, 40, 70, { frictionAir: 0.1, label: 'trash_cup', restitution: 0.2 });
                    trashBodies.push(cup);
                    World.add(world, cup);
                }

                // 生成紙團
                const paperCount = 2 + Math.floor(Math.random() * 3);
                for (let i = 0; i < paperCount; i++) {
                    let trash = Bodies.circle(200 + Math.random()*560, 150 + Math.random()*250, 25, {
                        frictionAir: 0.15,
                        label: 'trash_paper',
                        restitution: 0.3
                    });
                    trashBodies.push(trash);
                    World.add(world, trash);
                }

                for(let i = 0; i < 5; i++) {
                    stains.push({
                        x: 200 + Math.random()*560,
                        y: 150 + Math.random()*250,
                        r: 45,
                        alpha: 1.0
                    });
                }
            }
        };

        // --- Phase 2: 手部滯留導航 (Dwell Navigation) ---
        function checkDwellNavigation() {
            if (macroState !== 'GAMEPLAY') return;
            if (Date.now() < dwellCooldown) {
                hoverTarget = null;
                dwellProgress = 0;
                return;
            }

            let currentZone = null;
            for (const [key, zone] of Object.entries(NAV_ZONES)) {
                if (key === microLocation) continue;
                for (const pos of activeHandPositions) {
                    if (pos.x >= zone.x && pos.x <= zone.x + zone.w &&
                        pos.y >= zone.y && pos.y <= zone.y + zone.h) {
                        currentZone = key;
                        break;
                    }
                }
                if (currentZone) break;
            }

            if (currentZone) {
                if (hoverTarget === currentZone) {
                    const elapsed = Date.now() - hoverStartTime;
                    dwellProgress = Math.min(1, elapsed / HOVER_DWELL_TIME);
                    if (dwellProgress >= 1) {
                        setMicroLocation(currentZone);
                        hoverTarget = null;
                        dwellProgress = 0;
                        dwellCooldown = Date.now() + DWELL_COOLDOWN_TIME;
                    }
                } else {
                    hoverTarget = currentZone;
                    hoverStartTime = Date.now();
                    dwellProgress = 0;
                }
            } else {
                hoverTarget = null;
                dwellProgress = 0;
            }
        }

        const Engine = Matter.Engine,
              World = Matter.World,
              Bodies = Matter.Bodies,
              Body = Matter.Body,
              Events = Matter.Events;

        let engine, world;
        let rightHandBody;
        let leftHandBody;
        
        let trashBodies = [];
        let cleaningSubState = 'INIT'; // INIT, CLEAR_TRASH, TRANSITION, WIPE_TABLE, DONE
        let lastOrderType = 'PASTA';

        function initMatterJs() {
            engine = Engine.create();
            world = engine.world;
            engine.world.gravity.y = 0;

            rightHandBody = Bodies.circle(-100, -100, 60, { 
                isStatic: true,
                label: 'rightHand'
            });
            leftHandBody = Bodies.circle(-100, -100, 60, { 
                isStatic: true,
                label: 'leftHand'
            });
            World.add(world, [rightHandBody, leftHandBody]);
        }

        function gameLoop() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                faceResult = faceLandmarker.detectForVideo(video, performance.now());
                handResult = handLandmarker.detectForVideo(video, performance.now());
            }

            Engine.update(engine, 1000 / 60);

            // 檢查垃圾是否被撥出畫面
            if (microLocation === 'DINING_ROOM') {
                if (cleaningSubState === 'CLEAR_TRASH') {
                    trashBodies = trashBodies.filter(body => {
                        const px = body.position.x;
                        const py = body.position.y;
                        if (px < 50 || px > 910 || py < 50 || py > 550) {
                            World.remove(world, body);
                            updateScore(5); // 賺取清理費
                            return false;
                        }
                        return true;
                    });

                    if (trashBodies.length === 0) {
                        cleaningSubState = 'TRANSITION';
                        setTimeout(() => {
                            cleaningSubState = 'WIPE_TABLE';
                        }, 1500);
                    }
                }
            }

            ctx.save();
            ctx.scale(-1, 1);
            ctx.translate(-GAME_WIDTH, 0);
            
            // 只有在 GAMEPLAY 狀態下繪製攝影機，選單狀態可以黑畫面或留底圖
            if (macroState === 'GAMEPLAY') {
                ctx.drawImage(video, 0, 0, GAME_WIDTH, GAME_HEIGHT);
            }
            
            ctx.fillStyle = 'rgba(10, 15, 20, 0.75)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.restore();

            if (macroState === 'GAMEPLAY') {
                handleFaceLogic();
                handleHandLogic();
                renderGame();
            }

            requestAnimationFrame(gameLoop);
        }

        function handleFaceLogic() {
            if (microLocation !== 'COUNTER') return; // 不在櫃檯不判定微笑

            isSmiling = false;
            if (faceResult && faceResult.faceBlendshapes.length > 0) {
                const blendshapes = faceResult.faceBlendshapes[0].categories;
                const smileLeft = blendshapes.find(c => c.categoryName === 'mouthSmileLeft')?.score || 0;
                const smileRight = blendshapes.find(c => c.categoryName === 'mouthSmileRight')?.score || 0;
                
                if (smileLeft > 0.4 || smileRight > 0.4) isSmiling = true;
            }

            if (isSmiling) {
                satisfaction = Math.min(100, satisfaction + 0.5);
                smileInd.innerText = "😊 微笑保持中";
                smileInd.style.color = "#2ecc71";
                satBar.style.background = "linear-gradient(90deg, #27ae60, #2ecc71)";
            } else {
                satisfaction = Math.max(0, satisfaction - 0.2);
                smileInd.innerText = "😠 客人覺得你臉臭";
                smileInd.style.color = "#e74c3c";
                satBar.style.background = "linear-gradient(90deg, #c0392b, #e74c3c)";
                if (satisfaction <= 0) updateScore(-1); // 扣錢
            }
            satBar.style.width = satisfaction + "%";
        }

        function handleHandLogic() {
            activeHandPositions = [];
            if (!handResult || handResult.landmarks.length === 0) {
                Body.setPosition(rightHandBody, {x: -100, y: -100});
                lastHandPos = null;
                checkDwellNavigation();
                return;
            }

            let rightHandIdx = -1;
            let leftHandIdx = -1;

            handResult.handednesses.forEach((h, idx) => {
                if (h[0].categoryName === 'Left') rightHandIdx = idx;
                else leftHandIdx = idx;
            });

            if (rightHandIdx !== -1) {
                const landmarks = handResult.landmarks[rightHandIdx];
                const palm = landmarks[9]; 
                const px = (1 - palm.x) * GAME_WIDTH;
                const py = palm.y * GAME_HEIGHT;
                activeHandPositions.push({x: px, y: py});
                
                if (microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE') {
                    Body.setPosition(rightHandBody, {x: -100, y: -100}); 
                    checkWiping(px, py);
                } else if (microLocation === 'DINING_ROOM' && cleaningSubState === 'CLEAR_TRASH') {
                    Body.setPosition(rightHandBody, { x: px, y: py });
                } else {
                    Body.setPosition(rightHandBody, { x: px, y: py });
                }

                if (microLocation === 'KITCHEN' && washingPlate.dirtAmount > 0) {
                    checkScrubbing(px, py);
                }
            } else {
                Body.setPosition(rightHandBody, {x: -100, y: -100});
            }

            if (leftHandIdx !== -1) {
                const landmarks = handResult.landmarks[leftHandIdx];
                const palm = landmarks[9];
                const px = (1 - palm.x) * GAME_WIDTH;
                const py = palm.y * GAME_HEIGHT;
                activeHandPositions.push({x: px, y: py});

                if (microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE') {
                    Body.setPosition(leftHandBody, {x: -100, y: -100});
                    checkWiping(px, py);
                } else if (microLocation === 'DINING_ROOM' && cleaningSubState === 'CLEAR_TRASH') {
                    Body.setPosition(leftHandBody, { x: px, y: py });
                } else {
                    Body.setPosition(leftHandBody, { x: px, y: py });
                }
                
                if (microLocation === 'KITCHEN' && washingPlate.dirtAmount > 0 && rightHandIdx === -1) {
                     checkScrubbing(px, py);
                }
            } else {
                Body.setPosition(leftHandBody, {x: -100, y: -100});
            }

            checkDwellNavigation();
        }

        function checkWiping(px, py) {
            stains.forEach(stain => {
                if (stain.alpha > 0) {
                    const dist = Math.hypot(px - stain.x, py - stain.y);
                    if (dist < stain.r + 80) {
                        stain.alpha = Math.max(0, stain.alpha - 0.08);
                    }
                }
            });
        }

        function checkScrubbing(px, py) {
            if (px > washingPlate.x && px < washingPlate.x + washingPlate.w &&
                py > washingPlate.y && py < washingPlate.y + washingPlate.h) {
                
                if (lastHandPos) {
                    const dist = Math.hypot(px - lastHandPos.x, py - lastHandPos.y);
                    scrubAccumulator += dist;
                    
                    washingPlate.dirtAmount = 100 - (scrubAccumulator / SCRUB_THRESHOLD) * 100;
                    
                    if (washingPlate.dirtAmount <= 0) {
                        washingPlate.dirtAmount = 0;
                        updateScore(20);
                    }
                }
                lastHandPos = { x: px, y: py };
            } else {
                lastHandPos = null;
            }
        }

        function drawFirstPersonHand(landmarks, isRight, isWipeMode) {
            ctx.save();
            // 在 WIPE_TABLE 階段，雙手都變成綠色 (抹布) 的感覺
            const baseColor = isWipeMode ? '46, 204, 113' : (isRight ? '52, 152, 219' : '46, 204, 113');
            
            // 繪製模擬手臂 (從手腕延伸至螢幕底部)
            const wrist = landmarks[0];
            const pxW = (1 - wrist.x) * GAME_WIDTH;
            const pyW = wrist.y * GAME_HEIGHT;
            
            ctx.beginPath();
            ctx.moveTo(pxW - 25, pyW);
            ctx.lineTo(pxW - 50, GAME_HEIGHT + 50);
            ctx.lineTo(pxW + 50, GAME_HEIGHT + 50);
            ctx.lineTo(pxW + 25, pyW);
            const armGrad = ctx.createLinearGradient(pxW, pyW, pxW, GAME_HEIGHT);
            armGrad.addColorStop(0, `rgba(${baseColor}, 0.5)`);
            armGrad.addColorStop(1, `rgba(${baseColor}, 0.0)`);
            ctx.fillStyle = armGrad;
            ctx.fill();

            // 繪製骨架發光特效
            ctx.shadowBlur = 15;
            ctx.shadowColor = `rgb(${baseColor})`;
            ctx.strokeStyle = `rgba(${baseColor}, 0.9)`;
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 畫骨架連線
            ctx.beginPath();
            HAND_CONNECTIONS.forEach(pair => {
                const p1 = landmarks[pair[0]];
                const p2 = landmarks[pair[1]];
                ctx.moveTo((1 - p1.x) * GAME_WIDTH, p1.y * GAME_HEIGHT);
                ctx.lineTo((1 - p2.x) * GAME_WIDTH, p2.y * GAME_HEIGHT);
            });
            ctx.stroke();

            // 畫關節點
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 5;
            landmarks.forEach(point => {
                ctx.beginPath();
                ctx.arc((1 - point.x) * GAME_WIDTH, point.y * GAME_HEIGHT, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            if (!isWipeMode) {
                // 推垃圾模式：手心光圈
                const middleMCP = landmarks[9];
                const pxM = (1 - middleMCP.x) * GAME_WIDTH;
                const pyM = middleMCP.y * GAME_HEIGHT;
                ctx.beginPath();
                ctx.arc(pxM, pyM, 35, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${baseColor}, 0.3)`;
                ctx.fill();
                ctx.strokeStyle = `rgba(${baseColor}, 0.8)`;
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                // 擦桌子模式：雙手都有抹布
                const middleMCP = landmarks[9];
                const pxM = (1 - middleMCP.x) * GAME_WIDTH;
                const pyM = middleMCP.y * GAME_HEIGHT;
                const angle = Math.atan2(pyM - pyW, pxM - pxW);

                ctx.translate(pxM, pyM);
                ctx.rotate(angle);
                
                // 畫一塊橘色/黃色的抹布海綿
                ctx.fillStyle = 'rgba(243, 156, 18, 0.85)';
                ctx.shadowColor = 'rgba(243, 156, 18, 1)';
                ctx.shadowBlur = 20;
                
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(-25, -40, 50, 80, 15);
                } else {
                    ctx.rect(-25, -40, 50, 80);
                }
                ctx.fill();
                
                // 抹布上的紋理線條
                ctx.strokeStyle = 'rgba(211, 84, 0, 0.6)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-10, -20); ctx.lineTo(-10, 20);
                ctx.moveTo(10, -20); ctx.lineTo(10, 20);
                ctx.stroke();
            }

            ctx.restore();
        }

        function renderGame() {
            // 切換空間導航按鈕 (僅在 GAMEPLAY 顯示，之後會換成手勢觸發)
            drawNavigationArrows();

            if (microLocation === 'COUNTER') {
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'black';
                ctx.fillText('櫃檯區：請看著鏡頭保持微笑！', GAME_WIDTH/2, GAME_HEIGHT/2);
                ctx.textAlign = 'left';
                ctx.shadowBlur = 0;
                document.getElementById('satisfaction-container').style.display = 'block';
            } else {
                document.getElementById('satisfaction-container').style.display = 'none';
            }

            if (microLocation === 'DINING_ROOM') {
                // 畫出木頭桌子的範圍
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(100, 100, 760, 400, 20);
                } else {
                    ctx.rect(100, 100, 760, 400);
                }
                ctx.fill();
                ctx.lineWidth = 10;
                ctx.strokeStyle = '#5C3A21';
                ctx.stroke();

                // 畫污漬
                let remainingStainsCount = 0;
                stains.forEach(stain => {
                    if (stain.alpha > 0) {
                        remainingStainsCount++;
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(stain.x, stain.y, stain.r, 0, Math.PI * 2);
                        let grad = ctx.createRadialGradient(stain.x, stain.y, 0, stain.x, stain.y, stain.r);
                        grad.addColorStop(0, `rgba(101, 67, 33, ${stain.alpha})`);
                        grad.addColorStop(1, `rgba(101, 67, 33, 0)`);
                        ctx.fillStyle = grad;
                        ctx.fill();
                        ctx.restore();
                    }
                });

                // 畫物理垃圾
                trashBodies.forEach(body => {
                    ctx.save();
                    ctx.translate(body.position.x, body.position.y);
                    ctx.rotate(body.angle);
                    
                    if (body.label === 'trash_plate') {
                        ctx.beginPath();
                        ctx.arc(0, 0, 60, 0, Math.PI * 2);
                        ctx.fillStyle = '#ecf0f1';
                        ctx.fill();
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = '#bdc3c7';
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(0, 0, 40, 0, Math.PI * 2);
                        ctx.stroke();
                    } else if (body.label === 'trash_utensil') {
                        ctx.fillStyle = '#95a5a6';
                        ctx.fillRect(-10, -50, 20, 100);
                        ctx.strokeStyle = '#7f8c8d';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(-10, -50, 20, 100);
                    } else if (body.label === 'trash_cup') {
                        ctx.fillStyle = '#e74c3c';
                        ctx.fillRect(-20, -35, 40, 70);
                        ctx.strokeStyle = '#c0392b';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(-20, -35, 40, 70);
                        ctx.fillStyle = 'white';
                        ctx.fillRect(-15, -10, 30, 20);
                    } else {
                        ctx.beginPath();
                        for(let i=0; i<8; i++){
                            let a = i * Math.PI / 4;
                            let r = 20 + Math.random() * 10;
                            if(i===0) ctx.moveTo(r*Math.cos(a), r*Math.sin(a));
                            else ctx.lineTo(r*Math.cos(a), r*Math.sin(a));
                        }
                        ctx.closePath();
                        ctx.fillStyle = '#ecf0f1';
                        ctx.fill();
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#bdc3c7';
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                // 狀態文字提示
                if (cleaningSubState === 'INIT') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('開始整理桌子！', GAME_WIDTH/2, GAME_HEIGHT/2);
                    ctx.textAlign = 'left';
                } else if (cleaningSubState === 'TRANSITION') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                    ctx.fillStyle = '#f1c40f';
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('垃圾清理完畢，開始擦桌子！', GAME_WIDTH/2, GAME_HEIGHT/2);
                    ctx.textAlign = 'left';
                } else if (cleaningSubState === 'WIPE_TABLE' && remainingStainsCount === 0) {
                    ctx.fillStyle = '#2ecc71';
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'black';
                    ctx.fillText('✨ 完成清潔 ✨', GAME_WIDTH/2, GAME_HEIGHT/2);
                    ctx.textAlign = 'left';
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    if (cleaningSubState === 'CLEAR_TRASH') {
                        ctx.fillText('將垃圾與餐具撥出桌子邊緣', GAME_WIDTH/2, GAME_HEIGHT - 20);
                    } else if (cleaningSubState === 'WIPE_TABLE') {
                        ctx.fillText('用雙手海綿擦拭桌面污漬', GAME_WIDTH/2, GAME_HEIGHT - 20);
                    }
                    ctx.textAlign = 'left';
                }
            }

            if (microLocation === 'KITCHEN') {
                // 畫盤子底座
                ctx.fillStyle = '#ecf0f1';
                ctx.beginPath();
                ctx.arc(washingPlate.x + washingPlate.w/2, washingPlate.y + washingPlate.h/2, 100, 0, Math.PI*2);
                ctx.fill();
                ctx.lineWidth = 8;
                ctx.strokeStyle = '#bdc3c7';
                ctx.stroke();

                if (washingPlate.dirtAmount > 0) {
                    ctx.fillStyle = `rgba(120, 100, 60, ${washingPlate.dirtAmount / 100})`;
                    ctx.beginPath();
                    ctx.arc(washingPlate.x + washingPlate.w/2, washingPlate.y + washingPlate.h/2, 85, 0, Math.PI*2);
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 22px Arial';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'black';
                    ctx.fillText('在盤子上快速來回搓洗！', washingPlate.x + 100, washingPlate.y - 20);
                    ctx.textAlign = 'left';
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#2ecc71';
                    ctx.font = 'bold 32px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('✨ 閃閃發亮 ✨', washingPlate.x + 100, washingPlate.y + 110);
                    ctx.textAlign = 'left';
                }
            }

            // 繪製第一人稱手部
            if (handResult && handResult.landmarks) {
                const isWipeMode = (microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE');
                handResult.handednesses.forEach((h, idx) => {
                    const isRight = h[0].categoryName === 'Left'; // 鏡像反轉
                    drawFirstPersonHand(handResult.landmarks[idx], isRight, isWipeMode);
                });
            }
        }

        // --- 繪製空間導航箭頭 (Phase 2: 手部滯留觸發) ---
        function drawNavigationArrows() {
            const arrowDefs = [
                {
                    key: 'COUNTER', show: microLocation !== 'COUNTER',
                    cx: 55, cy: GAME_HEIGHT / 2, label: '櫃檯',
                    labelX: 30, labelY: GAME_HEIGHT / 2 + 70,
                    draw: () => { ctx.moveTo(30, GAME_HEIGHT/2); ctx.lineTo(80, GAME_HEIGHT/2-40); ctx.lineTo(80, GAME_HEIGHT/2+40); }
                },
                {
                    key: 'KITCHEN', show: microLocation !== 'KITCHEN',
                    cx: GAME_WIDTH / 2, cy: 55, label: '廚房',
                    labelX: GAME_WIDTH / 2 - 20, labelY: 110,
                    draw: () => { ctx.moveTo(GAME_WIDTH/2, 30); ctx.lineTo(GAME_WIDTH/2-40, 80); ctx.lineTo(GAME_WIDTH/2+40, 80); }
                },
                {
                    key: 'DINING_ROOM', show: microLocation !== 'DINING_ROOM',
                    cx: GAME_WIDTH - 55, cy: GAME_HEIGHT / 2, label: '用餐區',
                    labelX: GAME_WIDTH - 80, labelY: GAME_HEIGHT / 2 + 70,
                    draw: () => { ctx.moveTo(GAME_WIDTH-30, GAME_HEIGHT/2); ctx.lineTo(GAME_WIDTH-80, GAME_HEIGHT/2-40); ctx.lineTo(GAME_WIDTH-80, GAME_HEIGHT/2+40); }
                }
            ];

            for (const arrow of arrowDefs) {
                if (!arrow.show) continue;
                ctx.save();

                const isHovering = hoverTarget === arrow.key;
                const pulse = isHovering ? 0.5 + Math.sin(Date.now() / 200) * 0.2 : 0.2;

                // 箭頭本體
                ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1, pulse + 0.3)})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                arrow.draw();
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 標籤
                ctx.fillStyle = isHovering ? '#f1c40f' : 'white';
                ctx.font = isHovering ? 'bold 22px Arial' : '20px Arial';
                ctx.fillText(arrow.label, arrow.labelX, arrow.labelY);

                // 滯留進度環
                if (isHovering && dwellProgress > 0) {
                    const r = 48;
                    // 底環
                    ctx.beginPath();
                    ctx.arc(arrow.cx, arrow.cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                    ctx.lineWidth = 7;
                    ctx.stroke();
                    // 進度弧
                    ctx.beginPath();
                    ctx.arc(arrow.cx, arrow.cy, r, -Math.PI / 2, -Math.PI / 2 + dwellProgress * Math.PI * 2);
                    const ringColor = dwellProgress > 0.7 ? '#2ecc71' : '#f1c40f';
                    ctx.strokeStyle = ringColor;
                    ctx.lineWidth = 7;
                    ctx.lineCap = 'round';
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = ringColor;
                    ctx.stroke();
                    // 百分比
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${Math.round(dwellProgress * 100)}%`, arrow.cx, arrow.cy + 6);
                    ctx.textAlign = 'left';
                }

                ctx.restore();
            }
        }

        function updateScore(delta) {
            score += delta;
            scoreDisplay.innerText = score;
            if(delta > 0) {
                scoreDisplay.style.color = '#2ecc71';
            } else {
                scoreDisplay.style.color = '#e74c3c';
            }
            setTimeout(() => scoreDisplay.style.color = 'white', 500);
        }

        initMediaPipe();
    </script>
</body>
