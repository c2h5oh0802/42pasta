<body>

    <div id="game-container">

                <button class="btn" id="btn-restart-level" onclick="restartCurrentLevel()"

    <!-- ?日?函???撥?嗅?????-->
    <div id="controls">
        <button onclick="setMicroLocation('COUNTER')">切換: 櫃台 (COUNTER)</button>
        <button onclick="setMicroLocation('DINING_ROOM')">切換: 用餐區 (DINING_ROOM)</button>
        <button onclick="setMicroLocation('KITCHEN')">切換: 廚房 (KITCHEN)</button>

    <script type="module">
        window.addEventListener('error', function (e) {
            alert('Error: ' + e.message + ' at ' + e.lineno);
        });

        import {
            FaceLandmarker,
            HandLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- ??嗆??????---
        let macroState = 'LOADING'; // LOADING, TITLE, LEVEL_SELECT, GAMEPLAY, LEVEL_RESULT
        let microLocation = 'COUNTER'; // COUNTER, KITCHEN, DINING_ROOM

        // ?閮剖?
        const LEVELS = [
            { id: 1, targetMoney: 50, time: 120, tables: 2 },
            { id: 2, targetMoney: 150, time: 240, tables: 3 }
        ];
        let currentLevelIndex = 0;
        let gameTimer = 0;
        let gameTimerInterval = null;

        // 摮?蝟餌絞 (閮?瘥????擃??嚗?隞?”?芾圾???芷???
        let saveMemory = {
            stars: [0, 0] // 撠? LEVEL 1, 2
        };

        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 540;
        let score = 0; // ?寧?
        let isSmiling = false;
        let customers = [];
        let droppedMoney = [];
        let customerSpawnTimer = 0;
        let nextCustomerImageIndex = 0;
        let negativeReviews = 0; // 鞎??賊?

        // 撱??蝟餌絞
        let activeOrder = null;
        let cookState = 'IDLE'; // IDLE, PUT_PASTA, BOILING, PLATE_PASTA, ADD_CEMENT, ADD_CILANTRO, STIRRING, SERVE
        let dragItems = { left: null, right: null }; // ?舀????銝??拙?
        let handOpenUntil = { left: 0, right: 0 };
        let cookProgress = 0;
        let stirProgress = 0;
        const STIR_THRESHOLD = 1200; // ?芣??曉?

        let washingPlate = { x: 330, y: 120, w: 300, h: 300, dirtAmount: 100 }; // ?游之??蝭? (? 200)
        let lastHandPositions = { left: null, right: null }; // ??閮???雿蔭
        let scrubAccumulator = 0;
        const SCRUB_THRESHOLD = 1000; // ?漲???瑼鳴?頞末瘣?
        let cleanPlates = 2; // ???文??賊?
        const MAX_PLATES = 2; // ?憭抒摮??(蝚砌???
        let dirtyPlates = 0; // ???擃??渡??敺????箇?冽??
        let stains = [];
        let trashBodies = [];
        let plateHasNoodles = false;
        let plateHasCement = false;
        let plateHasCilantro = false;
        let potNoodleState = 'EMPTY'; // 'EMPTY', 'RAW', 'BOILING', 'READY'
        let potCookProgress = 0;
        let tipText = "";
        let tipTimer = 0;

        // 憌脫?蝟餌絞 (蝚砌???
        let drinkState = 'IDLE'; // IDLE, SHAKING, READY
        let shakeProgress = 0;
        const SHAKE_THRESHOLD = 800; // ??蝮賭?蝘駁??

        const TABLE_POSITIONS = [
            { x: 160, y: 315, w: 250, h: 130, customerX: 300, customerY: 315 },
            { x: 480, y: 315, w: 230, h: 130, customerX: 365, customerY: 315 },
            { x: 790, y: 315, w: 240, h: 130, customerX: 670, customerY: 315 },
            { x: 480, y: 315, w: 230, h: 130, customerX: 590, customerY: 315 }
        ];
        let tableStates = ['FREE', 'FREE', 'FREE', 'FREE']; 
        let tableCleanProgress = [0, 0, 0, 0]; 
        let tableHasDrink = [false, false, false, false]; 
        let currentCleaningTable = -1; 

        // 撠???菜葫 (Dwell Navigation)
        let hoverTarget = null;
        let hoverStartTime = 0;
        const HOVER_DWELL_TIME = 800; // 蝮桃??0.8 蝘孛?潘???蝘餃?瘚??
        function getDynamicNavZones() {
            const zones = {
                KITCHEN: { x: 0, y: 190, w: 100, h: 160 },
                COUNTER: { x: 420, y: 0, w: 120, h: 130 },
                DINING_ROOM: { x: 860, y: 190, w: 100, h: 160 },
                SINK: { x: 420, y: 440, w: 120, h: 100 }
            };

            // ?寞??桀?雿蔭隤踵???
            if (microLocation === 'KITCHEN') {
                zones.COUNTER = { x: 860, y: 190, w: 100, h: 160 }; // 撱??瑼臬??
            } else if (microLocation === 'DINING_ROOM') {
                // ?券????瑼荔?撌血
                zones.COUNTER = { x: 0, y: 190, w: 100, h: 160 };
                // 擃?摮???嚗???摮擃?嚗????脣?孵神????
                tableStates.forEach((state, idx) => {
                    if (state === 'DIRTY' && idx < LEVELS[currentLevelIndex].tables) {
                        const pos = TABLE_POSITIONS[idx];
                        zones[`CLEAN_TABLE_${idx}`] = {
                            x: pos.x - pos.w / 2,
                            y: pos.y - pos.h / 2,
                            w: pos.w,
                            h: pos.h
                        };
                    }
                });
            } else if (microLocation === 'SINK') {
                // 瘣??啣?撱嚗椰??(?郊閬死蝘餃?)
                zones.KITCHEN = { x: 0, y: 190, w: 100, h: 160 };
            } else if (microLocation === 'TABLE_CLEANING') {
                // 敺撖怎?Ｗ??券??
                zones.DINING_ROOM = { x: 0, y: 0, w: 100, h: 100 }; // 撌虫?閫???
            }
            return zones;
        }
        let dwellProgress = 0;
        let dwellCooldown = 0;
        const DWELL_COOLDOWN_TIME = 1000;
        let activeHandPositions = [];
        let uiHoverTarget = null;
        let uiHoverStartTime = 0;
        let uiDwellProgress = 0;
        let uiDwellCooldown = 0;
        const UI_DWELL_TIME = 1200;
        const UI_COOLDOWN_TIME = 800;
        let registeredUiElements = [];

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');
        const stateDisplay = document.getElementById('location-display');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const targetDisplay = document.getElementById('target-display');
        const statusHud = document.getElementById('status-hud');
        const reviewDisplay = document.getElementById('review-display');
        const plateDisplay = document.getElementById('plate-display');
        const plateCountEl = document.getElementById('plate-count');
        const orderContainer = document.getElementById('order-container');

        // UI ?恍??
        const titleScreen = document.getElementById('title-screen');
        const titleDoorImage = document.getElementById('title-door-image');
        const titleCloseTarget = document.getElementById('title-close-target');
        const titleHint = document.getElementById('title-hint');
        const levelSelectScreen = document.getElementById('level-select-screen');
        const resultScreen = document.getElementById('result-screen');
        const levelGrid = document.getElementById('level-grid-container');
        let isTitleDoorOpening = false;
        let titleDoorTimer = null;

        // ???鞈?
        const counterBgImg = new Image();

        function drawCustomerImage(customer, x, y, width, height, fallbackColor = '#3498db') {
            const img = customerImages[customer.customerImageIndex % customerImages.length];
            if (img && img.complete && img.naturalWidth > 0) {
                const scale = Math.min(width / img.naturalWidth, height / img.naturalHeight);
                const drawWidth = img.naturalWidth * scale;
                const drawHeight = img.naturalHeight * scale;
                ctx.drawImage(img, x - drawWidth / 2, y - drawHeight / 2, drawWidth, drawHeight);
                return;
            }

            ctx.fillStyle = fallbackColor;
            ctx.beginPath();
            ctx.arc(x, y - height * 0.25, width * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x - width * 0.22, y, width * 0.44, height * 0.42);
        }

        function drawCoverImage(img, x, y, width, height) {
            const scale = Math.max(width / img.naturalWidth, height / img.naturalHeight);
            const drawWidth = img.naturalWidth * scale;

            ctx.drawImage(img, x + (width - drawWidth) / 2, y + (height - drawHeight) / 2, drawWidth, drawHeight);
        }

        function drawSpriteInBox(img, x, y, width, height, scale = 1) {
            if (!img || !img.complete || img.naturalWidth <= 0) return false;
            const fitScale = Math.min(width / img.naturalWidth, height / img.naturalHeight) * scale;
            const drawWidth = img.naturalWidth * fitScale;
            const drawHeight = img.naturalHeight * fitScale;
            ctx.drawImage(img, x + (width - drawWidth) / 2, y + (height - drawHeight) / 2, drawWidth, drawHeight);
            return true;
        }

        function drawSpriteCentered(img, width, height, scale = 1) {
            if (!img || !img.complete || img.naturalWidth <= 0) return false;
            const fitScale = Math.min(width / img.naturalWidth, height / img.naturalHeight) * scale;
            const drawWidth = img.naturalWidth * fitScale;
            const drawHeight = img.naturalHeight * fitScale;
            ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            return true;
        }

        function distance2D(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);

        function isFistGesture(landmarks) {
            const palmCenter = landmarks[9];
            const fingers = [
                { tip: 8, pip: 6 },
                { tip: 12, pip: 10 },
                { tip: 16, pip: 14 },
                { tip: 20, pip: 18 }
            ];
            const curledCount = fingers.reduce((count, finger) => {
                const tipDistance = distance2D(landmarks[finger.tip], palmCenter);
                const pipDistance = distance2D(landmarks[finger.pip], palmCenter);
                return count + (tipDistance < pipDistance * 1.15 ? 1 : 0);
            }, 0);

            return curledCount >= 3;
        }

        // --- Phase 2: ?皛舐?撠 (Dwell Navigation) ---
        function checkDwellNavigation() {
            if (macroState !== 'GAMEPLAY') return;
            if (Date.now() < dwellCooldown) {
                hoverTarget = null;
                dwellProgress = 0;
                return;
            }

            let currentZone = null;
            let targetKey = null;

            let allowedTargets = [];
            if (microLocation === 'COUNTER') allowedTargets = ['KITCHEN', 'DINING_ROOM'];
            else if (microLocation === 'KITCHEN') allowedTargets = ['COUNTER', 'SINK'];
            else if (microLocation === 'DINING_ROOM') allowedTargets = ['COUNTER'];
            else if (microLocation === 'SINK') allowedTargets = ['KITCHEN'];
            else if (microLocation === 'TABLE_CLEANING') allowedTargets = ['DINING_ROOM'];

            const zones = getDynamicNavZones();
            for (const key in zones) {
                // ??芾?典?閮梁?蝭?蝘餃?
                if (allowedTargets.includes(key) || key.startsWith('CLEAN_TABLE_')) {
                    const zone = zones[key];
                    for (const pos of activeHandPositions) {
                        if (pos.x >= zone.x && pos.x <= zone.x + zone.w &&
                            pos.y >= zone.y && pos.y <= zone.y + zone.h) {
                            currentZone = key;
                            break;
                        }
                    }
                }
                if (currentZone) { targetKey = currentZone; break; }
            }

            if (currentZone) {
                if (hoverTarget === currentZone) {
                    const elapsed = Date.now() - hoverStartTime;
                    dwellProgress = Math.min(1, elapsed / HOVER_DWELL_TIME);
                    if (dwellProgress >= 1) {
                        if (targetKey.startsWith('CLEAN_TABLE_')) {
                            const idx = parseInt(targetKey.replace('CLEAN_TABLE_', ''));
                            setMicroLocation('TABLE_CLEANING', idx);
                        } else {
                            setMicroLocation(targetKey);
                        }
                        hoverTarget = null;
                        dwellProgress = 0;
                        dwellCooldown = Date.now() + DWELL_COOLDOWN_TIME;
                    }
                } else {
                    hoverTarget = currentZone;
                    hoverStartTime = Date.now();
                    dwellProgress = 0;
                }
            } else {
                hoverTarget = null;
                dwellProgress = 0;
            }
        }

        // --- 銝駁????詨/蝯??恍嚗??Ｘ趙??雿?---
        function checkUiDwellActions() {
            if (macroState === 'GAMEPLAY' || macroState === 'LOADING') return;
            if (Date.now() < uiDwellCooldown) {
                if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                uiHoverTarget = null;
                uiDwellProgress = 0;
                return;
            }

            let currentTarget = null;
            let currentAction = null;

            for (const item of registeredUiElements) {
                const rect = item.el.getBoundingClientRect();
                const canvasRect = canvas.getBoundingClientRect();

                // 閮?蝮格瘥?
                const scaleX = GAME_WIDTH / canvas.offsetWidth;
                const scaleY = GAME_HEIGHT / canvas.offsetHeight;

                // 撠?CSS 摨扳?頧??粹??脣?典漣璅?(960x540)
                const zone = {
                    x: (rect.left - canvasRect.left) * scaleX,
                    y: (rect.top - canvasRect.top) * scaleY,
                    w: rect.width * scaleX,
                    h: rect.height * scaleY
                };
                for (const pos of activeHandPositions) {
                    if (pos.x >= zone.x && pos.x <= zone.x + zone.w &&
                        pos.y >= zone.y && pos.y <= zone.y + zone.h) {
                        currentTarget = item.el;
                        currentAction = item.action;
                        break;
                    }
                }
                if (currentTarget) break;
            }

            if (currentTarget) {
                if (uiHoverTarget === currentTarget) {
                    const elapsed = Date.now() - uiHoverStartTime;
                    uiDwellProgress = Math.min(1, elapsed / UI_DWELL_TIME);
                    if (uiDwellProgress >= 1) {
                        try {
                            currentAction();
                        } catch (e) {
                            console.error("Action Error: ", e);
                        }
                        if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                        uiHoverTarget = null;
                        uiDwellProgress = 0;
                        uiDwellCooldown = Date.now() + UI_COOLDOWN_TIME;

                    }
                } else {
                    if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                    uiHoverTarget = currentTarget;
                    uiHoverStartTime = Date.now();
                    uiDwellProgress = 0;
                }

                if (uiHoverTarget) {
                    uiHoverTarget.classList.add('hand-hover');
                }
            } else {
                if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                uiHoverTarget = null;
                uiDwellProgress = 0;
            }
        }

        function handleFaceLogic() {
            if (microLocation !== 'COUNTER') return; // 銝瑹狗銝摰凝蝚?

            isSmiling = false;
            if (faceResult && faceResult.faceBlendshapes.length > 0) {
                const blendshapes = faceResult.faceBlendshapes[0].categories;
                const smileLeft = blendshapes.find(c => c.categoryName === 'mouthSmileLeft')?.score || 0;
                const smileRight = blendshapes.find(c => c.categoryName === 'mouthSmileRight')?.score || 0;
                if (smileLeft > 0.2 || smileRight > 0.2) isSmiling = true;
            }

            if (customers.length > 0) {
                // 1. 敺桃??亙?摩
                const orderingCustomer = customers.find(c => c.state === 'ORDERING');
                if (orderingCustomer) {

                    if (freeTableIndex === -1) {
                        // 瘝征獢?嚗凝蝚?蝯虫??內
                        if (isSmiling) showTip('沒有空桌，請先去用餐區整理桌面');
                        orderingCustomer.serveDwell = 0;

                        if (isSmiling) {
                            orderingCustomer.serveDwell += 0.03;

                                orderingCustomer.state = 'WAITING_FOOD';
                                orderingCustomer.tableIndex = freeTableIndex;

                                orderingCustomer.serveDwell = 0;
                                orderingCustomer.patience = Math.min(100, orderingCustomer.patience + 25);

        function handleCookingLogic() {
            if (!activeOrder || activeHandPositions.length === 0) return;

            // ?風??皜砍???其?蝵?
            activeHandPositions.forEach(pos => {
                const px = pos.x;
                const py = pos.y;
                const handSide = pos.isRight ? 'right' : 'left';
                const isFist = pos.isFist;

                const {
                    rawPastaArea,
                    potArea,
                    plateArea,
                    cilantroArea,
                    cementArea,
                    serveArea,
                    shakerArea
                } = getKitchenLayout();

                // --- 憌脫??摩 ---
                if (LEVELS[currentLevelIndex].id === 2) {
                    const drinkTarget = getActiveDrinkTarget();
                    const otherHandSide = handSide === 'right' ? 'left' : 'right';

                    if (dragItems[handSide] === 'SHAKER' && !drinkTarget) {
                        dragItems[handSide] = null;
                        drinkState = 'IDLE';
                        shakeProgress = 0;
                    }

                    if (drinkTarget && !dragItems[handSide] && dragItems[otherHandSide] !== 'SHAKER' && px > shakerArea.x && px < shakerArea.x + shakerArea.w && py > shakerArea.y && py < shakerArea.y + shakerArea.h) {
                        if (drinkState === 'IDLE' || drinkState === 'READY') {
                            dragItems[handSide] = 'SHAKER';
                            if (drinkState === 'READY') drinkState = 'READY'; // 靽?
                            else drinkState = 'SHAKING';
                        }
                    }

                    if (dragItems[handSide] === 'SHAKER' && drinkTarget) {
                        if (drinkState === 'SHAKING') {
                            const lastPos = lastHandPositions[handSide];
                            if (lastPos) {
                                const dist = Math.hypot(px - lastPos.x, py - lastPos.y);
                                if (dist > 5) shakeProgress += dist;
                                if (shakeProgress >= SHAKE_THRESHOLD) {
                                    drinkState = 'READY';
                                }
                            }
                        }
                        
                        if (drinkState === 'READY' && px > serveArea.x && px < serveArea.x + serveArea.w && py > serveArea.y && py < serveArea.y + serveArea.h) {
                            if (drinkTarget) {
                                drinkTarget.hasDrink = true;
                                dragItems[handSide] = null;
                                drinkState = 'IDLE';
                                shakeProgress = 0;
                                updateScore(10);
                                showTip('飲料完成，請送給客人');
                                checkCustomerDone(drinkTarget);

                                activeOrder = findNextKitchenOrder();
                                cookState = activeOrder && !activeOrder.hasPasta ? 'PUT_PASTA' : 'IDLE';
                            }
                        }
                    }
                }

                // ???
                if (cookState === 'PUT_PASTA' || cookState === 'ASSEMBLY') {
                    // --- ???摩 ---
                    if (potNoodleState === 'EMPTY') {
                        // 憓????扳炎?伐?憒??虫??餅?撌脩??蹂??熊嚗?甇斗?銝? (?脫迫?澈 BUG)
                        const otherHandSide = handSide === 'right' ? 'left' : 'right';
                        if (isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'RAW_PASTA' && px > rawPastaArea.x && px < rawPastaArea.x + rawPastaArea.w && py > rawPastaArea.y && py < rawPastaArea.y + rawPastaArea.h) {
                            dragItems[handSide] = 'RAW_PASTA';
                        }
                        if (dragItems[handSide] === 'RAW_PASTA' && px > potArea.x && px < potArea.x + potArea.w && py > potArea.y && py < potArea.y + potArea.h) {
                            dragItems[handSide] = null;
                            handOpenUntil[handSide] = Date.now() + 450;
                            potNoodleState = 'BOILING';
                            potCookProgress = 0;
                        }
                    } else if (potNoodleState === 'BOILING') {
                        potCookProgress += 0.5;
                        if (potCookProgress >= 100) {
                            potNoodleState = 'READY';
                        }
                    } else if (potNoodleState === 'READY') {
                        const otherHandSide = handSide === 'right' ? 'left' : 'right';
                        if (isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'COOKED_PASTA' && !plateHasNoodles && px > potArea.x && px < potArea.x + potArea.w && py > potArea.y && py < potArea.y + potArea.h) {
                            dragItems[handSide] = 'COOKED_PASTA';
                            potNoodleState = 'EMPTY';
                        }
                    }

                    // --- ?文????摩 ---
                    const otherHandSide = handSide === 'right' ? 'left' : 'right';
                    if (isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'CEMENT' && activeOrder.orderType.includes('CEMENT') && !plateHasCement && px > cementArea.x && px < cementArea.x + cementArea.w && py > cementArea.y && py < cementArea.y + cementArea.h) {
                        dragItems[handSide] = 'CEMENT';
                    }
                    if (isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'CILANTRO' && activeOrder.orderType.includes('CILANTRO') && !plateHasCilantro && px > cilantroArea.x && px < cilantroArea.x + cilantroArea.w && py > cilantroArea.y && py < cilantroArea.y + cilantroArea.h) {
                        dragItems[handSide] = 'CILANTRO';
                    }

                    if (dragItems[handSide] && (dragItems[handSide] === 'COOKED_PASTA' || dragItems[handSide] === 'CEMENT' || dragItems[handSide] === 'CILANTRO') && px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        if (cleanPlates > 0 || plateHasNoodles || plateHasCement || plateHasCilantro) {
                            if (dragItems[handSide] === 'COOKED_PASTA') plateHasNoodles = true;
                            if (dragItems[handSide] === 'CEMENT') plateHasCement = true;
                            if (dragItems[handSide] === 'CILANTRO') plateHasCilantro = true;
                            dragItems[handSide] = null;
                            handOpenUntil[handSide] = Date.now() + 450;
                        } else {
                            showTip(`沒有乾淨盤子，請${getPlateShortageHint()}`);
                        }
                    }

                    const needsCement = activeOrder.orderType.includes('CEMENT');
                    const needsCilantro = activeOrder.orderType.includes('CILANTRO');
                    if (plateHasNoodles && (plateHasCement || !needsCement) && (plateHasCilantro || !needsCilantro)) {
                        cookState = 'STIRRING';
                        stirProgress = 0;
                        lastHandPositions[handSide] = null;
                    }
                } else if (cookState === 'STIRRING') {
                    if (px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        const lastPos = lastHandPositions[handSide];
                        if (lastPos) {
                            const dist = Math.hypot(px - lastPos.x, py - lastPos.y);
                            stirProgress += dist;
                            if (stirProgress > STIR_THRESHOLD) {
                                cookState = 'SERVE';
                                dragItems[handSide] = null;
                            }
                        }
                        lastHandPositions[handSide] = { x: px, y: py };
                    } else {
                        lastHandPositions[handSide] = null;
                    }
                } else if (cookState === 'SERVE') {
                    const otherHandSide = handSide === 'right' ? 'left' : 'right';
                    if (isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'FINISHED_PLATE' && px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        dragItems[handSide] = 'FINISHED_PLATE';
                    }
                    if (dragItems[handSide] === 'FINISHED_PLATE' && px > serveArea.x && px < serveArea.x + serveArea.w && py > serveArea.y && py < serveArea.y + serveArea.h) {
                        if (cleanPlates > 0) {
                            cleanPlates--; 
                            plateCountEl.innerText = cleanPlates;

                            let target = customers.find(c => c.state === 'WAITING_FOOD' && c.orderType === activeOrder.orderType && !c.hasPasta);

                            if (target) {
                                target.hasPasta = true;
                                updateScore(25);
                                showTip('餐點完成，請送到出餐口');
                                checkCustomerDone(target);
                            } else {
                                showTip('目前沒有對應的客人需求');
                            }

                            dragItems[handSide] = null;
                            cookState = 'IDLE';
                            plateHasNoodles = plateHasCement = plateHasCilantro = false;

                            activeOrder = findNextKitchenOrder();
                            cookState = activeOrder && !activeOrder.hasPasta ? 'PUT_PASTA' : 'IDLE';
                        } else {
                            showTip(`沒有乾淨盤子，請${getPlateShortageHint()}`);
                        }
                    }
                }
            });
        }

        function checkScrubbing(px, py, handType) {
            if (dirtyPlates <= 0 || cleanPlates >= MAX_PLATES) return;

            // 雿輻頛祝擛??文?蝭?嚗??拙振摰寞???
            const margin = 50;
            if (px > washingPlate.x - margin && px < washingPlate.x + washingPlate.w + margin &&
                py > washingPlate.y - margin && py < washingPlate.y + washingPlate.h + margin) {

                const lastPos = lastHandPositions[handType];
                if (lastPos) {
                    const dist = Math.hypot(px - lastPos.x, py - lastPos.y);
                    // ?芣?????蝘餅?閮? (??頝唾????炊?歹?靘? > 200px)
                    if (dist < 200) {
                        scrubAccumulator += dist;
                        washingPlate.dirtAmount = 100 - (scrubAccumulator / SCRUB_THRESHOLD) * 100;
                    }

                    if (washingPlate.dirtAmount <= 0) {
                        washingPlate.dirtAmount = 0;
                        dirtyPlates = Math.max(0, dirtyPlates - 1);
                        cleanPlates = Math.min(MAX_PLATES, cleanPlates + 1);
                        plateCountEl.innerText = cleanPlates;
                        // 蝘駁瘣???

                        scrubAccumulator = 0;
                        if (cleanPlates < MAX_PLATES && dirtyPlates > 0) {
                            washingPlate.dirtAmount = 100;
                        }
                    }
                }
                lastHandPositions[handType] = { x: px, y: py };
            } else {
                lastHandPositions[handType] = null;
            }
        }

        function drawFirstPersonHand(landmarks, isRight, isWipeMode) {
            ctx.save();
            const wrist = landmarks[0];
            const middleMCP = landmarks[9];
            const indexMCP = landmarks[5];
            const pinkyMCP = landmarks[17];
            const pxW = (1 - wrist.x) * GAME_WIDTH;
            const pyW = wrist.y * GAME_HEIGHT;
            const pxM = (1 - middleMCP.x) * GAME_WIDTH;
            const pyM = middleMCP.y * GAME_HEIGHT;
            const pxIndex = (1 - indexMCP.x) * GAME_WIDTH;
            const pyIndex = indexMCP.y * GAME_HEIGHT;
            const pxPinky = (1 - pinkyMCP.x) * GAME_WIDTH;
            const pyPinky = pinkyMCP.y * GAME_HEIGHT;
            const handSide = isRight ? 'right' : 'left';
            const heldItem = dragItems[handSide];
            const gripHeldItems = ['RAW_PASTA', 'COOKED_PASTA', 'CEMENT', 'CILANTRO'];
            const forceOpen = Date.now() < handOpenUntil[handSide];
            const isFist = !forceOpen && (isFistGesture(landmarks) || gripHeldItems.includes(heldItem));
            const handImg = isFist ? fistHandImg : openHandImg;
            const handDirection = Math.atan2(pyM - pyW, pxM - pxW);
            const rotation = handDirection + Math.PI / 2;
            const palmSpan = Math.hypot(pxIndex - pxPinky, pyIndex - pyPinky);
            const palmLength = Math.hypot(pxM - pxW, pyM - pyW);
            const handHeight = Math.max(120, Math.min(255, Math.max(palmSpan * 2.7, palmLength * 4.0)));
            const handWidth = handImg.naturalWidth > 0 ? handHeight * (handImg.naturalWidth / handImg.naturalHeight) : handHeight * 0.9;

            if (!isWipeMode && heldItem) {
                ctx.save();
                ctx.translate(pxM, pyM);
                if (heldItem === 'RAW_PASTA') {
                    drawSpriteCentered(itemImages.rawPasta, 100, 155, 1);
                } else if (heldItem === 'COOKED_PASTA') {
                    drawSpriteCentered(itemImages.cookedPasta, 128, 104, 1);
                } else if (heldItem === 'CILANTRO') {
                    drawSpriteCentered(itemImages.cilantroHandful, 118, 96, 1);
                } else if (heldItem === 'CEMENT') {
                    drawSpriteCentered(itemImages.cementCan, 192, 264, 1);
                } else if (heldItem === 'FINISHED_PLATE') {
                    drawSpriteCentered(getFinishedPlateImage(), 175, 138, 1);
                } else if (heldItem === 'SHAKER') {
                    drawSpriteCentered(itemImages.shaker, 100, 145, 1);
                    if (drinkState === 'SHAKING') {
                        ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial';
                        ctx.fillText('SHAKE!', -25, -40);
                    }
                }
                ctx.restore();
            }

            if (handImg.complete && handImg.naturalWidth > 0) {
                ctx.save();
                ctx.translate(pxM, pyM);
                ctx.rotate(rotation);
                if ((isFist && !isRight) || (!isFist && isRight)) ctx.scale(-1, 1);
                ctx.shadowBlur = isWipeMode ? 16 : 10;
                ctx.shadowColor = isWipeMode ? 'rgba(243, 156, 18, 0.9)' : 'rgba(255, 255, 255, 0.45)';
                ctx.drawImage(handImg, -handWidth / 2, -handHeight * 0.42, handWidth, handHeight);
                ctx.restore();
            } else {
                ctx.fillStyle = isFist ? '#f39c12' : '#ffffff';
                ctx.beginPath();
                ctx.arc(pxM, pyM, 35, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- 蝜芾ˊ UI 皛舐??脣漲??---
            if (macroState !== 'GAMEPLAY' && uiDwellProgress > 0) {
                const r = 45;
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 6;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(pxM, pyM, r, -Math.PI / 2, -Math.PI / 2 + uiDwellProgress * Math.PI * 2);
                const ringColor = uiDwellProgress > 0.7 ? '#2ecc71' : '#f1c40f';
                ctx.strokeStyle = ringColor;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = ringColor;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

                        let cx = 480 + (i * 150);
                        ctx.globalAlpha = 0.55;
                        drawCustomerImage(c, cx, 340, 95, 145, '#7f8c8d');
                        ctx.globalAlpha = 1;
                    }
                }

                // ?急??賜???
                droppedMoney.forEach(m => {
                    ctx.save();
                    ctx.translate(m.body.position.x, m.body.position.y);
                    ctx.rotate(m.body.angle);
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 4; ctx.stroke();
                    ctx.fillStyle = '#d35400';
                    ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('$', 0, 7);
                    ctx.restore();
                });

                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('櫃台區：對客人微笑接單', 30, GAME_HEIGHT - 30);

                if (customers.length >= LEVELS[currentLevelIndex].tables) {
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = 'bold 32px Arial';
                    ctx.textAlign = 'right';
                    ctx.fillText('店內客滿', GAME_WIDTH - 30, GAME_HEIGHT - 30);
                    ctx.textAlign = 'left';
                }
            }

            if (microLocation === 'DINING_ROOM') {
                // 1. 蝜芾ˊ獢??摰?(?箸 tableStates)
                for (let i = 0; i < LEVELS[currentLevelIndex].tables; i++) {
                    const pos = TABLE_POSITIONS[i];
                    const state = tableStates[i];
                    
                    // 獢??箏漣
                    if (state === 'DIRTY') {
                        // 擃情閬死?脣?內
                        const zoneX = pos.x - pos.w / 2;
                        const zoneY = pos.y - pos.h / 2;
                        ctx.fillStyle = 'rgba(105, 65, 32, 0.28)';
                        ctx.fillRect(zoneX, zoneY, pos.w, pos.h);
                        ctx.strokeStyle = 'rgba(255, 238, 170, 0.86)';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(zoneX, zoneY, pos.w, pos.h);
                        ctx.fillStyle = 'rgba(80, 45, 22, 0.58)';
                        ctx.beginPath(); ctx.arc(pos.x - 28, pos.y - 16, 17, 0, Math.PI * 2); ctx.fill();
                        
                    } else if (state === 'OCCUPIED' || state === 'EATING') {
                        const c = customers.find(cust => cust.tableIndex === i);
                        if (c) {
                            let cx = pos.customerX; let cy = pos.customerY;
                            ctx.save();
                            drawCustomerImage(c, cx, cy, 90, 138, state === 'EATING' ? '#d35400' : '#e67e22');

                            ctx.fillStyle = 'white'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';

                            // ???
                            ctx.fillStyle = 'rgba(25, 18, 14, 0.8)';
                            ctx.fillRect(cx - 32, cy + 70, 64, 8);
                            if (state === 'OCCUPIED') {
                                ctx.fillStyle = c.patience > 50 ? '#2ecc71' : '#e74c3c';
                                ctx.fillRect(cx - 32, cy + 70, (c.patience / 100) * 64, 8);
                            } else {
                                ctx.fillStyle = '#3498db';
                                ctx.fillRect(cx - 32, cy + 70, (c.eatTimer / 300) * 64, 8);
                            }
                            ctx.restore();
                        }
                    }
                }
            }

            if (microLocation === 'TABLE_CLEANING') {
                // ?怎撖怠之獢?
                // ?獢撌脫?箏????ㄐ?芯????情瞍祈??舀?隞嗚?
                if (cleaningSubState === 'WIPE_TABLE') {
                    // 憿舐內擃情?孵神 (?＊蝷箏??芣????典?)
                    stains.forEach(stain => {
                        if (!stain.cleaned) {
                            ctx.fillStyle = 'rgba(101, 67, 33, 0.4)';
                            ctx.beginPath(); ctx.arc(stain.x, stain.y, stain.size, 0, Math.PI*2); ctx.fill();
                        }
                    });
                    
                    // 皜??脣漲璇?
                    const progress = tableCleanProgress[currentCleaningTable];
                    ctx.fillStyle = '#333'; ctx.fillRect(280, 100, 400, 20);
                    ctx.fillStyle = '#f1c40f'; ctx.fillRect(280, 100, (progress/100)*400, 20);
                    ctx.fillStyle = 'white'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('在桌面上快速來回擦拭', 480, 90);
                } else if (cleaningSubState === 'CLEAR_TRASH') {
                    ctx.fillStyle = 'white'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('請先把桌上的碗盤撥到旁邊', 480, 90);
                }

                // ?怠?拍?? (?孵神?恍)
                trashBodies.forEach(body => {
                    ctx.save();
                    ctx.translate(body.position.x, body.position.y); ctx.rotate(body.angle);
                    if (body.label === 'trash_plate') {
                        ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2);
                        ctx.fillStyle = '#ecf0f1'; ctx.fill();
                        ctx.lineWidth = 4; ctx.strokeStyle = '#bdc3c7'; ctx.stroke();
                    } else if (body.label === 'trash_utensil') {
                        // ?寡?蝑瑕?憿?箸楛?刻嚗?瘛箄獢???
                        ctx.fillStyle = '#5d4037'; ctx.fillRect(-10, -50, 20, 100);
                    } else if (body.label === 'trash_cup') {
                        ctx.fillStyle = '#e74c3c'; ctx.fillRect(-20, -35, 40, 70);
                    }
                    ctx.restore();
                });
                
                ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'left';
                ctx.fillText('左上角返回用餐區', 20, 40);
            }

            if (microLocation === 'KITCHEN') {
                drawCookingUI();
            } else if (microLocation === 'SINK') {
                if (washingPlate.dirtAmount > 0) {
                    // ?怎摮?摨?
                    drawSpriteInBox(itemImages.plate, washingPlate.x, washingPlate.y, washingPlate.w, washingPlate.h, 1.12);

                    ctx.fillStyle = `rgba(120, 100, 60, ${washingPlate.dirtAmount / 100})`;
                    ctx.beginPath();
                    ctx.arc(washingPlate.x + washingPlate.w / 2, washingPlate.y + washingPlate.h / 2, 85, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 22px Arial';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'black';
                    ctx.fillText('在盤子上快速來回搓洗', washingPlate.x + 150, washingPlate.y - 40);

                    // 憿舐內?脣漲?曉?瘥?
                    const progress = Math.floor(Math.min(100, (scrubAccumulator / SCRUB_THRESHOLD) * 100));
                    ctx.fillStyle = '#f1c40f';
                    ctx.font = 'bold 32px Arial';
                    ctx.fillText(`瘣??脣漲: ${progress}%`, washingPlate.x + 150, washingPlate.y - 10);

                    ctx.textAlign = 'left';
                    ctx.shadowBlur = 0;
                } else {
                    if (dirtyPlates <= 0 && cleanPlates < MAX_PLATES) {
                        ctx.fillStyle = '#f1c40f';
                        ctx.font = 'bold 30px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('先去用餐區整理髒桌', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 12);
                        ctx.font = 'bold 22px Arial';
                        ctx.fillText('整理後才會有盤子可以洗', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 28);
                        ctx.textAlign = 'left';
                    } else if (cleanPlates < MAX_PLATES) {
                        // ?思嗾瘛函??文?
                        drawSpriteInBox(itemImages.plate, washingPlate.x, washingPlate.y, washingPlate.w, washingPlate.h, 1.12);

                        ctx.fillStyle = '#2ecc71';
                        ctx.font = 'bold 32px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('盤子洗乾淨了', washingPlate.x + 150, washingPlate.y + 150);
                        ctx.textAlign = 'left';
                    } else {
                        ctx.fillStyle = '#f1c40f';
                        ctx.font = 'bold 32px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('盤子已經補滿', GAME_WIDTH / 2, GAME_HEIGHT / 2);
                        ctx.textAlign = 'left';
                    }
                }
            }
        }

        // --- 蝜芾ˊ蝛粹?撠蝞剝 (Phase 2: ?皛舐?閫貊) ---
        function drawNavigationArrows() {
            let allowedTargets = [];
            if (microLocation === 'COUNTER') allowedTargets = ['KITCHEN', 'DINING_ROOM'];
            else if (microLocation === 'KITCHEN') allowedTargets = ['COUNTER', 'SINK'];
            else if (microLocation === 'DINING_ROOM') allowedTargets = ['COUNTER'];
            else if (microLocation === 'SINK') allowedTargets = ['KITCHEN'];

            const arrowDefs = [
                {
                    key: 'KITCHEN', show: allowedTargets.includes('KITCHEN'),
                    cx: 55, cy: GAME_HEIGHT / 2, label: '廚房',
                    labelX: 30, labelY: GAME_HEIGHT / 2 + 70,
                    draw: () => { ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40); }
                },
                {
                    key: 'COUNTER', show: allowedTargets.includes('COUNTER'),
                    cx: GAME_WIDTH / 2, cy: 55, label: '櫃台',
                    labelX: GAME_WIDTH / 2 - 20, labelY: 110,
                    draw: () => {
                        if (microLocation === 'KITCHEN') {
                            // 撱??瑼舀?
                            ctx.moveTo(GAME_WIDTH - 30, GAME_HEIGHT / 2); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 - 40); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 + 40);
                        } else if (microLocation === 'DINING_ROOM') {
                            // ?券????瑼舀?椰
                            ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40);
                        } else {
                            // ??
                            ctx.moveTo(GAME_WIDTH / 2, 30); ctx.lineTo(GAME_WIDTH / 2 - 40, 80); ctx.lineTo(GAME_WIDTH / 2 + 40, 80);
                        }
                    }
                },
                {
                    key: 'DINING_ROOM', show: allowedTargets.includes('DINING_ROOM'),
                    cx: GAME_WIDTH - 55, cy: GAME_HEIGHT / 2, label: '用餐區',
                    labelX: GAME_WIDTH - 80, labelY: GAME_HEIGHT / 2 + 70,
                    draw: () => { ctx.moveTo(GAME_WIDTH - 30, GAME_HEIGHT / 2); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 - 40); ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT / 2 + 40); }
                },
                {
                    key: 'SINK', show: allowedTargets.includes('SINK'),
                    cx: GAME_WIDTH / 2, cy: GAME_HEIGHT - 45, label: '洗手台',
                    labelX: GAME_WIDTH / 2 - 30, labelY: GAME_HEIGHT - 85,
                    draw: () => { ctx.moveTo(GAME_WIDTH / 2, GAME_HEIGHT - 30); ctx.lineTo(GAME_WIDTH / 2 - 40, GAME_HEIGHT - 70); ctx.lineTo(GAME_WIDTH / 2 + 40, GAME_HEIGHT - 70); }
                }
            ];

            // ?寞???嚗耨甇?COUNTER ?其???蝵格??漣璅?蝢?
            const counterDef = arrowDefs.find(a => a.key === 'COUNTER');
            if (microLocation === 'KITCHEN') {
                counterDef.cx = GAME_WIDTH - 55; counterDef.cy = GAME_HEIGHT / 2;
                counterDef.labelX = GAME_WIDTH - 80; counterDef.labelY = GAME_HEIGHT / 2 + 70;
            } else if (microLocation === 'DINING_ROOM') {
                counterDef.cx = 55; counterDef.cy = GAME_HEIGHT / 2;
                counterDef.labelX = 30; counterDef.labelY = GAME_HEIGHT / 2 + 70;
            } else if (microLocation === 'SINK') {
                // 敺?????輻?蝞剝蝘餉撌血嚗?◤?閮??
                const kitchenDef = arrowDefs.find(a => a.key === 'KITCHEN');
                kitchenDef.cx = 55; kitchenDef.cy = GAME_HEIGHT / 2;
                kitchenDef.labelX = 30; kitchenDef.labelY = GAME_HEIGHT / 2 + 70;
                kitchenDef.draw = () => { ctx.moveTo(30, GAME_HEIGHT / 2); ctx.lineTo(80, GAME_HEIGHT / 2 - 40); ctx.lineTo(80, GAME_HEIGHT / 2 + 40); };
            }

            for (const arrow of arrowDefs) {
                if (!arrow.show) continue;
                ctx.save();

                const isHovering = hoverTarget === arrow.key;
                const pulse = isHovering ? 0.5 + Math.sin(Date.now() / 200) * 0.2 : 0.2;

                // 蝞剝?祇?
                ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1, pulse + 0.3)})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                arrow.draw();
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 璅惜
                ctx.fillStyle = isHovering ? '#f1c40f' : 'white';
                ctx.font = isHovering ? 'bold 22px Arial' : '20px Arial';
                ctx.fillText(arrow.label, arrow.labelX, arrow.labelY);

                // 皛舐??脣漲??
                if (isHovering && dwellProgress > 0) {
                    const r = 48;
                    // 摨
                    ctx.beginPath();
                    ctx.arc(arrow.cx, arrow.cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                    ctx.lineWidth = 7;
                    ctx.stroke();
                    // ?脣漲撘?
                    ctx.beginPath();
                    ctx.arc(arrow.cx, arrow.cy, r, -Math.PI / 2, -Math.PI / 2 + dwellProgress * Math.PI * 2);
                    const ringColor = dwellProgress > 0.7 ? '#2ecc71' : '#f1c40f';
                    ctx.strokeStyle = ringColor;
                    ctx.lineWidth = 7;
                    ctx.lineCap = 'round';
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = ringColor;
                    ctx.stroke();
                    // ?曉?瘥?
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${Math.round(dwellProgress * 100)}%`, arrow.cx, arrow.cy + 6);
                    ctx.textAlign = 'left';
                }

                ctx.restore();
            }
            // 敺桃??菜葫?內??(Debug/????
            if (isSmiling) {
                ctx.save();
                ctx.fillStyle = '#2ecc71';
                ctx.font = 'bold 20px Arial';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#2ecc71';
                const pulse = 1 + Math.sin(Date.now() / 150) * 0.1;
                ctx.translate(30, GAME_HEIGHT - 160);
                ctx.scale(pulse, pulse);
                ctx.fillText('微笑接單中...', 0, 0);
                ctx.restore();
            }
        }

        function updateScore(delta) {
            score += delta;
            scoreDisplay.innerText = score;
            if (delta > 0) {
                scoreDisplay.style.color = '#2ecc71';
            } else {
                scoreDisplay.style.color = '#e74c3c';
            }
            setTimeout(() => scoreDisplay.style.color = 'white', 500);
        }

        function updateReviews() {
            if (negativeReviews > 0) {
                reviewDisplay.style.display = 'inline-block';
                reviewDisplay.innerText = `? 鞎?: ${negativeReviews}`;
                // ???
                reviewDisplay.style.transform = 'scale(1.3)';
                setTimeout(() => reviewDisplay.style.transform = 'scale(1)', 300);
            }
        }

        initMediaPipe();
    </script>
</body>

</html>
