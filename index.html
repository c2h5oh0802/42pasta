<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42號義麵店</title>
    <style>
        /* ?箇??�蝵�?��???*/
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ?���脖蜓摰�??*/
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            overflow: hidden;
        }

        /* Canvas ??Video */
        canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            transform: translate(-50%, -50%);
            object-fit: contain;
            /* 靽��?瘥��?蝮格�� */
            z-index: 10;
        }

        #hand-canvas {
            z-index: 160;
            pointer-events: none;
        }

        video {
            display: none;
        }

        /* ?����?抒???UI 撅?(HUD) */
        #ui-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            transform: translate(-50%, -50%);
            z-index: 20;
            pointer-events: none;
            /* 霈��?曌��??���臭誑蝛�?���唬�����??HTML/Canvas */
        }

        .hud {
            position: absolute;
            box-sizing: border-box;
        }

        #status-hud {
            top: 16px;
            left: 18px;
            display: none;
            width: 272px;
            height: 76px;
            padding: 14px 18px 13px;
            color: #fff5d4;
            background-image: url('assets/img/ui/hud-board-wide.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 100% 100%;
            border: 0;
            border-radius: 0;
            box-shadow: 0 12px 18px rgba(0, 0, 0, 0.22);
            text-shadow: 0 2px 2px rgba(0, 0, 0, 0.6);
        }

        #status-hud::before,
        #status-hud::after {
            display: none;
        }

        #status-hud::before {
            left: 8px;
        }

        #status-hud::after {
            right: 8px;
        }

        .hud-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            height: 100%;
        }

        .hud-stat {
            min-width: 0;
            padding: 7px 6px 6px;
            background: rgba(255, 244, 205, 0.08);
            border: 1px solid rgba(255, 230, 160, 0.24);
            border-radius: 4px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.13);
        }

        .hud-label {
            display: block;
            color: #e5c58b;
            font-size: 12px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 4px;
        }

        .hud-value {
            display: block;
            color: #fff8df;
            font-size: 22px;
            font-weight: 900;
            line-height: 1;
        }

        #time-display {
            color: #ff705f;
        }

        #score-display {
            color: #77e79f;
        }

        /* ?�閮�?梯?嚗��??脖葉?�憿舐�?*/
        #satisfaction-bar-container {
            width: 220px;
            height: 22px;
            background: #333;
            border-radius: 11px;
            overflow: hidden;
            margin-top: 8px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        #satisfaction-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            transition: width 0.1s, background 0.3s;
        }

        /* --- 摰��??�??UI ?Ｘ�� (HTML 撖虫?) --- */
        .panel-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            transform: translate(-50%, -50%);
            background: transparent;
            /* ?寧��?��?嚗��?銝����??Canvas ?��??賡����箔�?*/
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* 璅��??恍�� */
        #title-screen {
            overflow: hidden;
        }

        #title-door-image {
            display: none;
        }

        #title-close-target {
            position: absolute;
            left: 43%;
            top: 39%;
            width: 16%;
            height: 15%;
            z-index: 1;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
        }

        #title-close-target.hand-hover {
            transform: none;
            box-shadow: none;
        }

        #title-hint {
            position: absolute;
            left: 50%;
            bottom: 8%;
            transform: translateX(-50%);
            z-index: 1;
            padding: 12px 22px;
            color: #fff7d6;
            background: rgba(38, 24, 14, 0.62);
            border: 1px solid rgba(255, 230, 160, 0.5);
            border-radius: 8px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        /* ?����?豢??恍�� */
        #level-select-screen h2 {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 30px;
        }

        .level-grid {
            display: flex;
            gap: 20px;
        }

        .level-card {
            background: rgba(44, 62, 80, 0.75);
            /* ?寧��?�����?嚗��?敺����?��??Ｙ��?����?���箔�?*/
            border: 2px solid #34495e;
            border-radius: 12px;
            padding: 20px;
            width: 180px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            position: relative;
        }

        .level-card:hover {
            transform: translateY(-5px);
            background: rgba(52, 73, 94, 0.85);
        }

        .level-card.locked {
            opacity: 0.5;
            filter: grayscale(100%);
            cursor: not-allowed;
        }

        .level-card.locked:hover {
            transform: none;
            background: rgba(44, 62, 80, 0.75);
        }

        .level-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .level-stars {
            font-size: 24px;
            color: #f1c40f;
            letter-spacing: 2px;
        }

        #level-select-screen {
            background-image: url('assets/img/bg/選關菜單.png');
            background-position: center;
            background-size: cover;
            box-sizing: border-box;
            justify-content: flex-start;
            padding-top: 0;
            padding-bottom: 0;
            gap: 0;
        }

        #level-select-screen h2 {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }

        .level-grid {
            position: absolute;
            top: 42%;
            left: 50%;
            gap: 28px;
            justify-content: center;
            max-width: min(560px, 78%);
            transform: translateX(-50%);
        }

        .level-card {
            background: rgba(255, 247, 218, 0.88);
            border: 2px solid rgba(91, 55, 30, 0.78);
            border-radius: 6px;
            box-shadow: 0 8px 0 rgba(95, 52, 27, 0.45), 0 12px 24px rgba(50, 25, 12, 0.28);
            color: #3b2316;
            padding: 15px 18px 14px;
            text-align: center;
            transition: transform 0.16s, box-shadow 0.16s, filter 0.16s;
            width: 180px;
            min-height: 78px;
        }

        .level-card:hover {
            background: rgba(255, 247, 218, 0.94);
            box-shadow: 0 5px 0 rgba(95, 52, 27, 0.5), 0 14px 28px rgba(50, 25, 12, 0.32);
            filter: brightness(1.04);
            transform: translateY(3px);
        }

        .level-card.locked {
            cursor: not-allowed;
            filter: grayscale(85%) brightness(0.78);
            opacity: 0.68;
        }

        .level-card.locked:hover {
            background: rgba(255, 247, 218, 0.88);
            box-shadow: 0 8px 0 rgba(95, 52, 27, 0.45), 0 12px 24px rgba(50, 25, 12, 0.28);
            transform: none;
        }

        .level-title {
            border-bottom: 0;
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 4px;
            padding-bottom: 0;
        }

        .level-meta {
            color: #5d3d28;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .level-stars {
            color: #b44128;
            font-size: 22px;
            letter-spacing: 1px;
        }

        #level-select-screen .btn {
            position: absolute;
            top: 66%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(84, 52, 31, 0.9) !important;
            border: 2px solid rgba(255, 235, 178, 0.72);
            border-radius: 6px;
            box-shadow: 0 4px 0 rgba(50, 25, 12, 0.8) !important;
            color: #fff2c2;
            margin: 0 !important;
            min-width: 145px;
            padding: 12px 28px;
            font-size: 22px;
        }

        #level-select-screen {
            background-image: none !important;
        }

        /* 蝯��??恍�� */
        #result-screen {
            align-items: stretch;
            box-sizing: border-box;
            justify-content: flex-start;
            padding: 0;
            text-shadow: 0 2px 3px rgba(60, 34, 18, 0.35);
        }

        .result-stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            transform: translate(-50%, -50%);
        }

        .result-board-ui {
            position: absolute;
            left: 11.2%;
            top: 25.5%;
            width: 35.5%;
            height: 47.8%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px 18px 15px;
            color: #4a2414;
        }

        #result-screen h2 {
            color: #4a2414;
            font-size: clamp(26px, 3.2vw, 42px);
            line-height: 1;
            margin: 0 0 6px;
            width: 100%;
        }

        .result-label {
            color: #6a3b20;
            font-size: clamp(15px, 1.5vw, 20px);
            font-weight: 900;
            line-height: 1.1;
            margin-top: 2px;
            width: 100%;
        }

        #result-money {
            font-size: clamp(38px, 4.3vw, 56px);
            color: #2ecc71;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 8px;
            width: 100%;
        }

        #result-penalty {
            box-sizing: border-box;
            width: 82%;
            color: #8f2e22;
            font-size: clamp(14px, 1.35vw, 18px);
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 8px;
            padding: 6px 10px 7px;
            background: rgba(255, 240, 203, 0.58);
            border: 2px dashed rgba(112, 61, 28, 0.42);
            border-radius: 4px;
        }

        #result-stars {
            width: 100%;
            font-size: clamp(34px, 4vw, 50px);
            color: #f1c40f;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: 4px;
            -webkit-text-stroke: 1px rgba(95, 46, 19, 0.45);
        }

        .result-actions {
            display: flex !important;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            margin-top: clamp(16px, 2.2vh, 28px);
            padding-bottom: 0;
            justify-content: center;
        }

        #result-screen .btn {
            align-items: center;
            aspect-ratio: 3 / 1;
            background-color: transparent !important;
            background-image: url('assets/img/ui/result-paper-button.png') !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-size: 100% 100% !important;
            border: 0;
            border-radius: 0;
            box-shadow: none !important;
            color: #4a2414;
            display: inline-flex;
            flex: 0 1 36%;
            font-size: clamp(15px, 1.35vw, 19px);
            font-weight: 900;
            justify-content: center;
            line-height: 1.05;
            margin: 0;
            min-width: 0;
            padding: 11px 24px 13px;
            text-shadow: 0 1px 0 rgba(255, 245, 216, 0.85);
            transform: rotate(-1.5deg);
            white-space: normal;
        }

        #result-screen .btn:nth-child(2) {
            transform: rotate(1deg);
        }

        #result-screen .btn:nth-child(3) {
            transform: rotate(-0.5deg);
        }

        #result-screen .btn:hover {
            background-color: transparent !important;
            box-shadow: none !important;
            filter: brightness(1.05) saturate(1.08);
            transform: translateY(2px) rotate(-1.5deg);
        }

        #result-screen .btn:nth-child(2):hover {
            transform: translateY(2px) rotate(1deg);
        }

        #result-screen .btn:nth-child(3):hover {
            transform: translateY(2px) rotate(-0.5deg);
        }

        /* ?梁��?��?璅?? (HTML ?��?嚗��?靘��?曌�皜祈岫�??芯??踵??箸??Ｚ孛?? */
        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: rgba(231, 76, 60, 0.85);
            /* ?寧��?�����? */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(192, 57, 43, 0.85);
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 10px;
            position: relative;
        }

        .btn:hover {
            background: rgba(231, 76, 60, 0.95);
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(192, 57, 43, 0.85);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .hand-hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.9), 0 0 18px rgba(241, 196, 15, 0.6);
        }

        /* Overcooked 憸冽�潸����� UI */
        #order-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 50;
            pointer-events: none;
        }

        .order-card {
            width: 92px;
            min-height: 110px;
            box-sizing: border-box;
            background-color: transparent;
            background-image: url('assets/img/ui/order-ticket.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 100% 100%;
            border-radius: 0;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
            overflow: visible;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 0;
            padding: 10px 8px 10px;
            transition: transform 0.3s;
        }

        .order-card.is-active {
            filter: drop-shadow(0 0 7px rgba(241, 196, 15, 0.85));
            transform: translateY(-2px);
        }

        .order-patience-bg {
            width: 80%;
            height: 6px;
            background: rgba(77, 45, 25, 0.24);
            border: 1px solid rgba(95, 52, 27, 0.25);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 3px;
        }

        .order-patience-fill {
            height: 100%;
            background: #27ae60;
            width: 100%;
            transition: width 0.1s;
        }

        .order-icon {
            font-size: 26px;
            margin: 5px 0 3px;
        }

        .order-type-text {
            font-size: 11px;
            color: #3d2416;
            font-weight: 900;
            padding-bottom: 3px;
            text-shadow: 0 1px 0 rgba(255, 246, 218, 0.75);
        }

        .order-status {
            font-size: 10px;
            color: #6a4a2f;
            font-weight: 800;
            padding: 2px 0;
            background: transparent;
            width: 100%;
            text-align: center;
        }

        /* ?文?憿舐內 */
        .online-card {
            width: min(560px, 82%);
            padding: 24px 28px 26px;
            box-sizing: border-box;
            color: #3b2316;
            background: rgba(255, 246, 218, 0.94);
            border: 3px solid rgba(91, 55, 30, 0.78);
            border-radius: 8px;
            box-shadow: 0 12px 0 rgba(95, 52, 27, 0.45), 0 18px 34px rgba(24, 12, 6, 0.32);
        }

        .online-card h2 {
            margin: 0 0 16px;
            color: #3b2316;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1;
        }

        .online-name-input {
            width: 100%;
            box-sizing: border-box;
            margin: 8px 0 16px;
            padding: 13px 16px;
            color: #3b2316;
            background: #fff9e9;
            border: 2px solid rgba(91, 55, 30, 0.55);
            border-radius: 6px;
            font-size: clamp(18px, 2vw, 24px);
            font-weight: 900;
            text-align: center;
        }

        .online-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .online-actions .btn {
            min-width: 150px;
            margin: 4px;
            padding: 12px 22px;
            font-size: clamp(17px, 2vw, 22px);
        }

        .online-status {
            min-height: 28px;
            margin: 8px 0 14px;
            color: #6a3b20;
            font-size: clamp(16px, 1.8vw, 22px);
            font-weight: 900;
            line-height: 1.3;
        }

        .online-error {
            color: #a93226;
        }

        #level-online-actions {
            position: absolute;
            top: 56%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: min(620px, 86%);
            pointer-events: auto;
        }

        #level-online-actions .btn {
            margin: 0;
            padding: 10px 20px;
            font-size: clamp(16px, 1.8vw, 21px);
        }

        .nickname-chip {
            max-width: 190px;
            overflow: hidden;
            color: #fff2c2;
            font-weight: 900;
            text-overflow: ellipsis;
            text-shadow: 0 2px 2px rgba(0, 0, 0, 0.45);
            white-space: nowrap;
        }

        #battle-hud {
            position: absolute;
            top: 16px;
            right: 18px;
            display: none;
            min-width: 300px;
            box-sizing: border-box;
            padding: 10px 12px;
            color: #fff8df;
            background: rgba(39, 28, 20, 0.88);
            border: 2px solid rgba(255, 224, 150, 0.48);
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.28);
            pointer-events: auto;
        }

        .battle-score-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
            font-weight: 900;
        }

        .battle-score {
            min-width: 0;
        }

        .battle-score span {
            display: block;
            color: #e5c58b;
            font-size: 11px;
            line-height: 1;
            margin-bottom: 3px;
        }

        .battle-score strong {
            display: block;
            color: #77e79f;
            font-size: 20px;
            line-height: 1;
        }

        #battle-time {
            min-width: 58px;
            color: #ff705f;
            font-size: 30px;
            font-weight: 950;
            line-height: 1;
            text-align: center;
        }

        .battle-items {
            display: flex;
            gap: 8px;
            margin-top: 9px;
        }

        .battle-item-slot {
            width: 58px;
            height: 54px;
            box-sizing: border-box;
            display: grid;
            place-items: center;
            background: rgba(255, 244, 205, 0.12);
            border: 1px solid rgba(255, 230, 160, 0.38);
            border-radius: 6px;
            cursor: pointer;
            overflow: hidden;
        }

        .battle-item-slot img {
            max-width: 48px;
            max-height: 44px;
            pointer-events: none;
        }

        .battle-item-slot.empty {
            cursor: default;
            opacity: 0.45;
        }

        .battle-item-slot.hand-hover {
            transform: scale(1.04);
        }

        #online-result-screen .online-card {
            width: min(720px, 88%);
            max-height: 90%;
            overflow: hidden;
        }

        .online-result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 10px 0 14px;
        }

        .online-result-score {
            padding: 10px;
            background: rgba(255, 240, 203, 0.62);
            border: 2px dashed rgba(112, 61, 28, 0.36);
            border-radius: 6px;
            font-weight: 900;
        }

        .online-result-score strong {
            display: block;
            margin-top: 4px;
            color: #2d9f57;
            font-size: 26px;
        }

        #leaderboard-list {
            margin: 8px 0 14px;
            padding: 0;
            list-style: none;
            text-align: left;
            color: #3b2316;
            font-weight: 800;
        }

        #leaderboard-list li {
            display: grid;
            grid-template-columns: 34px 1fr auto;
            gap: 8px;
            padding: 5px 8px;
            border-bottom: 1px solid rgba(91, 55, 30, 0.18);
        }

        .order-card.confused .order-type-text,
        .order-card.confused .order-status {
            color: transparent;
            text-shadow: 0 0 8px rgba(61, 36, 22, 0.88);
        }

        #plate-display {
            display: block;
        }

        #btn-restart-level {
            flex-basis: 36%;
            min-width: 150px;
            font-size: clamp(15px, 1.45vw, 19px);
            padding: 10px 24px 12px;
        }

        #level-select-screen .btn:hover {
            transform: translate(-50%, 2px);
        }

        #level-select-screen .btn:active {
            transform: translate(-50%, 4px);
        }
    </style>
    <!-- Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>

<body>

    <div id="game-container">
        <div id="loading">載入 MediaPipe 模型與相機中...</div>

        function playSound(name, volume = 0.7, cooldown = 60) {
            const base = sounds[name];
            if (!base) return;
            const now = Date.now();
            if (soundLastPlayed[name] && now - soundLastPlayed[name] < cooldown) return;
            soundLastPlayed[name] = now;
            const audio = base.cloneNode();
            audio.volume = volume;
            audio.play().catch(() => {});
        }

            return 'customerPop';
        }

        function drawCustomerImage(customer, x, y, width, height, fallbackColor = '#3498db') {
            const img = customerImages[customer.customerImageIndex % customerImages.length];
            if (img && img.complete && img.naturalWidth > 0) {
                const scale = Math.min(width / img.naturalWidth, height / img.naturalHeight);
                const drawWidth = img.naturalWidth * scale;
                const drawHeight = img.naturalHeight * scale;
                ctx.drawImage(img, x - drawWidth / 2, y - drawHeight / 2, drawWidth, drawHeight);
                return;
            }

            ctx.fillStyle = fallbackColor;
            ctx.beginPath();
            ctx.arc(x, y - height * 0.25, width * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x - width * 0.22, y, width * 0.44, height * 0.42);
        }

        function drawCoverImage(img, x, y, width, height) {
            const scale = Math.max(width / img.naturalWidth, height / img.naturalHeight);
            const drawWidth = img.naturalWidth * scale;
            const drawHeight = img.naturalHeight * scale;
            ctx.drawImage(img, x + (width - drawWidth) / 2, y + (height - drawHeight) / 2, drawWidth, drawHeight);
        }

        function drawSpriteInBox(img, x, y, width, height, scale = 1) {
            if (!img || !img.complete || img.naturalWidth <= 0) return false;
            const fitScale = Math.min(width / img.naturalWidth, height / img.naturalHeight) * scale;
            const drawWidth = img.naturalWidth * fitScale;
            const drawHeight = img.naturalHeight * fitScale;
            ctx.drawImage(img, x + (width - drawWidth) / 2, y + (height - drawHeight) / 2, drawWidth, drawHeight);
            return true;
        }

        function drawSpriteCentered(img, width, height, scale = 1, targetCtx = ctx) {
            if (!img || !img.complete || img.naturalWidth <= 0) return false;
            const fitScale = Math.min(width / img.naturalWidth, height / img.naturalHeight) * scale;
            const drawWidth = img.naturalWidth * fitScale;
            const drawHeight = img.naturalHeight * fitScale;
            targetCtx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            return true;
        }

        function isOutsideCleaningTable(x, y) {
            return x < CLEANING_TABLE_SURFACE.x ||
                x > CLEANING_TABLE_SURFACE.x + CLEANING_TABLE_SURFACE.w ||
                y < CLEANING_TABLE_SURFACE.y ||
                y > CLEANING_TABLE_SURFACE.y + CLEANING_TABLE_SURFACE.h;
        }

        function distance2D(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function isFistGesture(landmarks) {
            const palmCenter = landmarks[9];
            const fingers = [
                { tip: 8, pip: 6 },
                { tip: 12, pip: 10 },
                { tip: 16, pip: 14 },
                { tip: 20, pip: 18 }
            ];
            const curledCount = fingers.reduce((count, finger) => {
                const tipDistance = distance2D(landmarks[finger.tip], palmCenter);
                const pipDistance = distance2D(landmarks[finger.pip], palmCenter);
                return count + (tipDistance < pipDistance * 1.15 ? 1 : 0);
            }, 0);

            return curledCount >= 3;
        }

        async function ensureFirebaseReady() {
            if (!isFirebaseConfigured()) throw new Error('尚未設定 Firebase');
            if (!firebaseApp) {
                firebaseApp = initializeApp(FIREBASE_CONFIG);
                firebaseAuth = getAuth(firebaseApp);
                firebaseDb = getDatabase(firebaseApp);
                onValue(ref(firebaseDb, '.info/serverTimeOffset'), snapshot => {
                    serverTimeOffset = snapshot.val() || 0;
                });
            }
            if (!firebaseAuth.currentUser) {
                await signInAnonymously(firebaseAuth);
                await new Promise(resolve => {
                    if (firebaseAuth.currentUser) return resolve();
                    const stop = onAuthStateChanged(firebaseAuth, () => {
                        stop();

                    });
                });

            onlinePlayerId = firebaseAuth.currentUser.uid;

        function cleanupOnlineListeners() {
            if (matchmakingUnsub) matchmakingUnsub();

            matchmakingUnsub = matchUnsub = eventUnsub = leaderboardUnsub = null;

        function resetOnlineRoundState() {
            onlineMode = false;
            onlineMatchId = null;
            onlineOpponentId = null;
            onlineMatchData = null;
            opponentState = {};
            battleItems = [];
            activeDebuffs = {};

            onlineServedCount = 0;
            onlineResultSubmitted = false;
            processedOnlineEvents = new Set();

        async function startOnlineMatchmaking() {
            if (!saveNicknameFromInput()) return;
            if (!isFirebaseConfigured()) {
                setOnlineStatus('尚未設定 Firebase，單人模式可正常遊玩', true);
                return;
            }
            onlineMode = true;
            changeMacroState('MATCHMAKING');
            setOnlineStatus('正在配對...');
            try {
                await ensureFirebaseReady();
                const queueRoot = ref(firebaseDb, 'queue');
                const firstWaiting = await get(query(queueRoot, orderByChild('createdAt'), limitToFirst(6)));
                let opponentEntry = null;
                firstWaiting.forEach(snap => {
                    if (!opponentEntry && snap.key !== onlinePlayerId && !snap.val()?.matchId) {
                        opponentEntry = { id: snap.key, data: snap.val() };
                    }
                });

                if (opponentEntry) {
                    const matchRef = push(ref(firebaseDb, 'matches'));
                    const startAt = serverNowMs() + 5000;
                    const endsAt = startAt + ONLINE_RULES.time * 1000;
                    await set(matchRef, {
                        status: 'countdown',
                        createdAt: serverTimestamp(),
                        startAt,
                        endsAt,
                        players: {
                            [onlinePlayerId]: createInitialPlayerState(playerNickname),
                            [opponentEntry.id]: createInitialPlayerState(opponentEntry.data.nickname || '對手')
                        }
                    });
                    await update(ref(firebaseDb, `queue/${opponentEntry.id}`), { matchId: matchRef.key });
                    await enterOnlineMatch(matchRef.key);
                    return;
                }

                const myQueueRef = ref(firebaseDb, `queue/${onlinePlayerId}`);
                await set(myQueueRef, { nickname: playerNickname, createdAt: serverTimestamp() });
                onDisconnect(myQueueRef).remove();
                matchmakingUnsub = onValue(myQueueRef, async snapshot => {
                    const data = snapshot.val();
                    if (data?.matchId) {
                        await remove(myQueueRef).catch(() => {});
                        await enterOnlineMatch(data.matchId);
                    }
                });
            } catch (err) {
                console.error(err);
                setOnlineStatus(err.message || '配對失敗', true);
            }
        }

        function createInitialPlayerState(nickname) {
            return {
                nickname,
                score: 0,
                finalScore: 0,
                negativeReviews: 0,
                servedCount: 0,
                itemInventory: [],
                ready: true,
                finished: false
            };
        }

        async function enterOnlineMatch(matchId) {
            cleanupOnlineListeners();
            onlineMode = true;
            onlineMatchId = matchId;
            onlineResultSubmitted = false;
            processedOnlineEvents = new Set();
            changeMacroState('ONLINE_COUNTDOWN');
            const matchRef = ref(firebaseDb, `matches/${matchId}`);
            matchUnsub = onValue(matchRef, snapshot => {
                onlineMatchData = snapshot.val();
                if (!onlineMatchData) {
                    showTip('對戰已結束');
                    resetOnlineRoundState();
                    changeMacroState('LEVEL_SELECT');
                    return;
                }
                const players = onlineMatchData.players || {};
                onlineOpponentId = Object.keys(players).find(id => id !== onlinePlayerId) || null;
                opponentState = onlineOpponentId ? (players[onlineOpponentId] || {}) : {};
                updateBattleHud();

                if (onlineMatchData.status === 'countdown') {
                    changeMacroState('ONLINE_COUNTDOWN');
                } else if (onlineMatchData.status === 'playing' && macroState !== 'ONLINE_GAMEPLAY') {
                    changeMacroState('ONLINE_GAMEPLAY');
                } else if (onlineMatchData.status === 'finished' && macroState !== 'ONLINE_RESULT') {
                    changeMacroState('ONLINE_RESULT');
                }
            });
            eventUnsub = onChildAdded(ref(firebaseDb, `matches/${matchId}/events`), snapshot => {
                const event = snapshot.val();
                if (!event || event.to !== onlinePlayerId || processedOnlineEvents.has(snapshot.key)) return;
                processedOnlineEvents.add(snapshot.key);
                applyBattleItemEffect(event.type);
            });
        }

        function publishOnlineState(force = false) {
            if (!onlineMode || !firebaseDb || !onlineMatchId || !onlinePlayerId) return;
            const now = performance.now();
            if (!force && now - lastOnlinePublish < 700) return;
            lastOnlinePublish = now;
            const payload = {
                nickname: playerNickname,
                score,
                finalScore: Math.max(0, score - negativeReviews * 15),
                negativeReviews,
                servedCount: onlineServedCount,
                itemInventory: battleItems,
                ready: true,
                finished: onlineResultSubmitted
            };
            update(ref(firebaseDb, `matches/${onlineMatchId}/players/${onlinePlayerId}`), payload).catch(() => {});
        }

        function updateBattleHud() {
            if (!battleHud) return;
            const show = onlineMode && (macroState === 'ONLINE_GAMEPLAY' || macroState === 'ONLINE_COUNTDOWN');
            battleHud.style.display = show ? 'block' : 'none';
            if (battleMyScoreEl) battleMyScoreEl.textContent = score;
            if (battleOpponentScoreEl) battleOpponentScoreEl.textContent = opponentState?.score || 0;
            if (battleTimeEl) battleTimeEl.textContent = Math.max(0, gameTimer);
            battleItemSlots.forEach((slot, index) => {
                if (!slot) return;
                const itemKey = battleItems[index];
                slot.classList.toggle('empty', !itemKey);
                slot.innerHTML = itemKey ? `<img src="${BATTLE_ITEMS[itemKey].icon}" alt="${BATTLE_ITEMS[itemKey].name}">` : '';
                slot.title = itemKey ? BATTLE_ITEMS[itemKey].name : '空道具槽';
            });
        }

        function grantBattleItemIfNeeded() {
            if (!onlineMode) return;
            onlineServedCount++;
            if (onlineServedCount % ONLINE_RULES.itemEveryServes !== 0 || battleItems.length >= ONLINE_RULES.maxItems) {
                publishOnlineState(true);
                return;
            }
            const itemKey = BATTLE_ITEM_KEYS[Math.floor(Math.random() * BATTLE_ITEM_KEYS.length)];
            battleItems.push(itemKey);
            showTip(`獲得道具：${BATTLE_ITEMS[itemKey].name}`);
            updateBattleHud();
            publishOnlineState(true);
        }

        async function useBattleItem(index) {
            const itemKey = battleItems[index];
            if (!onlineMode || !itemKey || !onlineOpponentId || !firebaseDb || !onlineMatchId) return;
            battleItems.splice(index, 1);
            updateBattleHud();
            publishOnlineState(true);
            await push(ref(firebaseDb, `matches/${onlineMatchId}/events`), {
                from: onlinePlayerId,
                to: onlineOpponentId,
                type: itemKey,
                createdAt: serverTimestamp()
            });
            showTip(`使用道具：${BATTLE_ITEMS[itemKey].name}`);
        }

        function applyBattleItemEffect(type) {
            const now = performance.now();
            if (type === 'RUSH_HOUR') {
                activeDebuffs.rushHourUntil = now + 10000;
                showTip('對手使用了尖峰時刻');
            } else if (type === 'DIRTY_TABLE') {
                pendingDirtyTable = true;
                applyPendingDirtyTable();
                showTip('對手弄髒了一張桌子');
            } else if (type === 'CONFUSE_ORDER') {
                activeDebuffs.confuseOrderUntil = now + 8000;
                updateOrderUI();
                showTip('訂單被干擾了');
            } else if (type === 'STICKY_HANDS') {
                activeDebuffs.stickyHandsUntil = now + 8000;
                showTip('雙手變黏了');
            }
        }

        function applyPendingDirtyTable() {
            if (!pendingDirtyTable) return;
            const tableIndex = tableStates.findIndex((state, idx) => state === 'FREE' && idx < LEVELS[currentLevelIndex].tables);
            if (tableIndex === -1) return;
            tableStates[tableIndex] = 'DIRTY';
            tableCleanProgress[tableIndex] = 0;
            pendingDirtyTable = false;
        }

        function getDebuffProgressMultiplier() {
            return activeDebuffs.stickyHandsUntil && performance.now() < activeDebuffs.stickyHandsUntil ? 1.45 : 1;
        }

        async function finishOnlineMatch() {
            if (!onlineMode || onlineResultSubmitted) return;
            onlineResultSubmitted = true;
            const finalScore = Math.max(0, score - negativeReviews * 15);
            publishOnlineState(true);
            if (firebaseDb && onlineMatchId && onlinePlayerId) {
                await update(ref(firebaseDb, `matches/${onlineMatchId}/players/${onlinePlayerId}`), {
                    finalScore,
                    grossScore: score,
                    negativeReviews,
                    finished: true
                }).catch(() => {});
                const latest = await get(ref(firebaseDb, `matches/${onlineMatchId}/players`)).catch(() => null);
                const players = latest?.val?.() || {};
                const allFinished = Object.values(players).length >= 2 && Object.values(players).every(p => p.finished);
                if (allFinished) {
                    await update(ref(firebaseDb, `matches/${onlineMatchId}`), { status: 'finished' }).catch(() => {});
                }
            }
            changeMacroState('ONLINE_RESULT');
            await submitLeaderboard(finalScore);
        }

        async function submitLeaderboard(finalScore) {
            if (!firebaseDb || !onlineMatchId || !onlinePlayerId) return;
            const opponentFinal = opponentState?.finalScore || Math.max(0, (opponentState?.score || 0) - (opponentState?.negativeReviews || 0) * 15);

            await push(ref(firebaseDb, 'leaderboard'), {
                nickname: playerNickname,
                finalScore,
                grossScore: score,
                negativeReviews,
                won,
                createdAt: serverTimestamp()
            }).catch(() => {});
            listenLeaderboard();
        }

        // --- Phase 2: ?���冽趙�?撠���� (Dwell Navigation) ---
        function checkDwellNavigation() {
            if (!isGameplayState()) return;
            if (Date.now() < dwellCooldown) {
                hoverTarget = null;
                dwellProgress = 0;
                return;
            }

            let currentZone = null;
            let targetKey = null;

            let allowedTargets = [];
            if (microLocation === 'COUNTER') allowedTargets = ['KITCHEN', 'DINING_ROOM'];
            else if (microLocation === 'KITCHEN') allowedTargets = ['COUNTER', 'SINK'];
            else if (microLocation === 'DINING_ROOM') allowedTargets = ['COUNTER'];
            else if (microLocation === 'SINK') allowedTargets = ['KITCHEN'];
            else if (microLocation === 'TABLE_CLEANING') allowedTargets = ['DINING_ROOM'];

            const zones = getDynamicNavZones();
            for (const key in zones) {
                // ?����?芾��?典?閮梁?蝭��?蝘餃?
                if (allowedTargets.includes(key) || key.startsWith('CLEAN_TABLE_')) {
                    const zone = zones[key];
                    for (const pos of activeHandPositions) {
                        if (pos.x >= zone.x && pos.x <= zone.x + zone.w &&
                            pos.y >= zone.y && pos.y <= zone.y + zone.h) {
                            currentZone = key;
                            break;
                        }
                    }
                }
                if (currentZone) { targetKey = currentZone; break; }
            }

            if (currentZone) {
                if (hoverTarget === currentZone) {
                    const elapsed = Date.now() - hoverStartTime;
                    dwellProgress = Math.min(1, elapsed / HOVER_DWELL_TIME);
                    if (dwellProgress >= 1) {
                        if (targetKey.startsWith('CLEAN_TABLE_')) {
                            const idx = parseInt(targetKey.replace('CLEAN_TABLE_', ''));
                            setMicroLocation('TABLE_CLEANING', idx);
                        } else {
                            setMicroLocation(targetKey);
                        }
                        hoverTarget = null;
                        dwellProgress = 0;
                        dwellCooldown = Date.now() + DWELL_COOLDOWN_TIME;
                    }
                } else {
                    hoverTarget = currentZone;
                    hoverStartTime = Date.now();
                    dwellProgress = 0;
                }
            } else {
                hoverTarget = null;
                dwellProgress = 0;
            }
        }

        // --- 銝駁��???����?詨��/蝯��??恍�ｇ���??Ｘ趙?��?雿?---
        function checkUiDwellActions() {
            if (isGameplayState() || macroState === 'LOADING') return;
            if (Date.now() < uiDwellCooldown) {
                if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                uiHoverTarget = null;
                uiDwellProgress = 0;
                uiDwellHandSide = null;
                return;
            }

            let currentTarget = null;
            let currentAction = null;
            let currentHandSide = null;

            for (const item of registeredUiElements) {
                const rect = item.el.getBoundingClientRect();
                const canvasRect = canvas.getBoundingClientRect();

                // 閮��?蝮格�暹���?
                const scaleX = GAME_WIDTH / canvas.offsetWidth;
                const scaleY = GAME_HEIGHT / canvas.offsetHeight;

                // 撠?CSS 摨扳?頧��??粹??脣��?典漣璅?(960x540)
                const zone = {
                    x: (rect.left - canvasRect.left) * scaleX,
                    y: (rect.top - canvasRect.top) * scaleY,
                    w: rect.width * scaleX,
                    h: rect.height * scaleY
                };
                for (const pos of activeHandPositions) {
                    if (pos.x >= zone.x && pos.x <= zone.x + zone.w &&
                        pos.y >= zone.y && pos.y <= zone.y + zone.h) {
                        currentTarget = item.el;
                        currentAction = item.action;
                        currentHandSide = pos.isRight ? 'right' : 'left';
                        break;
                    }
                }
                if (currentTarget) break;
            }

            if (currentTarget) {
                if (uiHoverTarget === currentTarget) {
                    if (uiDwellHandSide !== currentHandSide) {
                        uiDwellHandSide = currentHandSide;
                        uiHoverStartTime = Date.now();
                        uiDwellProgress = 0;
                        return;
                    }
                    const elapsed = Date.now() - uiHoverStartTime;
                    uiDwellProgress = Math.min(1, elapsed / UI_DWELL_TIME);
                    if (uiDwellProgress >= 1) {
                        try {
                            currentAction();
                        } catch (e) {
                            console.error("Action Error: ", e);
                        }
                        if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                        uiHoverTarget = null;
                        uiDwellProgress = 0;
                        uiDwellHandSide = null;
                        uiDwellCooldown = Date.now() + UI_COOLDOWN_TIME;
                        return; // ?瑁?摰��?雿��??湔�亥歲��綽�����?��? null ?��?
                    }
                } else {
                    if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                    uiHoverTarget = currentTarget;
                    uiDwellHandSide = currentHandSide;
                    uiHoverStartTime = Date.now();
                    uiDwellProgress = 0;
                }

                if (uiHoverTarget) {
                    uiHoverTarget.classList.add('hand-hover');
                }
            } else {
                if (uiHoverTarget) uiHoverTarget.classList.remove('hand-hover');
                uiHoverTarget = null;
                uiDwellProgress = 0;
                uiDwellHandSide = null;
            }
        }

        function gameLoop(timestamp = performance.now()) {
            const elapsedMs = lastFrameTime ? timestamp - lastFrameTime : 1000 / 60;
            lastFrameTime = timestamp;
            frameScale = Math.max(0.25, Math.min(4, elapsedMs / (1000 / 60)));

            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                faceResult = faceLandmarker.detectForVideo(video, timestamp);
                handResult = handLandmarker.detectForVideo(video, timestamp);
            }

            Engine.update(engine, Math.min(1000 / 20, elapsedMs));

            if (macroState === 'ONLINE_COUNTDOWN' && onlineMatchData?.startAt) {
                const remainingMs = onlineMatchData.startAt - serverNowMs();
                const count = Math.max(0, Math.ceil(remainingMs / 1000));
                if (onlineCountdownValue) onlineCountdownValue.textContent = count > 0 ? count : 'GO';
                gameTimer = Math.max(0, Math.ceil(((onlineMatchData.endsAt || onlineMatchData.startAt) - serverNowMs()) / 1000));
                updateBattleHud();
                if (remainingMs <= 0) {
                    if (onlineMatchData.status !== 'playing' && firebaseDb && onlineMatchId) {
                        update(ref(firebaseDb, `matches/${onlineMatchId}`), { status: 'playing' }).catch(() => {});
                    }
                    changeMacroState('ONLINE_GAMEPLAY');
                }
            }

            // 摰Ｖ犖?��??�頛�
            if (macroState === 'GAMEPLAY' || macroState === 'ONLINE_GAMEPLAY') {
                applyPendingDirtyTable();
                customerSpawnTimer -= frameScale;
                // ?�鋆�??customers.length < LEVELS[currentLevelIndex].tables 隞?”?��?蝛箔??��?靘���啣恥鈭�??
                // 蝑��?敺?Phase 4嚗��??��������?隞嗆��??(瑹�瑼�?��?鈭箸�� + ?券??�雿��?鈭箸��) < 蝮賢漣雿����
                if (customerSpawnTimer <= 0 && customers.length < LEVELS[currentLevelIndex].tables) {
                    const spawnedCustomerImageIndex = nextCustomerImageIndex;
                    const rand = Math.random();
                    let type = 'PASTA_NORMAL';
                    if (rand < 0.33) type = 'PASTA_CILANTRO';
                    else if (rand < 0.66) type = 'PASTA_CEMENT';
                    else type = 'PASTA_CEMENT_CILANTRO';

                    // 憌脫??�瘙���文�?(?��?蝚砌???
                    let wantsDrink = false;
                    if (LEVELS[currentLevelIndex].id === 2) {
                        wantsDrink = Math.random() < 0.6; // 60% 璈��?閬�憌�??
                    }

                    customers.push({
                        id: Date.now(),
                        customerImageIndex: spawnedCustomerImageIndex,
                        orderType: type,
                        state: 'ORDERING',
                        patience: 100,
                        serveDwell: 0,
                        tableIndex: -1, // 撠����?亙漣
                        wantsDrink: wantsDrink,
                        hasPasta: false,
                        hasDrink: false,
                        eatTimer: 0,
                        counterVoicePlayed: false,
                        counterReminderPlayed: false
                    });
                    nextCustomerImageIndex = (nextCustomerImageIndex + 1) % customerImages.length;
                    // ?箇? 4 蝘��?銝�??+ 瘥�����?閰��???1.5 蝘��??��??��?
                    customerSpawnTimer = 150 + (negativeReviews * 60);
                }
                for (let i = customers.length - 1; i >= 0; i--) {
                    let c = customers[i];
                    // ?���其���?銝��?擗?(WAITING_FOOD) ?�撣豢���??冽?瑼舫?擗��??��? (憭批?隤踵��)
                    // 摰Ｖ犖?��?銝��??�摨西矽��� (暺��?敺?0.04 -> 0.02嚗��?擗��? 0.01 -> 0.006)
                    let patienceLoss = (c.state === 'WAITING_FOOD') ? 0.006 : 0.02;
                    if (activeDebuffs.rushHourUntil && performance.now() < activeDebuffs.rushHourUntil) {
                        patienceLoss *= 1.8;
                    }
                    c.patience -= patienceLoss * frameScale;

                    if (c.state === 'ORDERING' && c.patience < 50 && !c.counterReminderPlayed) {
                        c.counterReminderPlayed = true;
                        playSound('order', 0.75, 600);
                    }

                    if (c.patience <= 0) {
                        // ... (銋��?撌脫??�����??����?�頛�)
                        if (activeOrder && activeOrder.id === c.id) {
                            activeOrder = null; cookState = 'IDLE'; 
                            dragItems.left = dragItems.right = null;
                            handOpenUntil = { left: 0, right: 0 };
                            plateHasNoodles = plateHasCement = plateHasCilantro = false;
                            resetPots();
                        }
                        if (c.tableIndex !== -1) {
                            tableStates[c.tableIndex] = 'DIRTY';
                            tableCleanProgress[c.tableIndex] = 0;
                        }
                        customers.splice(i, 1);
                        negativeReviews++; customerSpawnTimer += 180;
                        updateReviews();
                    } else if (c.state === 'EATING') {
                        c.eatTimer += frameScale;
                        if (c.eatTimer > 300) { // ?券? 5 蝘?
                            if (c.tableIndex !== -1) {
                                tableStates[c.tableIndex] = 'DIRTY';
                                tableCleanProgress[c.tableIndex] = 0;
                                tableHasDrink[c.tableIndex] = c.hasDrink; // 頧�蝘駁ㄡ�??����?�??
                            }
                            customers.splice(i, 1);
                        }
                    }
                }
            }

            // 瑼Ｘ��?����?臬�西◤���?箇��??(?孵神?恍��)
            if (microLocation === 'TABLE_CLEANING') {
                if (cleaningSubState === 'CLEAR_TRASH') {
                    trashBodies = trashBodies.filter(body => {
                        const px = body.position.x;
                        const py = body.position.y;
                        if (isOutsideCleaningTable(px, py)) {
                            World.remove(world, body);
                            // 蝘駁�支遙�?皜��??����?��??Ｙ???
                            return false;
                        }
                        return true;
                    });

                    if (trashBodies.length === 0) {
                        cleaningSubState = 'WIPE_TABLE';
                    }
                }
            }

            handCtx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.save();
            ctx.scale(-1, 1);
            ctx.translate(-GAME_WIDTH, 0);

            handleHandLogic(); // ?瑁??����?�頛� (UI?文??����?�摨扳���?)

            drawTipOverlay();

            if (handResult && handResult.landmarks) {

                handResult.handednesses.forEach((h, idx) => {

        function handleFaceLogic() {
            if (microLocation !== 'COUNTER') return; // 銝���冽��瑼臭����文��敺桃�?

            isSmiling = false;
            if (faceResult && faceResult.faceBlendshapes.length > 0) {
                const blendshapes = faceResult.faceBlendshapes[0].categories;
                const smileLeft = blendshapes.find(c => c.categoryName === 'mouthSmileLeft')?.score || 0;
                const smileRight = blendshapes.find(c => c.categoryName === 'mouthSmileRight')?.score || 0;
                if (smileLeft > 0.2 || smileRight > 0.2) isSmiling = true;
            }

            if (customers.length > 0) {
                // 1. 敺桃??亙��?�頛�
                const orderingCustomer = customers.find(c => c.state === 'ORDERING');
                if (orderingCustomer) {
                    // 瑼Ｘ��?臬��?�蝛箸���? (FREE ?�?��??函��?��??⊥??貊??����)
                    const freeTableIndex = tableStates.findIndex((s, idx) => s === 'FREE' && idx < LEVELS[currentLevelIndex].tables);

                    if (freeTableIndex === -1) {
                        // 瘝�蝛箸���?嚗�敺桃���?蝯虫??�蝷�
                        if (isSmiling) showTip('沒有空桌，請先去用餐區整理桌面');
                        orderingCustomer.serveDwell = 0;
                    } else {
                        if (isSmiling) {
                            orderingCustomer.serveDwell += 0.03 * frameScale;
                            if (orderingCustomer.serveDwell >= 1) {
                                orderingCustomer.state = 'WAITING_FOOD';
                                orderingCustomer.tableIndex = freeTableIndex;
                                tableStates[freeTableIndex] = 'OCCUPIED';
                                orderingCustomer.serveDwell = 0;
                                orderingCustomer.patience = Math.min(100, orderingCustomer.patience + 25);

                                activeOrder = findNextKitchenOrder();
                                cookState = activeOrder && !activeOrder.hasPasta ? 'PUT_PASTA' : 'IDLE';
                                showTip('收到訂單，安排到桌位 ' + (freeTableIndex + 1));
                                playSound('order', 0.65, 300);
                            }
                        } else {
                            orderingCustomer.serveDwell = Math.max(0, orderingCustomer.serveDwell - 0.01 * frameScale);
                        }
                    }
                }
            }
        }

        function checkCustomerDone(c) {
            const needsDrink = c.wantsDrink;
            // 敹��??��?皛輯雲暻萄?憌脫?(憒��??�閬��?閰?
            if (c.hasPasta && (!needsDrink || c.hasDrink)) {
                c.state = 'EATING';
                c.eatTimer = 0;
                if (c.tableIndex !== -1) {
                    tableStates[c.tableIndex] = 'EATING';
                }
                updateOrderUI(); // 蝡����?湔�堆���??∠?瘨�憭�
            }
        }

        function findNextKitchenOrder() {
            return customers.find(c => c.state === 'WAITING_FOOD' && !c.hasPasta)
                || customers.find(c => c.state === 'WAITING_FOOD' && c.wantsDrink && !c.hasDrink);
        }

        function getActiveDrinkTarget() {
            if (!activeOrder || activeOrder.state !== 'WAITING_FOOD') return null;
            return activeOrder.wantsDrink && !activeOrder.hasDrink ? activeOrder : null;
        }

        function isShakerHeld() {
            return dragItems.left === 'SHAKER' || dragItems.right === 'SHAKER';
        }

        function resetDrinkIfUnavailable() {
            if (LEVELS[currentLevelIndex].id !== 2) return;
            const drinkTarget = getActiveDrinkTarget();
            if (!drinkTarget) {
                if (dragItems.left === 'SHAKER') dragItems.left = null;
                if (dragItems.right === 'SHAKER') dragItems.right = null;
                drinkState = 'IDLE';
                shakeProgress = 0;
                return;
            }

            if (!isShakerHeld() && drinkState !== 'IDLE') {
                drinkState = 'IDLE';
                shakeProgress = 0;
            }
        }

        function updateOrderUI() {
            if ((macroState !== 'GAMEPLAY' && macroState !== 'ONLINE_GAMEPLAY') || microLocation !== 'KITCHEN') {
                orderContainer.innerHTML = '';
                return;
            }

            // 瘥��??嗅? UI ?��??賊??�摰Ｖ犖���?��??踹??餌? innerHTML ?�撱�
            const currentCards = orderContainer.querySelectorAll('.order-card');

            // ?�憿舐內�??券?擗��?蝑��??�摰Ｖ�?
            const pendingCustomers = customers.filter(c => c.state === 'WAITING_FOOD');
            
            const isConfused = activeDebuffs.confuseOrderUntil && performance.now() < activeDebuffs.confuseOrderUntil;
            let html = '';
            pendingCustomers.forEach((c, index) => {

                if (c.wantsDrink) typeText += ' + 飲料';

                const statusText = c.state === 'ORDERING' ? '點餐中' : '等餐中';

                    </div>
                `;

        }

        function handleHandLogic() {
            activeHandPositions = [];
            if (!handResult || handResult.landmarks.length === 0) {
                Body.setPosition(rightHandBody, { x: -100, y: -100 });
                lastHandPositions.left = null;
                lastHandPositions.right = null;
                checkDwellNavigation();
                checkUiDwellActions();
                return;
            }

            let rightHandIdx = -1;
            let leftHandIdx = -1;

            handResult.handednesses.forEach((h, idx) => {
                if (h[0].categoryName === 'Left') rightHandIdx = idx;
                else leftHandIdx = idx;
            });

            if (rightHandIdx !== -1) {
                const landmarks = handResult.landmarks[rightHandIdx];
                const palm = landmarks[9];
                const px = (1 - palm.x) * GAME_WIDTH;
                const py = palm.y * GAME_HEIGHT;
                activeHandPositions.push({ x: px, y: py, isRight: true, isFist: isFistGesture(landmarks) });

                if (isGameplayState()) {
                    if (microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE') {
                        Body.setPosition(rightHandBody, { x: -100, y: -100 });
                    } else {
                        Body.setPosition(rightHandBody, { x: px, y: py });
                    }
                } else {
                    Body.setPosition(rightHandBody, { x: -100, y: -100 });
                }
            } else {
                Body.setPosition(rightHandBody, { x: -100, y: -100 });
            }

            if (leftHandIdx !== -1) {
                const landmarks = handResult.landmarks[leftHandIdx];
                const palm = landmarks[9];
                const px = (1 - palm.x) * GAME_WIDTH;
                const py = palm.y * GAME_HEIGHT;
                activeHandPositions.push({ x: px, y: py, isRight: false, isFist: isFistGesture(landmarks) });

                if (isGameplayState()) {
                    if (microLocation === 'DINING_ROOM' && cleaningSubState === 'WIPE_TABLE') {
                        Body.setPosition(leftHandBody, { x: -100, y: -100 });
                    } else {
                        Body.setPosition(leftHandBody, { x: px, y: py });
                    }
                } else {
                    Body.setPosition(leftHandBody, { x: -100, y: -100 });
                }
            } else {
                Body.setPosition(leftHandBody, { x: -100, y: -100 });
            }

            // --- 蝯曹??��?蝛粹??�頛� (靘��??園??啁? activeHandPositions) ---
            if (isGameplayState()) {
                if (microLocation === 'TABLE_CLEANING') {
                    // ?孵神?行��?�頛� (?��??���航孛���)
                    if (cleaningSubState === 'WIPE_TABLE' && currentCleaningTable !== -1) {
                        activeHandPositions.forEach(pos => {
                            // 瑼Ｘ��?臬�衣１��唬遙�?撠���芣���??��?瘙?
                            stains.forEach(stain => {
                                if (!stain.cleaned) {
                                    const hitRadius = Math.max(stain.w, stain.h) * 0.42;
                                    const dist = Math.hypot(pos.x - stain.x, pos.y - stain.y);
                                    if (dist < hitRadius) {
                                        stain.cleaned = true;
                                        showTip('先把桌上的碗盤撥開');
                                    }
                                }
                            });

                            // ?寞?撌脫??��?擃�瘙⊥���??湔�啁蜇��脣漲
                            const cleanedCount = stains.filter(s => s.cleaned).length;
                            tableCleanProgress[currentCleaningTable] = (cleanedCount / stains.length) * 100;

                            if (tableCleanProgress[currentCleaningTable] >= 100 && cleaningSubState !== 'DONE') {
                                cleaningSubState = 'DONE';
                                tableStates[currentCleaningTable] = 'FREE';
                                dirtyPlates = Math.min(getMaxPlates(), dirtyPlates + 1);
                                tableCleanProgress[currentCleaningTable] = 0;
                                tableHasDrink[currentCleaningTable] = false;
                                showTip('桌面清好了，髒盤已送到洗手台');
                                playSound('clean', 0.7, 300);
                                setTimeout(() => { setMicroLocation('DINING_ROOM'); }, 800);
                            }
                        });
                    }
                }
                if (microLocation === 'SINK') {
                    if (washingPlate.dirtAmount > 0) {
                        handResult.landmarks.forEach((landmarks, idx) => {
                            // 靽格迤嚗��?雿輻��?∪??��??�頛荔��Left 璅�蝐支�?”?恍��?喳��?��?
                            const isRight = handResult.handednesses[idx][0].categoryName === 'Left';
                            const palm = landmarks[9];
                            const px = (1 - palm.x) * GAME_WIDTH;
                            const py = palm.y * GAME_HEIGHT;
                            checkScrubbing(px, py, isRight ? 'right' : 'left');
                        });
                    }
                }
                if (microLocation === 'COUNTER') {
                    // 蝘駁��?����?Ｗ馳?��??��?頛荔?蝣箔??芣??粹?蝯阡��
                    droppedMoney = [];
                }
                checkDwellNavigation();
                resetDrinkIfUnavailable();
                if (microLocation === 'KITCHEN' && activeOrder) {
                    handleCookingLogic();
                }
            }

            // ?湔��?�敺��?蝵殷?靘����摨�/雿�蝘�?文?雿輻��
            const currentHandSides = activeHandPositions.map(p => p.isRight ? 'right' : 'left');
            if (!currentHandSides.includes('left')) lastHandPositions.left = null;
            if (!currentHandSides.includes('right')) lastHandPositions.right = null;
            activeHandPositions.forEach(pos => {
                lastHandPositions[pos.isRight ? 'right' : 'left'] = { x: pos.x, y: pos.y };
            });

            checkUiDwellActions();
        }

        function handleCookingLogic() {
            if (!activeOrder || activeHandPositions.length === 0) return;

            // ?�甇�?�?���菜葫���?��??其?蝵?
            activeHandPositions.forEach(pos => {
                const px = pos.x;
                const py = pos.y;
                const handSide = pos.isRight ? 'right' : 'left';
                const isFist = pos.isFist;

                const {
                    rawPastaArea,
                    potAreas,
                    plateArea,
                    cilantroArea,
                    cementArea,
                    serveArea,
                    shakerArea
                } = getKitchenLayout();

                // --- 憌脫??�頛� ---
                if (LEVELS[currentLevelIndex].id === 2) {
                    const drinkTarget = getActiveDrinkTarget();
                    const otherHandSide = handSide === 'right' ? 'left' : 'right';

                    if (dragItems[handSide] === 'SHAKER' && !drinkTarget) {
                        dragItems[handSide] = null;
                        drinkState = 'IDLE';
                        shakeProgress = 0;
                    }

                    if (drinkTarget && isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'SHAKER' && px > shakerArea.x && px < shakerArea.x + shakerArea.w && py > shakerArea.y && py < shakerArea.y + shakerArea.h) {
                        if (drinkState === 'IDLE' || drinkState === 'READY') {
                            dragItems[handSide] = 'SHAKER';
                            playSound('pickup', 0.45, 120);
                            if (drinkState === 'READY') drinkState = 'READY'; // 靽��?
                            else drinkState = 'SHAKING';
                        }
                    }

                    if (dragItems[handSide] === 'SHAKER' && drinkTarget) {
                        if (drinkState === 'SHAKING') {
                            const lastPos = lastHandPositions[handSide];
                            if (lastPos) {
                                const dist = Math.hypot(px - lastPos.x, py - lastPos.y);
                                if (dist > 5) shakeProgress += dist;
                                if (dist > 12) playSound('stir', 0.28, 180);
                                if (shakeProgress >= SHAKE_THRESHOLD) {
                                    drinkState = 'READY';
                                    playSound('success', 0.55, 400);
                                }
                            }
                        }
                        
                        if (drinkState === 'READY' && px > serveArea.x && px < serveArea.x + serveArea.w && py > serveArea.y && py < serveArea.y + serveArea.h) {
                            if (drinkTarget) {
                                drinkTarget.hasDrink = true;
                                dragItems[handSide] = null;
                                drinkState = 'IDLE';
                                shakeProgress = 0;
                                updateScore(10);
                                showTip('飲料完成，請送給客人');
                                playSound('serve', 0.6, 300);
                                checkCustomerDone(drinkTarget);

                                activeOrder = findNextKitchenOrder();
                                cookState = activeOrder && !activeOrder.hasPasta ? 'PUT_PASTA' : 'IDLE';
                            }
                        }
                    }
                }

                // ?�?��?
                if (cookState === 'PUT_PASTA' || cookState === 'ASSEMBLY') {
                    const otherHandSide = handSide === 'right' ? 'left' : 'right';
                    if (pots.some(pot => pot.state === 'EMPTY') && isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'RAW_PASTA' && px > rawPastaArea.x && px < rawPastaArea.x + rawPastaArea.w && py > rawPastaArea.y && py < rawPastaArea.y + rawPastaArea.h) {
                        dragItems[handSide] = 'RAW_PASTA';
                        playSound('pickup', 0.45, 120);
                    }

                    const potIndex = getPotIndexAt(px, py, potAreas);
                    if (potIndex >= 0) {
                        const pot = pots[potIndex];
                        if (dragItems[handSide] === 'RAW_PASTA' && pot.state === 'EMPTY') {
                            dragItems[handSide] = null;
                            handOpenUntil[handSide] = Date.now() + 450;
                            pot.state = 'BOILING';
                            pot.progress = 0;
                            playSound('boil', 0.45, 500);
                        } else if (pot.state === 'READY' && isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'COOKED_PASTA' && !plateHasNoodles) {
                            dragItems[handSide] = 'COOKED_PASTA';
                            pot.state = 'EMPTY';
                            pot.progress = 0;
                            playSound('pickup', 0.45, 120);
                        }
                    }

                    if (isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'CEMENT' && activeOrder.orderType.includes('CEMENT') && !plateHasCement && px > cementArea.x && px < cementArea.x + cementArea.w && py > cementArea.y && py < cementArea.y + cementArea.h) {
                        dragItems[handSide] = 'CEMENT';
                        playSound('pickup', 0.45, 120);
                    }
                    if (isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'CILANTRO' && activeOrder.orderType.includes('CILANTRO') && !plateHasCilantro && px > cilantroArea.x && px < cilantroArea.x + cilantroArea.w && py > cilantroArea.y && py < cilantroArea.y + cilantroArea.h) {
                        dragItems[handSide] = 'CILANTRO';
                        playSound('pickup', 0.45, 120);
                    }

                    if (dragItems[handSide] && (dragItems[handSide] === 'COOKED_PASTA' || dragItems[handSide] === 'CEMENT' || dragItems[handSide] === 'CILANTRO') && px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        if (cleanPlates > 0 || plateHasNoodles || plateHasCement || plateHasCilantro) {
                            if (dragItems[handSide] === 'COOKED_PASTA') plateHasNoodles = true;
                            if (dragItems[handSide] === 'CEMENT') plateHasCement = true;
                            if (dragItems[handSide] === 'CILANTRO') plateHasCilantro = true;
                            dragItems[handSide] = null;
                            handOpenUntil[handSide] = Date.now() + 450;
                            playSound('drop', 0.45, 120);
                        } else {
                            showTip(`沒有乾淨盤子，請${getPlateShortageHint()}`);
                            playSound('error', 0.45, 400);
                        }
                    }

                    const needsCement = activeOrder.orderType.includes('CEMENT');
                    const needsCilantro = activeOrder.orderType.includes('CILANTRO');
                    if (plateHasNoodles && (plateHasCement || !needsCement) && (plateHasCilantro || !needsCilantro)) {
                        cookState = 'STIRRING';
                        stirProgress = 0;
                        lastHandPositions[handSide] = null;
                    }
                } else if (cookState === 'STIRRING') {
                    if (px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        const lastPos = lastHandPositions[handSide];
                        if (lastPos) {
                            const dist = Math.hypot(px - lastPos.x, py - lastPos.y);
                            stirProgress += dist;
                            if (dist > 12) playSound('stir', 0.26, 180);
                            if (stirProgress > STIR_THRESHOLD * getDebuffProgressMultiplier()) {
                                cookState = 'SERVE';
                                dragItems[handSide] = null;
                                playSound('success', 0.65, 400);
                            }
                        }
                        lastHandPositions[handSide] = { x: px, y: py };
                    } else {
                        lastHandPositions[handSide] = null;
                    }
                } else if (cookState === 'SERVE') {
                    const otherHandSide = handSide === 'right' ? 'left' : 'right';
                    if (isFist && !dragItems[handSide] && dragItems[otherHandSide] !== 'FINISHED_PLATE' && px > plateArea.x && px < plateArea.x + plateArea.w && py > plateArea.y && py < plateArea.y + plateArea.h) {
                        dragItems[handSide] = 'FINISHED_PLATE';
                        playSound('pickup', 0.45, 120);
                    }
                    if (dragItems[handSide] === 'FINISHED_PLATE' && px > serveArea.x && px < serveArea.x + serveArea.w && py > serveArea.y && py < serveArea.y + serveArea.h) {
                        if (cleanPlates > 0) {
                            cleanPlates--; 
                            plateCountEl.innerText = cleanPlates;

                            let target = customers.find(c => c.state === 'WAITING_FOOD' && c.orderType === activeOrder.orderType && !c.hasPasta);

                            if (target) {
                                target.hasPasta = true;
                                updateScore(25);
                                grantBattleItemIfNeeded();
                                showTip('餐點完成，請送到出餐口');
                                playSound('serve', 0.75, 300);
                                checkCustomerDone(target);
                            } else {
                                showTip('目前沒有對應的客人需求');
                                playSound('error', 0.45, 400);
                            }

                            dragItems[handSide] = null;
                            cookState = 'IDLE';
                            plateHasNoodles = plateHasCement = plateHasCilantro = false;

                            activeOrder = findNextKitchenOrder();
                            cookState = activeOrder && !activeOrder.hasPasta ? 'PUT_PASTA' : 'IDLE';
                        } else {
                            showTip(`沒有乾淨盤子，請${getPlateShortageHint()}`);
                            playSound('error', 0.45, 400);
                        }
                    }
                }
            });
        }

        function showTip(text) {
            tipText = text;
            tipTimer = 120;
        }

        function drawTipOverlay() {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const drawActionBanner = (x, y, width, height) => {
                if (actionBannerImg.complete && actionBannerImg.naturalWidth > 0) {
                    ctx.drawImage(actionBannerImg, x, y, width, height);
                    return;
                }
                ctx.fillStyle = 'rgba(18, 18, 18, 0.82)';
                ctx.fillRect(x, y, width, height);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, width, height);
            };

            const hint = getPersistentHint();
            if (hint) {
                ctx.font = 'bold 24px Arial';
                const width = Math.min(760, Math.max(320, ctx.measureText(hint).width + 58));
                const x = GAME_WIDTH / 2 - width / 2;
                const y = GAME_HEIGHT - 138;
                drawActionBanner(x, y, width, 58);
                ctx.fillStyle = '#fff3a3';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                ctx.fillText(hint, GAME_WIDTH / 2, y + 30);
                ctx.shadowBlur = 0;
            }

            if (tipTimer > 0) {
                tipTimer = Math.max(0, tipTimer - frameScale);
                ctx.font = 'bold 24px Arial';
                const width = Math.min(760, Math.max(360, ctx.measureText(tipText).width + 64));
                const x = GAME_WIDTH / 2 - width / 2;
                const y = 68;
                drawActionBanner(x, y, width, 62);
                ctx.fillStyle = '#f1c40f';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.fillText(tipText, GAME_WIDTH / 2, y + 32);
            }
            ctx.restore();
        }

        function drawCookingUI() {
            const {
                rawPastaArea,
                potAreas,
                plateArea,
                cilantroArea,
                cementArea,
                serveArea,
                shakerArea
            } = getKitchenLayout();

            ctx.save();

            if (false && cleanPlates === 0 && !plateHasNoodles) {

        function checkScrubbing(px, py, handType) {
            if (dirtyPlates <= 0 || cleanPlates >= getMaxPlates()) return;

            // 雿輻�刻��撖祇���??文?蝭��?嚗��??拙振摰寞??��?
            const margin = 50;
            if (px > washingPlate.x - margin && px < washingPlate.x + washingPlate.w + margin &&
                py > washingPlate.y - margin && py < washingPlate.y + washingPlate.h + margin) {

                const lastPos = lastHandPositions[handType];
                if (lastPos) {
                    const dist = Math.hypot(px - lastPos.x, py - lastPos.y);
                    // ?芣??��??��?蝘餅?閮��? (?����?���刻歲�??��??�隤�?歹?靘��? > 200px)
                    if (dist < 200) {
                        scrubAccumulator += dist;
                        washingPlate.dirtAmount = 100 - (scrubAccumulator / (SCRUB_THRESHOLD * getDebuffProgressMultiplier())) * 100;
                        if (dist > 8) playSound('wash', 0.32, 170);
                    }

                    if (washingPlate.dirtAmount <= 0) {
                        washingPlate.dirtAmount = 0;
                        dirtyPlates = Math.max(0, dirtyPlates - 1);
                        cleanPlates = Math.min(getMaxPlates(), cleanPlates + 1);
                        plateCountEl.innerText = cleanPlates;
                        playSound('clean', 0.7, 300);
                        // 蝘駁�斗���??����?����

                        scrubAccumulator = 0;
                        if (cleanPlates < getMaxPlates() && dirtyPlates > 0) {
                            washingPlate.dirtAmount = 100;
                        }
                    }
                }
                lastHandPositions[handType] = { x: px, y: py };
            } else {
                lastHandPositions[handType] = null;
            }
        }
